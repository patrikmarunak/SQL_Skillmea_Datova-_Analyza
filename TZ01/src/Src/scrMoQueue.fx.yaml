scrMoQueue As screen:
    Fill: =varTheme.Bg

    mqRoot As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(0,0,0,0)
        Height: =Parent.Height
        Width: =Parent.Width
        ZIndex: =1

        mqhdrBar As groupContainer.horizontalAutoLayoutContainer:
            Fill: =varTheme.Purple
            Height: =58
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingBottom: =12
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =12
            Width: =Parent.Width
            ZIndex: =10

            mqhdrBack As button:
                AlignInContainer: =AlignInContainer.Center
                BorderThickness: =0
                Color: =varTheme.White
                Fill: =RGBA(255, 255, 255, 0.14)
                Height: =34
                HoverColor: =varTheme.White
                HoverFill: =RGBA(255, 255, 255, 0.24)
                OnSelect: =Navigate(scrOverview, ScreenTransition.UnCoverRight)
                PressedColor: =varTheme.White
                PressedFill: =RGBA(255, 255, 255, 0.24)
                Size: =12
                Text: ="< Back"
                Width: =92
                ZIndex: =1

            mqhdrTitle As label:
                AlignInContainer: =AlignInContainer.Center
                Color: =varTheme.White
                FillPortions: =1
                FontWeight: =FontWeight.Semibold
                Height: =34
                Size: =16
                Text: ="MIDDLE OFFICE — MY QUEUE"
                ZIndex: =2

            mqhdrRoleSeg As groupContainer.horizontalAutoLayoutContainer:
                AlignInContainer: =AlignInContainer.Center
                Fill: =RGBA(255, 255, 255, 0.13)
                Height: =34
                LayoutGap: =4
                PaddingBottom: =3
                PaddingLeft: =3
                PaddingRight: =3
                PaddingTop: =3
                Visible: =IsBlank(varRoleResolved)
                Width: =240
                ZIndex: =3

                mqhdrMO As button:
                    BorderThickness: =0
                    Color: =If(varRole="MO", varTheme.Purple, RGBA(227,214,237,1))
                    Fill: =If(varRole="MO", varTheme.White, RGBA(255,255,255,0))
                    FillPortions: =1
                    Height: =28
                    OnSelect: =Set(varRole, "MO"); Navigate(scrOverview, ScreenTransition.Fade)
                    Size: =11
                    Text: ="Middle Office"
                    ZIndex: =1

                mqhdrFO As button:
                    BorderThickness: =0
                    Color: =If(varRole="FO", varTheme.Purple, RGBA(227,214,237,1))
                    Fill: =If(varRole="FO", varTheme.White, RGBA(255,255,255,0))
                    FillPortions: =1
                    Height: =28
                    OnSelect: =Set(varRole, "FO"); Navigate(scrInbox, ScreenTransition.Fade)
                    Size: =11
                    Text: ="Front Office"
                    ZIndex: =2

            mqhdrLogo As label:
                Align: =Align.Center
                AlignInContainer: =AlignInContainer.Center
                BorderColor: =RGBA(255, 255, 255, 0.4)
                BorderStyle: =BorderStyle.Dashed
                BorderThickness: =1
                Color: =varTheme.White
                Height: =30
                Size: =11
                Text: ="[ logo ]"
                Width: =110
                ZIndex: =4

            mqhdrUser As label:
                Align: =Align.Right
                AlignInContainer: =AlignInContainer.Center
                Color: =RGBA(227, 214, 237, 1)
                Height: =30
                Size: =11
                Text: ="Signed in as " & Coalesce(varUser.FullName, varUser.Email, "Demo user") & "  ·  " & varRole
                Width: =220
                ZIndex: =5

        mqftBar As groupContainer.horizontalAutoLayoutContainer:
            BorderColor: =varTheme.Line
            BorderThickness: =1
            Fill: =RGBA(250, 250, 250, 1)
            Height: =56
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =9
            LayoutJustifyContent: =LayoutJustifyContent.End
            PaddingBottom: =10
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =10
            Width: =Parent.Width
            ZIndex: =10

            mqBack As button:
                AlignInContainer: =AlignInContainer.Center
                BorderThickness: =0
                Color: =varTheme.White
                Fill: =varTheme.Orange
                Height: =34
                OnSelect: =Navigate(scrOverview, ScreenTransition.UnCover)
                Size: =12
                Text: ="Back to overview"
                ZIndex: =1

        mqBody As groupContainer.verticalAutoLayoutContainer:
            Fill: =RGBA(0,0,0,0)
            LayoutGap: =10
            PaddingBottom: =14
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =14
            Width: =Parent.Width
            ZIndex: =20

            mqHelp As label:
                AlignInContainer: =AlignInContainer.Stretch
                BorderColor: =RGBA(234,217,243,1)
                BorderThickness: =1
                Color: =varTheme.Muted
                Fill: =RGBA(251,247,254,1)
                Height: =42
                PaddingLeft: =14
                PaddingTop: =8
                Size: =11
                Text: ="Your Middle Office queue — every finding you sent to Front Office, across all reports, in one place. Replied items are ready for you to act on."
                Width: =Parent.Width
                ZIndex: =1

            mqEye1 As label:
                AlignInContainer: =AlignInContainer.Start
                Color: =varTheme.Ink
                FontWeight: =FontWeight.Semibold
                Height: =20
                Size: =11
                Text: ="REPLIED — READY FOR YOU"
                ZIndex: =1

            mqEye2 As label:
                AlignInContainer: =AlignInContainer.Start
                Color: =varTheme.Ink
                FontWeight: =FontWeight.Semibold
                Height: =20
                Size: =11
                Text: ="STILL WITH FRONT OFFICE"
                ZIndex: =1

            mqTools As groupContainer.horizontalAutoLayoutContainer:
                Fill: =RGBA(0,0,0,0)
                Height: =40
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =8
                Width: =Parent.Width
                ZIndex: =2

                mqSearch As text:
                    AlignInContainer: =AlignInContainer.Center
                    Default: =""
                    Height: =36
                    HintText: ="Search transaction or reviewer…"
                    OnChange: =Set(varSearchQueue, Self.Text)
                    Width: =300
                    ZIndex: =1

                mqToolSpace As label:
                    FillPortions: =1
                    Height: =20
                    Text: =""
                    ZIndex: =3

            rvHead As groupContainer.horizontalAutoLayoutContainer:
                Fill: =RGBA(0,0,0,0)
                Height: =34
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =8
                Visible: =CountRows(Filter(colTransactions, !FOSent, Not(LookUp(colChecks, ID=DailyReportCheckID).Completed))) > 0
                Width: =Parent.Width
                ZIndex: =2

                rvEye As label:
                    Color: =varTheme.Ink
                    FillPortions: =1
                    FontWeight: =FontWeight.Semibold
                    Height: =24
                    Size: =11
                    Text: ="TO REVIEW — NOT SENT YET"
                    ZIndex: =1

                rvSend As button:
                    AlignInContainer: =AlignInContainer.Center
                    BorderThickness: =0
                    Color: =varTheme.White
                    DisabledColor: =varTheme.Faint
                    DisabledFill: =RGBA(240,240,240,1)
                    DisplayMode: =If(varRole="MO" && CountRows(Filter(colTransactions, FlaggedToFO, !FOSent))>0, DisplayMode.Edit, DisplayMode.Disabled)
                    Fill: =varTheme.Blue
                    Height: =30
                    OnSelect: |-
                        =With({toSend: Filter(colTransactions, FlaggedToFO, !FOSent)}, If(CountRows(Filter(toSend As T2, LookUp(colReasonConfig, AppliesTo="MO" && ReportType=T2.ReportType && CheckNumber=T2.CheckNumber && Reason=T2.MOReason).RequiresComment && IsBlank(T2.MOComment)))>0, Notify("Add a comment before sending to FO", NotificationType.Error), Set(varConfirmQSend, true)))
                    Size: =11
                    Text: ="Send flagged to FO (" & CountRows(Filter(colTransactions, FlaggedToFO, !FOSent)) & ")"
                    Width: =210
                    ZIndex: =2

            "galMqReview As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                Items: =Filter(colTransactions, !FOSent, Not(LookUp(colChecks, ID=DailyReportCheckID).Completed), (varSearchQueue="" || varSearchQueue in TransactionNo || varSearchQueue in MOReason))
                Layout: =Layout.Vertical
                TemplatePadding: =8
                TemplateSize: =212
                Visible: =CountRows(Filter(colTransactions, !FOSent, Not(LookUp(colChecks, ID=DailyReportCheckID).Completed))) > 0
                Width: =Parent.Width
                ZIndex: =2

                rvCard As groupContainer.verticalAutoLayoutContainer:
                    BorderColor: =varTheme.Line
                    BorderThickness: =1
                    Fill: =varTheme.Card
                    Height: =Parent.TemplateHeight - 10
                    LayoutGap: =7
                    PaddingBottom: =12
                    PaddingLeft: =14
                    PaddingRight: =14
                    PaddingTop: =12
                    Width: =Parent.TemplateWidth - 4
                    X: =2
                    Y: =2
                    ZIndex: =1

                    rvWhere As label:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =varTheme.Ink
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        Size: =12
                        Text: =ThisItem.ReportType & " · Check " & ThisItem.CheckNumber & " · " & ThisItem.TransactionNo & If(ThisItem.FlaggedToFO, "   •  flagged to FO", "")
                        Width: =Parent.Width
                        ZIndex: =1

                    rvRow As groupContainer.horizontalAutoLayoutContainer:
                        Fill: =RGBA(0,0,0,0)
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =Parent.Width
                        ZIndex: =2

                        rvReason As dropdown:
                            AlignInContainer: =AlignInContainer.Center
                            Default: =ThisItem.MOReason
                            DisplayMode: =If(varRole="MO", DisplayMode.Edit, DisplayMode.Disabled)
                            Height: =36
                            Items: =SortByColumns(Filter(colReasonConfig, ReportType=ThisItem.ReportType, CheckNumber=ThisItem.CheckNumber, AppliesTo<>"FO"), "Sort").Reason
                            OnChange: |-
                                =/* PROD: mirror to 'TZ01 Daily Transactions' (MO-owned columns) */ Patch(colTransactions, ThisItem, {MOReason:Self.Selected.Value, _isDirty:true, _state:"modified"}); If(LookUp(colReasonConfig, AppliesTo="MO" && ReportType=ThisItem.ReportType && CheckNumber=ThisItem.CheckNumber && Reason=Self.Selected.Value).AutoFlagFO && !ThisItem.FlaggedToFO, Patch(colTransactions, ThisItem, {FlaggedToFO:true, FOReviewer:Coalesce(ThisItem.FOReviewer, If(ThisItem.ReportType="MM", "fo.mm@mdlz.com", "fo.fx@mdlz.com")), _isDirty:true}))
                            Width: =180
                            ZIndex: =1

                        rvComment As text:
                            AlignInContainer: =AlignInContainer.Center
                            Default: =ThisItem.MOComment
                            DisplayMode: =If(varRole="MO", DisplayMode.Edit, DisplayMode.Disabled)
                            FillPortions: =1
                            Height: =36
                            HintText: ="MO comment for FO"
                            OnChange: |-
                                =Patch(colTransactions, ThisItem, {MOComment:Self.Text, _isDirty:true, _state:"modified"})
                            ZIndex: =2

                        rvFlag As checkbox:
                            AlignInContainer: =AlignInContainer.Center
                            Default: =ThisItem.FlaggedToFO
                            DisplayMode: =If(varRole="MO", DisplayMode.Edit, DisplayMode.Disabled)
                            Height: =36
                            OnCheck: |-
                                =Patch(colTransactions, ThisItem, {FlaggedToFO:true, FOReviewer:Coalesce(ThisItem.FOReviewer, If(ThisItem.ReportType="MM", "fo.mm@mdlz.com", "fo.fx@mdlz.com")), _isDirty:true, _state:"modified"})
                            OnUncheck: |-
                                =Patch(colTransactions, ThisItem, {FlaggedToFO:false, _isDirty:true, _state:"modified"})
                            Text: ="Flag FO"
                            Width: =90
                            ZIndex: =3

                        rvOpen As button:
                            AlignInContainer: =AlignInContainer.Center
                            BorderColor: =varTheme.Line
                            BorderThickness: =1
                            Color: =varTheme.Muted
                            Fill: =varTheme.Card
                            Height: =34
                            OnSelect: =Set(varCurrentReport, LookUp(colDailyReports, ID=ThisItem.DailyReportID)); Set(varCurrentCheck, LookUp(colChecks, ID=ThisItem.DailyReportCheckID)); Navigate(scrCheckDetail, ScreenTransition.Cover)
                            Size: =11
                            Text: ="Open check"
                            Width: =110
                            ZIndex: =4

                        rvComplete As button:
                            AlignInContainer: =AlignInContainer.Center
                            BorderThickness: =0
                            Color: =varTheme.White
                            DisabledColor: =varTheme.Faint
                            DisabledFill: =RGBA(240,240,240,1)
                            DisplayMode: |-
                                =If(varRole="MO" && With({tx: Filter(colTransactions, DailyReportCheckID = ThisItem.DailyReportCheckID)}, CountRows(tx)>0 && CountRows(Filter(tx, FlaggedToFO && Not(FOSent && !IsBlank(FORespondedOn) && FORespondedOn >= FOSentOn)))=0 && CountRows(Filter(tx, IsBlank(MOReason)))=0), DisplayMode.Edit, DisplayMode.Disabled)
                            Fill: =varTheme.Green
                            Height: =34
                            OnSelect: |-
                                =Patch(colChecks, LookUp(colChecks, ID=ThisItem.DailyReportCheckID), {Completed:true}); Set(varAuditSeq, varAuditSeq + 1); Collect(colAudit, {Seq: varAuditSeq, Stamp: Now(), Text: "Check completed from queue — " & ThisItem.TransactionNo}); Notify("Check completed", NotificationType.Success)
                            Size: =11
                            Text: ="Complete check"
                            Tooltip: ="Set an MO reason on every finding of this check (and resolve or answer any flagged item) first"
                            Width: =150
                            ZIndex: =5

                    rvFoRRec As groupContainer.verticalAutoLayoutContainer:
                        BorderColor: =varTheme.Line
                        BorderThickness: =1
                        Fill: =RGBA(246,246,247,1)
                        Height: =74
                        LayoutGap: =2
                        PaddingBottom: =3
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =3
                        Width: =Parent.Width
                        ZIndex: =3

                        rvFoRBar As groupContainer.horizontalAutoLayoutContainer:
                            Fill: =RGBA(0,0,0,0)
                            Height: =22
                            LayoutAlignItems: =LayoutAlignItems.Center
                            LayoutGap: =6
                            Width: =Parent.Width
                            ZIndex: =0

                            rvFoRCnt As label:
                                Color: =varTheme.Muted
                                FillPortions: =1
                                Height: =20
                                Size: =10
                                Text: |-
                                    =CountRows(If(ThisItem.ID in colExpanded.Value, ForAll(SortByColumns(Filter(colAllColsForListing, Listing = ThisItem.ReportType), "Order") As R, {ColName: R.ColName, Align: R.Align}), ForAll(SortByColumns(Filter(colCheckColumns, Report = ThisItem.ReportType, CheckNo = ThisItem.CheckNumber), "Order") As R, {ColName: R.ColName, Align: R.Align}))) & " of " & CountRows(Filter(colAllColsForListing, Listing = ThisItem.ReportType)) & " cols"
                                ZIndex: =1

                            rvFoRTog As button:
                                AlignInContainer: =AlignInContainer.Center
                                BorderColor: =varTheme.Line
                                BorderThickness: =1
                                Color: =If(ThisItem.ID in colExpanded.Value, varTheme.White, varTheme.Muted)
                                Fill: =If(ThisItem.ID in colExpanded.Value, varTheme.Blue, varTheme.Card)
                                Height: =22
                                OnSelect: |-
                                    =If(ThisItem.ID in colExpanded.Value, RemoveIf(colExpanded, Value = ThisItem.ID), Collect(colExpanded, {Value: ThisItem.ID}))
                                Size: =10
                                Text: =If(ThisItem.ID in colExpanded.Value, "Show relevant columns", "Show all columns")
                                ZIndex: =2

                        "rvFoRHdr As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                            Height: =18
                            Items: |-
                                =If(ThisItem.ID in colExpanded.Value, ForAll(SortByColumns(Filter(colAllColsForListing, Listing = ThisItem.ReportType), "Order") As R, {ColName: R.ColName, Align: R.Align}), ForAll(SortByColumns(Filter(colCheckColumns, Report = ThisItem.ReportType, CheckNo = ThisItem.CheckNumber), "Order") As R, {ColName: R.ColName, Align: R.Align}))
                            ShowScrollbar: =false
                            TemplatePadding: =0
                            TemplateSize: =140
                            Width: =Parent.Width
                            ZIndex: =1

                            rvFoRHdrLbl As label:
                                Align: =If(ThisItem.Align="right", Align.Right, Align.Left)
                                Color: =varTheme.Muted
                                FontWeight: =FontWeight.Semibold
                                Height: =Parent.TemplateHeight
                                Size: =10
                                Text: =ThisItem.ColName
                                Width: =Parent.TemplateWidth - 8
                                Wrap: =false
                                X: =4
                                ZIndex: =1

                        "rvFoRCells As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                            Height: =24
                            Items: |-
                                =ForAll(If(ThisItem.ID in colExpanded.Value, ForAll(SortByColumns(Filter(colAllColsForListing, Listing = ThisItem.ReportType), "Order") As R, {ColName: R.ColName, Align: R.Align}), ForAll(SortByColumns(Filter(colCheckColumns, Report = ThisItem.ReportType, CheckNo = ThisItem.CheckNumber), "Order") As R, {ColName: R.ColName, Align: R.Align})) As V, {ColName: V.ColName, Align: V.Align, Value: Coalesce(LookUp(colTxnCells, TxnID = ThisItem.ID && ColName = V.ColName).Value, "—")})
                            TemplatePadding: =0
                            TemplateSize: =140
                            Width: =Parent.Width
                            ZIndex: =2

                            rvFoRCellLbl As label:
                                Align: =If(ThisItem.Align="right", Align.Right, Align.Left)
                                Color: =varTheme.Ink
                                Height: =Parent.TemplateHeight
                                Size: =11
                                Text: =ThisItem.Value
                                Width: =Parent.TemplateWidth - 8
                                Wrap: =false
                                X: =4
                                ZIndex: =1

            "galMqReplied As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                Items: =Filter(colTransactions, FlaggedToFO, FOSent, Not(LookUp(colChecks, ID=DailyReportCheckID).Completed), (varSearchQueue="" || varSearchQueue in TransactionNo || varSearchQueue in FOReviewer), (FOSent && !IsBlank(FORespondedOn) && FORespondedOn >= FOSentOn))
                Layout: =Layout.Vertical
                TemplatePadding: =8
                TemplateSize: =330
                Visible: =CountRows(Filter(colTransactions, FlaggedToFO, FOSent, Not(LookUp(colChecks, ID=DailyReportCheckID).Completed), (varSearchQueue="" || varSearchQueue in TransactionNo || varSearchQueue in FOReviewer), (FOSent && !IsBlank(FORespondedOn) && FORespondedOn >= FOSentOn))) > 0
                Width: =Parent.Width
                ZIndex: =3

                mrCard As groupContainer.verticalAutoLayoutContainer:
                    BorderColor: =RGBA(188,214,188,1)
                    BorderThickness: =1
                    Fill: =varTheme.Card
                    Height: =Parent.TemplateHeight - 10
                    LayoutGap: =7
                    PaddingBottom: =12
                    PaddingLeft: =14
                    PaddingRight: =14
                    PaddingTop: =12
                    Width: =Parent.TemplateWidth - 4
                    X: =2
                    Y: =2
                    ZIndex: =1

                    mrWhere As label:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =varTheme.Ink
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        Size: =12
                        Text: =ThisItem.ReportType & " · Check " & ThisItem.CheckNumber & " · " & ThisItem.TransactionNo
                        Width: =Parent.Width
                        ZIndex: =1

                    mrAsk As label:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =varTheme.Muted
                        Height: =44
                        Size: =11
                        Text: |-
                            ="You asked " & Left(ThisItem.FOReviewer, Find("@", ThisItem.FOReviewer & "@") - 1) & "  ·  reason: " & ThisItem.MOReason & Char(10) & ThisItem.MOComment
                        Width: =Parent.Width
                        ZIndex: =2

                    mrFoRRec As groupContainer.verticalAutoLayoutContainer:
                        BorderColor: =varTheme.Line
                        BorderThickness: =1
                        Fill: =RGBA(246,246,247,1)
                        Height: =74
                        LayoutGap: =2
                        PaddingBottom: =3
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =3
                        Width: =Parent.Width
                        ZIndex: =3

                        mrFoRBar As groupContainer.horizontalAutoLayoutContainer:
                            Fill: =RGBA(0,0,0,0)
                            Height: =22
                            LayoutAlignItems: =LayoutAlignItems.Center
                            LayoutGap: =6
                            Width: =Parent.Width
                            ZIndex: =0

                            mrFoRCnt As label:
                                Color: =varTheme.Muted
                                FillPortions: =1
                                Height: =20
                                Size: =10
                                Text: |-
                                    =CountRows(If(ThisItem.ID in colExpanded.Value, ForAll(SortByColumns(Filter(colAllColsForListing, Listing = ThisItem.ReportType), "Order") As R, {ColName: R.ColName, Align: R.Align}), ForAll(SortByColumns(Filter(colCheckColumns, Report = ThisItem.ReportType, CheckNo = ThisItem.CheckNumber), "Order") As R, {ColName: R.ColName, Align: R.Align}))) & " of " & CountRows(Filter(colAllColsForListing, Listing = ThisItem.ReportType)) & " cols"
                                ZIndex: =1

                            mrFoRTog As button:
                                AlignInContainer: =AlignInContainer.Center
                                BorderColor: =varTheme.Line
                                BorderThickness: =1
                                Color: =If(ThisItem.ID in colExpanded.Value, varTheme.White, varTheme.Muted)
                                Fill: =If(ThisItem.ID in colExpanded.Value, varTheme.Blue, varTheme.Card)
                                Height: =22
                                OnSelect: |-
                                    =If(ThisItem.ID in colExpanded.Value, RemoveIf(colExpanded, Value = ThisItem.ID), Collect(colExpanded, {Value: ThisItem.ID}))
                                Size: =10
                                Text: =If(ThisItem.ID in colExpanded.Value, "Show relevant columns", "Show all columns")
                                ZIndex: =2

                        "mrFoRHdr As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                            Height: =18
                            Items: |-
                                =If(ThisItem.ID in colExpanded.Value, ForAll(SortByColumns(Filter(colAllColsForListing, Listing = ThisItem.ReportType), "Order") As R, {ColName: R.ColName, Align: R.Align}), ForAll(SortByColumns(Filter(colCheckColumns, Report = ThisItem.ReportType, CheckNo = ThisItem.CheckNumber), "Order") As R, {ColName: R.ColName, Align: R.Align}))
                            ShowScrollbar: =false
                            TemplatePadding: =0
                            TemplateSize: =140
                            Width: =Parent.Width
                            ZIndex: =1

                            mrFoRHdrLbl As label:
                                Align: =If(ThisItem.Align="right", Align.Right, Align.Left)
                                Color: =varTheme.Muted
                                FontWeight: =FontWeight.Semibold
                                Height: =Parent.TemplateHeight
                                Size: =10
                                Text: =ThisItem.ColName
                                Width: =Parent.TemplateWidth - 8
                                Wrap: =false
                                X: =4
                                ZIndex: =1

                        "mrFoRCells As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                            Height: =24
                            Items: |-
                                =ForAll(If(ThisItem.ID in colExpanded.Value, ForAll(SortByColumns(Filter(colAllColsForListing, Listing = ThisItem.ReportType), "Order") As R, {ColName: R.ColName, Align: R.Align}), ForAll(SortByColumns(Filter(colCheckColumns, Report = ThisItem.ReportType, CheckNo = ThisItem.CheckNumber), "Order") As R, {ColName: R.ColName, Align: R.Align})) As V, {ColName: V.ColName, Align: V.Align, Value: Coalesce(LookUp(colTxnCells, TxnID = ThisItem.ID && ColName = V.ColName).Value, "—")})
                            TemplatePadding: =0
                            TemplateSize: =140
                            Width: =Parent.Width
                            ZIndex: =2

                            mrFoRCellLbl As label:
                                Align: =If(ThisItem.Align="right", Align.Right, Align.Left)
                                Color: =varTheme.Ink
                                Height: =Parent.TemplateHeight
                                Size: =11
                                Text: =ThisItem.Value
                                Width: =Parent.TemplateWidth - 8
                                Wrap: =false
                                X: =4
                                ZIndex: =1

                    mrFo As label:
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =RGBA(207,227,207,1)
                        BorderThickness: =1
                        Color: =varTheme.Green
                        Fill: =RGBA(243,248,243,1)
                        Height: =44
                        PaddingLeft: =10
                        PaddingTop: =4
                        Size: =12
                        Text: ="FO reply (" & ThisItem.FOReason & ")" & Char(10) & ThisItem.FOComment
                        Width: =Parent.Width
                        ZIndex: =3

                    mrForm As groupContainer.horizontalAutoLayoutContainer:
                        Fill: =RGBA(0,0,0,0)
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =Parent.Width
                        ZIndex: =4

                        mrNewReason As dropdown:
                            AlignInContainer: =AlignInContainer.Center
                            Default: =ThisItem.MOReason
                            Height: =36
                            Items: =SortByColumns(Filter(colReasonConfig, ReportType=ThisItem.ReportType, CheckNumber=ThisItem.CheckNumber, AppliesTo<>"FO"), "Sort").Reason
                            Width: =180
                            ZIndex: =1

                        mrNewComment As text:
                            AlignInContainer: =AlignInContainer.Center
                            Default: =""
                            FillPortions: =1
                            Height: =36
                            HintText: ="New comment to FO (required to resend)"
                            ZIndex: =2

                    mrRow As groupContainer.horizontalAutoLayoutContainer:
                        Fill: =RGBA(0,0,0,0)
                        Height: =38
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        Width: =Parent.Width
                        ZIndex: =5

                        mrComplete As button:
