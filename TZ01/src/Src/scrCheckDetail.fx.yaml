scrCheckDetail As screen:
    Fill: =varTheme.Bg
    OnVisible: |-
        =Set(varShowAll, false); Set(varVisibleCols, ForAll(SortByColumns(Filter(colCheckColumns, Report = varCurrentCheck.ReportType, CheckNo = varCurrentCheck.CheckNumber), "Order") As R, {ColName: R.ColName, Align: R.Align, Order: R.Order}))

    cdRoot As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(0,0,0,0)
        Height: =Parent.Height
        Width: =Parent.Width
        ZIndex: =1

        cdhdrBar As groupContainer.horizontalAutoLayoutContainer:
            Fill: =varTheme.Purple
            Height: =58
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingBottom: =12
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =12
            Width: =Parent.Width
            ZIndex: =10

            cdhdrBack As button:
                AlignInContainer: =AlignInContainer.Center
                BorderThickness: =0
                Color: =varTheme.White
                Fill: =RGBA(255, 255, 255, 0.14)
                Height: =34
                HoverColor: =varTheme.White
                HoverFill: =RGBA(255, 255, 255, 0.24)
                OnSelect: =Navigate(If(varRole="FO", scrInbox, scrChecks), ScreenTransition.UnCoverRight)
                PressedColor: =varTheme.White
                PressedFill: =RGBA(255, 255, 255, 0.24)
                Size: =12
                Text: ="< Back"
                Width: =92
                ZIndex: =1

            cdhdrTitle As label:
                AlignInContainer: =AlignInContainer.Center
                Color: =varTheme.White
                FillPortions: =1
                FontWeight: =FontWeight.Semibold
                Height: =34
                Size: =16
                Text: ="CHECK DETAIL"
                ZIndex: =2

            cdhdrRoleSeg As groupContainer.horizontalAutoLayoutContainer:
                AlignInContainer: =AlignInContainer.Center
                Fill: =RGBA(255, 255, 255, 0.13)
                Height: =34
                LayoutGap: =4
                PaddingBottom: =3
                PaddingLeft: =3
                PaddingRight: =3
                PaddingTop: =3
                Visible: =IsBlank(varRoleResolved)
                Width: =240
                ZIndex: =3

                cdhdrMO As button:
                    BorderThickness: =0
                    Color: =If(varRole="MO", varTheme.Purple, RGBA(227,214,237,1))
                    Fill: =If(varRole="MO", varTheme.White, RGBA(255,255,255,0))
                    FillPortions: =1
                    Height: =28
                    OnSelect: =Set(varRole, "MO"); Navigate(scrOverview, ScreenTransition.Fade)
                    Size: =11
                    Text: ="Middle Office"
                    ZIndex: =1

                cdhdrFO As button:
                    BorderThickness: =0
                    Color: =If(varRole="FO", varTheme.Purple, RGBA(227,214,237,1))
                    Fill: =If(varRole="FO", varTheme.White, RGBA(255,255,255,0))
                    FillPortions: =1
                    Height: =28
                    OnSelect: =Set(varRole, "FO"); Navigate(scrInbox, ScreenTransition.Fade)
                    Size: =11
                    Text: ="Front Office"
                    ZIndex: =2

            cdhdrLogo As label:
                Align: =Align.Center
                AlignInContainer: =AlignInContainer.Center
                BorderColor: =RGBA(255, 255, 255, 0.4)
                BorderStyle: =BorderStyle.Dashed
                BorderThickness: =1
                Color: =varTheme.White
                Height: =30
                Size: =11
                Text: ="[ logo ]"
                Width: =110
                ZIndex: =4

            cdhdrUser As label:
                Align: =Align.Right
                AlignInContainer: =AlignInContainer.Center
                Color: =RGBA(227, 214, 237, 1)
                Height: =30
                Size: =11
                Text: ="Signed in as " & Coalesce(varUser.FullName, varUser.Email, "Demo user") & "  ·  " & varRole
                Width: =220
                ZIndex: =5

        cdftBar As groupContainer.horizontalAutoLayoutContainer:
            BorderColor: =varTheme.Line
            BorderThickness: =1
            Fill: =RGBA(250, 250, 250, 1)
            Height: =56
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =9
            LayoutJustifyContent: =LayoutJustifyContent.End
            PaddingBottom: =10
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =10
            Width: =Parent.Width
            ZIndex: =10

            cdHint As label:
                Color: =If(CountRows(Filter(colTransactions, _isDirty)) > 0, varTheme.Amber, varTheme.Muted)
                FillPortions: =1
                Height: =30
                Size: =11
                Text: =If(CountRows(Filter(colTransactions, _isDirty)) > 0, "● " & CountRows(Filter(colTransactions, _isDirty)) & " unsaved edit(s) — Save draft to keep them", "Flag rows for FO here, then send them together from the Check Analysis screen.")
                ZIndex: =1

            cdSave As button:
                AlignInContainer: =AlignInContainer.Center
                BorderColor: =varTheme.Line
                BorderThickness: =1
                Color: =varTheme.Muted
                Fill: =varTheme.Card
                Height: =34
                OnSelect: |-
                    =UpdateIf(colTransactions, _isDirty, {_isDirty:false, _state:"loaded"}); Notify("Draft saved", NotificationType.Success)
                Size: =12
                Text: ="Save draft"
                Width: =110
                ZIndex: =2

            cdComplete As button:
                AlignInContainer: =AlignInContainer.Center
                BorderThickness: =0
                Color: =varTheme.White
                DisabledColor: =varTheme.Faint
                DisabledFill: =RGBA(240,240,240,1)
                DisplayMode: |-
                    =If(With({tx: Filter(colTransactions, DailyReportCheckID=varCurrentCheck.ID)}, CountRows(tx)>0 && CountRows(Filter(tx, FlaggedToFO && Not(FOSent && !IsBlank(FORespondedOn) && FORespondedOn >= FOSentOn)))=0 && CountRows(Filter(tx, IsBlank(MOReason)))=0), DisplayMode.Edit, DisplayMode.Disabled)
                Fill: =varTheme.Green
                Height: =34
                OnSelect: =Set(varConfirmComplete, true)
                Size: =12
                Text: ="Mark check complete"
                Tooltip: |-
                    =If(With({tx: Filter(colTransactions, DailyReportCheckID=varCurrentCheck.ID)}, CountRows(tx)>0 && CountRows(Filter(tx, FlaggedToFO && Not(FOSent && !IsBlank(FORespondedOn) && FORespondedOn >= FOSentOn)))=0 && CountRows(Filter(tx, IsBlank(MOReason)))=0), "Mark this check complete", "Resolve all flagged items (awaiting FO) and set an MO reason on every finding first")
                Width: =190
                ZIndex: =3

        cdBody As groupContainer.verticalAutoLayoutContainer:
            Fill: =RGBA(0,0,0,0)
            LayoutGap: =10
            PaddingBottom: =14
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =14
            Width: =Parent.Width
            ZIndex: =20

            cdCrumb As label:
                AlignInContainer: =AlignInContainer.Stretch
                Color: =varTheme.Muted
                FontWeight: =FontWeight.Semibold
                Height: =18
                Size: =11
                Text: =varSelectedItem.DayKey & "   ›   " & varCurrentReport.ReportType & " Listing   ›   " & varCurrentCheck.CheckName
                ZIndex: =2

            cdSub As groupContainer.horizontalAutoLayoutContainer:
                Fill: =RGBA(0,0,0,0)
                Height: =34
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =8
                Width: =Parent.Width
                ZIndex: =2

                cdTitle As label:
                    Color: =varTheme.Ink
                    FillPortions: =1
                    FontWeight: =FontWeight.Semibold
                    Height: =24
                    Size: =11
                    Text: ="FLAGGED TRANSACTIONS · " & Upper(varCurrentCheck.CheckName)
                    ZIndex: =1

                cdAttach As button:
                    AlignInContainer: =AlignInContainer.Center
                    BorderColor: =varTheme.Line
                    BorderThickness: =1
                    Color: =varTheme.Muted
                    Fill: =varTheme.Card
                    Height: =30
                    OnSelect: =Notify("Evidence attached", NotificationType.Success)
                    Size: =11
                    Text: ="Attach check evidence"
                    Width: =170
                    ZIndex: =2

            cdTools As groupContainer.horizontalAutoLayoutContainer:
                Fill: =RGBA(0,0,0,0)
                Height: =40
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =8
                Visible: =CountRows(Filter(colTransactions, DailyReportCheckID = varCurrentCheck.ID)) > 0
                Width: =Parent.Width
                ZIndex: =3

                cdSearch As text:
                    AlignInContainer: =AlignInContainer.Center
                    Default: =""
                    Height: =36
                    HintText: ="Search transaction no…"
                    OnChange: =Set(varSearchTxn, Self.Text)
                    Width: =260
                    ZIndex: =1

                cdStateFilter As dropdown:
                    AlignInContainer: =AlignInContainer.Center
                    Default: ="All"
                    Height: =36
                    Items: =["All", "Unflagged", "Queued", "Sent", "Replied"]
                    OnChange: =Set(varFoStateFilter, Self.Selected.Value)
                    Width: =150
                    ZIndex: =2

                cdShowAll As button:
                    AlignInContainer: =AlignInContainer.Center
                    BorderColor: =varTheme.Line
                    BorderThickness: =1
                    Color: =If(varShowAll, varTheme.White, varTheme.Muted)
                    Fill: =If(varShowAll, varTheme.Blue, varTheme.Card)
                    Height: =36
                    OnSelect: |-
                        =Set(varShowAll, !varShowAll); Set(varVisibleCols, If(varShowAll, ForAll(SortByColumns(Filter(colAllColsForListing, Listing = varCurrentCheck.ReportType), "Order") As R, {ColName: R.ColName, Align: R.Align, Order: R.Order}), ForAll(SortByColumns(Filter(colCheckColumns, Report = varCurrentCheck.ReportType, CheckNo = varCurrentCheck.CheckNumber), "Order") As R, {ColName: R.ColName, Align: R.Align, Order: R.Order})))
                    Size: =11
                    Text: =If(varShowAll, "Show relevant columns", "Show all columns")
                    Width: =180
                    ZIndex: =3

                cdToolSpace As label:
                    FillPortions: =1
                    Height: =20
                    Text: =""
                    ZIndex: =4

                cdColCount As label:
                    Align: =Align.Right
                    Color: =varTheme.Muted
                    Height: =20
                    Size: =11
                    Text: =CountRows(varVisibleCols) & " of " & CountRows(Filter(colAllColsForListing, Listing = varCurrentCheck.ReportType)) & " cols"
                    Width: =110
                    ZIndex: =5

            "galTxn As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                Items: =Filter(colTransactions, DailyReportCheckID = varCurrentCheck.ID, (varSearchTxn="" || varSearchTxn in TransactionNo), (varFoStateFilter="All" || If(!FlaggedToFO, "Unflagged", !FOSent, "Queued", Not(FOSent && !IsBlank(FORespondedOn) && FORespondedOn >= FOSentOn), "Sent", "Replied") = varFoStateFilter))
                Layout: =Layout.Vertical
                TemplatePadding: =0
                TemplateSize: =58
                Visible: =CountRows(Filter(colTransactions, DailyReportCheckID = varCurrentCheck.ID)) > 0
                Width: =Parent.Width
                ZIndex: =3

                txnRowC As groupContainer.horizontalAutoLayoutContainer:
                    BorderColor: =varTheme.Line
                    BorderThickness: =1
                    Fill: =varTheme.Card
                    Height: =Parent.TemplateHeight
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =8
                    PaddingBottom: =10
                    PaddingLeft: =12
                    PaddingRight: =12
                    PaddingTop: =10
                    Width: =Parent.TemplateWidth
                    ZIndex: =1

                    "galCells As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                        AlignInContainer: =AlignInContainer.Center
                        FillPortions: =2
                        Height: =36
                        Items: |-
                            =ForAll(varVisibleCols As V, {ColName: V.ColName, Align: V.Align, Value: Coalesce(LookUp(colTxnCells, TxnID = ThisItem.ID && ColName = V.ColName).Value, "—")})
                        TemplatePadding: =0
                        TemplateSize: =140
                        ZIndex: =1

                        galCellsLbl As label:
                            Align: =If(ThisItem.Align="right", Align.Right, Align.Left)
                            Color: =varTheme.Ink
                            Height: =Parent.TemplateHeight
                            Size: =11
                            Text: =ThisItem.Value
                            Width: =Parent.TemplateWidth - 8
                            Wrap: =false
                            X: =4
                            ZIndex: =1

                    tcMOReason As dropdown:
                        AlignInContainer: =AlignInContainer.Center
                        Default: =ThisItem.MOReason
                        DisplayMode: =If(varRole="MO", DisplayMode.Edit, DisplayMode.Disabled)
                        Height: =36
                        Items: =SortByColumns(Filter(colReasonConfig, ReportType=varCurrentCheck.ReportType, CheckNumber=varCurrentCheck.CheckNumber, AppliesTo<>"FO"), "Sort").Reason
                        OnChange: |-
                            =Patch(colTransactions, ThisItem, {MOReason:Self.Selected.Value, _isDirty:true, _state:"modified"}); If(Self.Selected.Value = "Request FO explanation" && !ThisItem.FlaggedToFO, Patch(colTransactions, ThisItem, {FlaggedToFO:true, FOReviewer:Coalesce(ThisItem.FOReviewer, If(varCurrentCheck.ReportType="MM", "fo.mm@mdlz.com", "fo.fx@mdlz.com")), _isDirty:true}))
                        Width: =160
                        ZIndex: =2

                    tcMOComment As text:
                        AlignInContainer: =AlignInContainer.Center
                        Default: =ThisItem.MOComment
                        DisplayMode: =If(varRole="MO", DisplayMode.Edit, DisplayMode.Disabled)
                        FillPortions: =1
                        Height: =36
                        HintText: ="MO comment"
                        OnChange: |-
                            =Patch(colTransactions, ThisItem, {MOComment:Self.Text, _isDirty:true, _state:"modified"})
                        ZIndex: =3

                    tcFOFlag As checkbox:
                        AlignInContainer: =AlignInContainer.Center
                        Default: =ThisItem.FlaggedToFO
                        DisplayMode: =If(varRole="MO", DisplayMode.Edit, DisplayMode.Disabled)
                        Height: =36
                        OnCheck: |-
                            =IfError(Patch(colTransactions, ThisItem, {FlaggedToFO:true, FOReviewer:Coalesce(ThisItem.FOReviewer, If(varCurrentCheck.ReportType="MM", "fo.mm@mdlz.com", "fo.fx@mdlz.com")), _isDirty:true, _state:"modified"}), Notify("Could not flag — please retry", NotificationType.Error))
                        OnUncheck: |-
                            =IfError(Patch(colTransactions, ThisItem, {FlaggedToFO:false, FOSent:false, FOSentOn:Blank(), _isDirty:true, _state:"modified"}), Notify("Could not update — please retry", NotificationType.Error))
                        Text: ="FO"
                        Width: =64
                        ZIndex: =4

                    tcFOState As label:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(!ThisItem.FlaggedToFO, varTheme.Muted, !ThisItem.FOSent, varTheme.Amber, !(ThisItem.FOSent && !IsBlank(ThisItem.FORespondedOn) && ThisItem.FORespondedOn >= ThisItem.FOSentOn), varTheme.Blue, varTheme.Green)
                        Height: =36
                        Size: =12
                        Text: =If(!ThisItem.FlaggedToFO, "", !ThisItem.FOSent, "queued", !(ThisItem.FOSent && !IsBlank(ThisItem.FORespondedOn) && ThisItem.FORespondedOn >= ThisItem.FOSentOn), "sent", "replied") & If(IsBlank(ThisItem.FOReviewer), "", Char(10) & Left(ThisItem.FOReviewer, Find("@", ThisItem.FOReviewer & "@") - 1))
                        Width: =110
                        ZIndex: =5

                    tcFOReason As dropdown:
                        AlignInContainer: =AlignInContainer.Center
                        Default: =ThisItem.FOReason
                        DisplayMode: =DisplayMode.View
                        Height: =36
                        Items: =Filter(colReasonConfig, AppliesTo="FO").Reason
                        Width: =150
                        ZIndex: =6

                    tcFOComment As text:
                        AlignInContainer: =AlignInContainer.Center
                        Default: =ThisItem.FOComment
                        DisplayMode: =DisplayMode.View
                        FillPortions: =1
                        Height: =36
                        HintText: ="—"
                        ZIndex: =7

            cdEmpty As label:
                Align: =Align.Center
                AlignInContainer: =AlignInContainer.Stretch
                Color: =If(varCurrentCheck.NotCompared, varTheme.Amber, varTheme.Green)
                FillPortions: =1
                Size: =14
                Text: =If(varCurrentCheck.NotCompared, "Not compared — the reference export (ZTRM) was empty, so these deals could not be compared. Recorded as Not compared for audit; the check is complete.", "No findings — check passed. Nothing to review for this check.")
                Visible: =CountRows(Filter(colTransactions, DailyReportCheckID = varCurrentCheck.ID)) = 0
                Width: =Parent.Width
                ZIndex: =4

            cdHeader As groupContainer.horizontalAutoLayoutContainer:
                BorderColor: =varTheme.Line
                BorderThickness: =1
                Fill: =varTheme.Thead
                Height: =30
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =8
                PaddingLeft: =12
                PaddingRight: =12
                Visible: =CountRows(Filter(colTransactions, DailyReportCheckID = varCurrentCheck.ID)) > 0
                Width: =Parent.Width
                ZIndex: =15

                "galHdr As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                    AlignInContainer: =AlignInContainer.Center
                    FillPortions: =2
                    Height: =24
                    Items: =varVisibleCols
                    TemplatePadding: =0
                    TemplateSize: =140
                    ZIndex: =1

                    galHdrLbl As label:
                        Align: =If(ThisItem.Align="right", Align.Right, Align.Left)
                        Color: =varTheme.Muted
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.TemplateHeight
                        Size: =11
                        Text: =ThisItem.ColName
                        Width: =Parent.TemplateWidth - 8
                        Wrap: =false
                        X: =4
                        ZIndex: =1

                hcReason As label:
                    Color: =varTheme.Blue
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    Size: =11
                    Text: ="MO reason"
                    Width: =160
                    ZIndex: =1

                hcComment As label:
                    Color: =varTheme.Blue
                    FillPortions: =1
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    Size: =11
                    Text: ="MO comment"
                    ZIndex: =1

                hcFlag As label:
                    Align: =Align.Center
                    Color: =varTheme.Amber
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    Size: =11
                    Text: ="FO?"
                    Width: =64
                    ZIndex: =1

                hcState As label:
                    Color: =varTheme.Amber
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    Size: =11
                    Text: ="FO state"
                    Width: =110
                    ZIndex: =1

                hcFoReason As label:
                    Color: =varTheme.Amber
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    Size: =11
                    Text: ="FO reason"
                    ZIndex: =1

                hcFoComment As label:
                    Color: =varTheme.Amber
                    FillPortions: =1
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    Size: =11
                    Text: ="FO comment"
                    ZIndex: =1

    cfCdScrim As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(20, 10, 30, 0.45)
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Center
        LayoutJustifyContent: =LayoutJustifyContent.Center
        Visible: =varConfirmComplete
        Width: =Parent.Width
        ZIndex: =900

        cfCdCard As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.Center
            BorderColor: =varTheme.Line
            BorderThickness: =1
            Fill: =varTheme.Card
            Height: =210
            LayoutGap: =12
            PaddingBottom: =20
            PaddingLeft: =22
            PaddingRight: =22
            PaddingTop: =20
            Width: =460
            ZIndex: =2

            cfCdTitle As label:
                AlignInContainer: =AlignInContainer.Stretch
                Color: =varTheme.Ink
                FontWeight: =FontWeight.Semibold
                Height: =26
                Size: =15
                Text: ="Mark check complete?"
                Width: =Parent.Width
                ZIndex: =1

            cfCdMsg As label:
                AlignInContainer: =AlignInContainer.Stretch
                Color: =varTheme.Muted
                FillPortions: =1
                Size: =12
                Text: ="This finalises " & varCurrentCheck.CheckName & ". You can still reopen findings by resending to FO."
                Width: =Parent.Width
                ZIndex: =2

            cfCdBtns As groupContainer.horizontalAutoLayoutContainer:
                Fill: =RGBA(0,0,0,0)
                Height: =40
                LayoutGap: =10
                LayoutJustifyContent: =LayoutJustifyContent.End
                Width: =Parent.Width
                ZIndex: =3

                cfCdCancel As button:
                    AlignInContainer: =AlignInContainer.Center
                    BorderColor: =varTheme.Line
                    BorderThickness: =1
                    Color: =varTheme.Muted
                    Fill: =varTheme.Card
                    Height: =36
                    OnSelect: =Set(varConfirmComplete, false)
                    Size: =12
                    Text: ="Cancel"
                    Width: =110
                    ZIndex: =1

                cfCdOk As button:
                    AlignInContainer: =AlignInContainer.Center
                    BorderThickness: =0
                    Color: =varTheme.White
                    Fill: =varTheme.Green
                    Height: =36
                    OnSelect: |-
                        =IfError(Patch(colChecks, varCurrentCheck, {Completed:true}); Set(varAuditSeq, varAuditSeq + 1); Collect(colAudit, {Seq: varAuditSeq, Stamp: Now(), Text: "Check completed — " & varCurrentCheck.CheckName}); Notify("Check completed", NotificationType.Success); Navigate(scrChecks, ScreenTransition.UnCover), Notify("Could not complete — please retry", NotificationType.Error)); Set(varConfirmComplete, false)
                    Size: =12
                    Text: ="Mark complete"
                    Width: =190
                    ZIndex: =2

