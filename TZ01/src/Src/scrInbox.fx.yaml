scrInbox As screen:
    Fill: =varTheme.Bg

    inRoot As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(0,0,0,0)
        Height: =Parent.Height
        Width: =Parent.Width
        ZIndex: =1

        inhdrBar As groupContainer.horizontalAutoLayoutContainer:
            Fill: =varTheme.Purple
            Height: =58
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingBottom: =12
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =12
            Width: =Parent.Width
            ZIndex: =10

            inhdrTitle As label:
                AlignInContainer: =AlignInContainer.Center
                Color: =varTheme.White
                FillPortions: =1
                FontWeight: =FontWeight.Semibold
                Height: =34
                Size: =16
                Text: ="FRONT OFFICE — MY QUEUE"
                ZIndex: =2

            inhdrRoleSeg As groupContainer.horizontalAutoLayoutContainer:
                AlignInContainer: =AlignInContainer.Center
                Fill: =RGBA(255, 255, 255, 0.13)
                Height: =34
                LayoutGap: =4
                PaddingBottom: =3
                PaddingLeft: =3
                PaddingRight: =3
                PaddingTop: =3
                Visible: =IsBlank(varRoleResolved)
                Width: =240
                ZIndex: =3

                inhdrMO As button:
                    BorderThickness: =0
                    Color: =If(varRole="MO", varTheme.Purple, RGBA(227,214,237,1))
                    Fill: =If(varRole="MO", varTheme.White, RGBA(255,255,255,0))
                    FillPortions: =1
                    Height: =28
                    OnSelect: =Set(varRole, "MO"); Navigate(scrOverview, ScreenTransition.Fade)
                    Size: =11
                    Text: ="Middle Office"
                    ZIndex: =1

                inhdrFO As button:
                    BorderThickness: =0
                    Color: =If(varRole="FO", varTheme.Purple, RGBA(227,214,237,1))
                    Fill: =If(varRole="FO", varTheme.White, RGBA(255,255,255,0))
                    FillPortions: =1
                    Height: =28
                    OnSelect: =Set(varRole, "FO"); Navigate(scrInbox, ScreenTransition.Fade)
                    Size: =11
                    Text: ="Front Office"
                    ZIndex: =2

            inhdrLogo As label:
                Align: =Align.Center
                AlignInContainer: =AlignInContainer.Center
                BorderColor: =RGBA(255, 255, 255, 0.4)
                BorderStyle: =BorderStyle.Dashed
                BorderThickness: =1
                Color: =varTheme.White
                Height: =30
                Size: =11
                Text: ="[ logo ]"
                Width: =110
                ZIndex: =4

            inhdrUser As label:
                Align: =Align.Right
                AlignInContainer: =AlignInContainer.Center
                Color: =RGBA(227, 214, 237, 1)
                Height: =30
                Size: =11
                Text: ="Signed in as " & Coalesce(varUser.FullName, varUser.Email, "Demo user") & "  ·  " & varRole
                Width: =220
                ZIndex: =5

        inBody As groupContainer.verticalAutoLayoutContainer:
            Fill: =RGBA(0,0,0,0)
            LayoutGap: =10
            PaddingBottom: =14
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =14
            Width: =Parent.Width
            ZIndex: =20

            inEye As label:
                AlignInContainer: =AlignInContainer.Start
                Color: =varTheme.Ink
                FontWeight: =FontWeight.Semibold
                Height: =20
                Size: =11
                Text: ="ITEMS AWAITING YOUR RESPONSE"
                ZIndex: =1

            inHelp As label:
                AlignInContainer: =AlignInContainer.Stretch
                BorderColor: =RGBA(234,217,243,1)
                BorderThickness: =1
                Color: =varTheme.Muted
                Fill: =RGBA(251,247,254,1)
                Height: =42
                PaddingLeft: =14
                PaddingTop: =8
                Size: =11
                Text: ="You are in the Front Office view. These are the findings Middle Office flagged to you. Add your reason and comment, then send your response back to MO."
                Width: =Parent.Width
                ZIndex: =2

            inTools As groupContainer.horizontalAutoLayoutContainer:
                Fill: =RGBA(0,0,0,0)
                Height: =40
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =8
                Visible: =CountRows(Filter(colTransactions, FlaggedToFO, FOSent)) > 0
                Width: =Parent.Width
                ZIndex: =2

                inSearch As text:
                    AlignInContainer: =AlignInContainer.Center
                    Default: =""
                    Height: =36
                    HintText: ="Search transaction no…"
                    OnChange: =Set(varSearchInbox, Self.Text)
                    Width: =260
                    ZIndex: =1

                inShowAll As button:
                    AlignInContainer: =AlignInContainer.Center
                    BorderColor: =varTheme.Line
                    BorderThickness: =1
                    Color: =If(varShowAll, varTheme.White, varTheme.Muted)
                    Fill: =If(varShowAll, varTheme.Blue, varTheme.Card)
                    Height: =36
                    OnSelect: =Set(varShowAll, !varShowAll)
                    Size: =11
                    Text: =If(varShowAll, "Show relevant columns", "Show all columns")
                    Width: =180
                    ZIndex: =2

                inToolSpace As label:
                    FillPortions: =1
                    Height: =20
                    Text: =""
                    ZIndex: =3

            "galInbox As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                Items: =Filter(colTransactions, FlaggedToFO, FOSent, (varSearchInbox="" || varSearchInbox in TransactionNo))
                Layout: =Layout.Vertical
                TemplatePadding: =8
                TemplateSize: =252
                Visible: =CountRows(Filter(colTransactions, FlaggedToFO, FOSent)) > 0
                Width: =Parent.Width
                ZIndex: =3

                inCard As groupContainer.verticalAutoLayoutContainer:
                    BorderColor: =varTheme.Line
                    BorderThickness: =1
                    Fill: =varTheme.Card
                    Height: =Parent.TemplateHeight - 10
                    LayoutGap: =7
                    PaddingBottom: =12
                    PaddingLeft: =14
                    PaddingRight: =14
                    PaddingTop: =12
                    Width: =Parent.TemplateWidth - 4
                    X: =2
                    Y: =2
                    ZIndex: =1

                    inWhere As label:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =varTheme.Ink
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        Size: =12
                        Text: =ThisItem.ReportType & " · Check " & ThisItem.CheckNumber & " · " & ThisItem.TransactionNo & If((ThisItem.FOSent && !IsBlank(ThisItem.FORespondedOn) && ThisItem.FORespondedOn >= ThisItem.FOSentOn), "   (responded)", "")
                        Width: =Parent.Width
                        ZIndex: =1

                    inAgain As label:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =varTheme.Orange
                        FontWeight: =FontWeight.Semibold
                        Height: =16
                        Size: =12
                        Text: ="MO asked again — please re-confirm."
                        Visible: =(ThisItem.FOSent && !IsBlank(ThisItem.FORespondedOn) && ThisItem.FOSentOn > ThisItem.FORespondedOn)
                        Width: =Parent.Width
                        ZIndex: =2

                    inAsk As label:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =varTheme.Muted
                        Fill: =RGBA(246,246,247,1)
                        Height: =26
                        PaddingLeft: =10
                        Size: =11
                        Text: ="MO asks — " & ThisItem.MOComment
                        Width: =Parent.Width
                        ZIndex: =3

                    inFoRec As groupContainer.verticalAutoLayoutContainer:
                        BorderColor: =varTheme.Line
                        BorderThickness: =1
                        Fill: =RGBA(246,246,247,1)
                        Height: =48
                        LayoutGap: =2
                        PaddingBottom: =3
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =3
                        Width: =Parent.Width
                        ZIndex: =3

                        "inFoHdr As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                            Height: =18
                            Items: |-
                                =If(varShowAll, ForAll(SortByColumns(Filter(colAllColsForListing, Listing = ThisItem.ReportType), "Order") As R, {ColName: R.ColName, Align: R.Align}), ForAll(SortByColumns(Filter(colCheckColumns, Report = ThisItem.ReportType, CheckNo = ThisItem.CheckNumber), "Order") As R, {ColName: R.ColName, Align: R.Align}))
                            ShowScrollbar: =false
                            TemplatePadding: =0
                            TemplateSize: =140
                            Width: =Parent.Width
                            ZIndex: =1

                            inFoHdrLbl As label:
                                Align: =If(ThisItem.Align="right", Align.Right, Align.Left)
                                Color: =varTheme.Muted
                                FontWeight: =FontWeight.Semibold
                                Height: =Parent.TemplateHeight
                                Size: =10
                                Text: =ThisItem.ColName
                                Width: =Parent.TemplateWidth - 8
                                Wrap: =false
                                X: =4
                                ZIndex: =1

                        "inFoCells As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                            Height: =24
                            Items: |-
                                =ForAll(If(varShowAll, ForAll(SortByColumns(Filter(colAllColsForListing, Listing = ThisItem.ReportType), "Order") As R, {ColName: R.ColName, Align: R.Align}), ForAll(SortByColumns(Filter(colCheckColumns, Report = ThisItem.ReportType, CheckNo = ThisItem.CheckNumber), "Order") As R, {ColName: R.ColName, Align: R.Align})) As V, {ColName: V.ColName, Align: V.Align, Value: Coalesce(LookUp(colTxnCells, TxnID = ThisItem.ID && ColName = V.ColName).Value, "—")})
                            TemplatePadding: =0
                            TemplateSize: =140
                            Width: =Parent.Width
                            ZIndex: =2

                            inFoCellLbl As label:
                                Align: =If(ThisItem.Align="right", Align.Right, Align.Left)
                                Color: =varTheme.Ink
                                Height: =Parent.TemplateHeight
                                Size: =11
                                Text: =ThisItem.Value
                                Width: =Parent.TemplateWidth - 8
                                Wrap: =false
                                X: =4
                                ZIndex: =1

                    inHistory As label:
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =RGBA(207,227,207,1)
                        BorderThickness: =1
                        Color: =varTheme.Green
                        Fill: =RGBA(243,248,243,1)
                        PaddingBottom: =4
                        PaddingLeft: =10
                        PaddingTop: =4
                        Size: =12
                        Text: =ThisItem.FOComment
                        Visible: =!IsBlank(ThisItem.FOComment)
                        Width: =Parent.Width
                        ZIndex: =4

                    inResp As groupContainer.horizontalAutoLayoutContainer:
                        Fill: =RGBA(0,0,0,0)
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =Parent.Width
                        ZIndex: =5

                        inReason As dropdown:
                            AlignInContainer: =AlignInContainer.Center
                            Default: =ThisItem.FOReason
                            DisplayMode: =If((ThisItem.FOSent && !IsBlank(ThisItem.FORespondedOn) && ThisItem.FORespondedOn >= ThisItem.FOSentOn), DisplayMode.Disabled, DisplayMode.Edit)
                            Height: =36
                            Items: =Filter(colReasonConfig, AppliesTo="FO").Reason
                            Width: =190
                            ZIndex: =1

                        inComment As text:
                            AlignInContainer: =AlignInContainer.Center
                            Default: =""
                            DisplayMode: =If((ThisItem.FOSent && !IsBlank(ThisItem.FORespondedOn) && ThisItem.FORespondedOn >= ThisItem.FOSentOn), DisplayMode.Disabled, DisplayMode.Edit)
                            FillPortions: =1
                            Height: =36
                            HintText: ="explain or confirm…"
                            ZIndex: =2

                        inSend As button:
                            AlignInContainer: =AlignInContainer.Center
                            BorderThickness: =0
                            Color: =varTheme.White
                            DisabledColor: =varTheme.Green
                            DisabledFill: =RGBA(231,243,231,1)
                            DisplayMode: =If((ThisItem.FOSent && !IsBlank(ThisItem.FORespondedOn) && ThisItem.FORespondedOn >= ThisItem.FOSentOn), DisplayMode.Disabled, DisplayMode.Edit)
                            Fill: =varTheme.Blue
                            Height: =36
                            OnSelect: |-
                                =If(IsBlank(inReason.Selected.Value), Notify("Choose a reason first", NotificationType.Error), Patch(colTransactions, ThisItem, {FOReason: inReason.Selected.Value, FORespondedOn: Now(), FOComment: ThisItem.FOComment & If(IsBlank(ThisItem.FOComment), "", Char(10)) & "[" & Text(Now(), "dd Mmm hh:mm") & " - " & inReason.Selected.Value & "] " & inComment.Text, _isDirty:true}); Reset(inComment); Notify("Response sent to MO", NotificationType.Success); Set(varAuditSeq, varAuditSeq + 1); Collect(colAudit, {Seq: varAuditSeq, Stamp: Now(), Text: "FO replied on " & ThisItem.TransactionNo & " (" & inReason.Selected.Value & ")"}))
                            Size: =11
                            Text: =If((ThisItem.FOSent && !IsBlank(ThisItem.FORespondedOn) && ThisItem.FORespondedOn >= ThisItem.FOSentOn), "Responded", "Send response to MO")
                            Width: =180
                            ZIndex: =3

            inEmpty As label:
                Align: =Align.Center
                AlignInContainer: =AlignInContainer.Stretch
                Color: =varTheme.Muted
                FillPortions: =1
                Size: =14
                Text: ="Nothing to respond to. No findings have been sent to Front Office."
                Visible: =CountRows(Filter(colTransactions, FlaggedToFO, FOSent)) = 0
                Width: =Parent.Width
                ZIndex: =4

