scrInbox As screen:
    Fill: =RGBA(236, 238, 241, 1)

    inRoot As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(0,0,0,0)
        Height: =Parent.Height
        Width: =Parent.Width
        ZIndex: =1

        inhdrBar As groupContainer.horizontalAutoLayoutContainer:
            Fill: =RGBA(67, 22, 79, 1)
            Height: =58
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingBottom: =12
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =12
            Width: =Parent.Width
            ZIndex: =10

            inhdrTitle As label:
                AlignInContainer: =AlignInContainer.Center
                Color: =RGBA(255, 255, 255, 1)
                FillPortions: =1
                FontWeight: =FontWeight.Semibold
                Height: =34
                Size: =16
                Text: ="FRONT OFFICE — MY QUEUE"
                ZIndex: =2

            inhdrRoleSeg As groupContainer.horizontalAutoLayoutContainer:
                AlignInContainer: =AlignInContainer.Center
                Fill: =RGBA(255, 255, 255, 0.13)
                Height: =34
                LayoutGap: =4
                PaddingBottom: =3
                PaddingLeft: =3
                PaddingRight: =3
                PaddingTop: =3
                Width: =240
                ZIndex: =3

                inhdrMO As button:
                    BorderThickness: =0
                    Color: =If(varRole="MO", RGBA(67, 22, 79, 1), RGBA(227,214,237,1))
                    Fill: =If(varRole="MO", RGBA(255, 255, 255, 1), RGBA(255,255,255,0))
                    FillPortions: =1
                    Height: =28
                    OnSelect: =Set(varRole, "MO"); Navigate(scrOverview, ScreenTransition.Fade)
                    Size: =11
                    Text: ="Middle Office"
                    ZIndex: =1

                inhdrFO As button:
                    BorderThickness: =0
                    Color: =If(varRole="FO", RGBA(67, 22, 79, 1), RGBA(227,214,237,1))
                    Fill: =If(varRole="FO", RGBA(255, 255, 255, 1), RGBA(255,255,255,0))
                    FillPortions: =1
                    Height: =28
                    OnSelect: =Set(varRole, "FO"); Navigate(scrInbox, ScreenTransition.Fade)
                    Size: =11
                    Text: ="Front Office"
                    ZIndex: =2

            inhdrLogo As label:
                Align: =Align.Center
                AlignInContainer: =AlignInContainer.Center
                BorderColor: =RGBA(255, 255, 255, 0.4)
                BorderStyle: =BorderStyle.Dashed
                BorderThickness: =1
                Color: =RGBA(255, 255, 255, 1)
                Height: =30
                Size: =11
                Text: ="[ logo ]"
                Width: =110
                ZIndex: =4

        inBody As groupContainer.verticalAutoLayoutContainer:
            Fill: =RGBA(0,0,0,0)
            LayoutGap: =10
            PaddingBottom: =14
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =14
            Width: =Parent.Width
            ZIndex: =20

            inEye As label:
                AlignInContainer: =AlignInContainer.Start
                Color: =RGBA(42, 42, 42, 1)
                FontWeight: =FontWeight.Semibold
                Height: =20
                Size: =11
                Text: ="ITEMS AWAITING YOUR RESPONSE"
                ZIndex: =1

            inHelp As label:
                AlignInContainer: =AlignInContainer.Stretch
                BorderColor: =RGBA(234,217,243,1)
                BorderThickness: =1
                Color: =RGBA(90, 90, 94, 1)
                Fill: =RGBA(251,247,254,1)
                Height: =42
                PaddingLeft: =14
                PaddingTop: =8
                Size: =11
                Text: ="You are in the Front Office view. These are the findings Middle Office flagged to you. Add your reason and comment, then send your response back to MO."
                Width: =Parent.Width
                ZIndex: =2

            "galInbox As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                Items: =Filter(colTransactions, FlaggedToFO, FOSent)
                Layout: =Layout.Vertical
                TemplatePadding: =8
                TemplateSize: =196
                Visible: =CountRows(Filter(colTransactions, FlaggedToFO, FOSent)) > 0
                Width: =Parent.Width
                ZIndex: =3

                inCard As groupContainer.verticalAutoLayoutContainer:
                    BorderColor: =RGBA(228, 228, 230, 1)
                    BorderThickness: =1
                    Fill: =RGBA(255, 255, 255, 1)
                    Height: =Parent.TemplateHeight - 10
                    LayoutGap: =7
                    PaddingBottom: =12
                    PaddingLeft: =14
                    PaddingRight: =14
                    PaddingTop: =12
                    Width: =Parent.TemplateWidth - 4
                    X: =2
                    Y: =2
                    ZIndex: =1

                    inWhere As label:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(42, 42, 42, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        Size: =12
                        Text: =ThisItem.ReportType & " · Check " & ThisItem.CheckNumber & " · " & ThisItem.TransactionNo & If((ThisItem.FOSent && !IsBlank(ThisItem.FORespondedOn) && ThisItem.FORespondedOn >= ThisItem.FOSentOn), "   (responded)", "")
                        Width: =Parent.Width
                        ZIndex: =1

                    inAgain As label:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(191, 83, 32, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =16
                        Size: =10
                        Text: ="MO asked again — please re-confirm."
                        Visible: =(ThisItem.FOSent && !IsBlank(ThisItem.FORespondedOn) && ThisItem.FOSentOn > ThisItem.FORespondedOn)
                        Width: =Parent.Width
                        ZIndex: =2

                    inAsk As label:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(90, 90, 94, 1)
                        Fill: =RGBA(246,246,247,1)
                        Height: =26
                        PaddingLeft: =10
                        Size: =11
                        Text: ="MO asks — " & ThisItem.MOComment
                        Width: =Parent.Width
                        ZIndex: =3

                    inHistory As label:
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =RGBA(207,227,207,1)
                        BorderThickness: =1
                        Color: =RGBA(59, 109, 17, 1)
                        Fill: =RGBA(243,248,243,1)
                        PaddingBottom: =4
                        PaddingLeft: =10
                        PaddingTop: =4
                        Size: =10
                        Text: =ThisItem.FOComment
                        Visible: =!IsBlank(ThisItem.FOComment)
                        Width: =Parent.Width
                        ZIndex: =4

                    inResp As groupContainer.horizontalAutoLayoutContainer:
                        Fill: =RGBA(0,0,0,0)
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =Parent.Width
                        ZIndex: =5

                        inReason As dropdown:
                            AlignInContainer: =AlignInContainer.Center
                            Default: =ThisItem.FOReason
                            DisplayMode: =If((ThisItem.FOSent && !IsBlank(ThisItem.FORespondedOn) && ThisItem.FORespondedOn >= ThisItem.FOSentOn), DisplayMode.Disabled, DisplayMode.Edit)
                            Height: =36
                            Items: =Filter(colReasonConfig, AppliesTo="FO").Reason
                            Width: =190
                            ZIndex: =1

                        inComment As text:
                            AlignInContainer: =AlignInContainer.Center
                            Default: =""
                            DisplayMode: =If((ThisItem.FOSent && !IsBlank(ThisItem.FORespondedOn) && ThisItem.FORespondedOn >= ThisItem.FOSentOn), DisplayMode.Disabled, DisplayMode.Edit)
                            FillPortions: =1
                            Height: =36
                            HintText: ="explain or confirm…"
                            ZIndex: =2

                        inSend As button:
                            AlignInContainer: =AlignInContainer.Center
                            BorderThickness: =0
                            DisabledColor: =RGBA(59, 109, 17, 1)
                            DisabledFill: =RGBA(231,243,231,1)
                            DisplayMode: =If((ThisItem.FOSent && !IsBlank(ThisItem.FORespondedOn) && ThisItem.FORespondedOn >= ThisItem.FOSentOn), DisplayMode.Disabled, DisplayMode.Edit)
                            Fill: =RGBA(31, 96, 168, 1)
                            Height: =36
                            OnSelect: |-
                                =If(IsBlank(inReason.Selected.Value), Notify("Choose a reason first", NotificationType.Error), Patch(colTransactions, ThisItem, {FOReason: inReason.Selected.Value, FORespondedOn: Now(), FOComment: ThisItem.FOComment & If(IsBlank(ThisItem.FOComment), "", Char(10)) & "[" & Text(Now(), "dd Mmm hh:mm") & " - " & inReason.Selected.Value & "] " & inComment.Text, _isDirty:true}); Reset(inComment); Notify("Response sent to MO", NotificationType.Success))
                            Size: =11
                            Text: =If((ThisItem.FOSent && !IsBlank(ThisItem.FORespondedOn) && ThisItem.FORespondedOn >= ThisItem.FOSentOn), "Responded", "Send response to MO")
                            Width: =180
                            ZIndex: =3

            inEmpty As label:
                Align: =Align.Center
                AlignInContainer: =AlignInContainer.Stretch
                Color: =RGBA(90, 90, 94, 1)
                FillPortions: =1
                Size: =14
                Text: ="Nothing to respond to. No findings have been sent to Front Office."
                Visible: =CountRows(Filter(colTransactions, FlaggedToFO, FOSent)) = 0
                Width: =Parent.Width
                ZIndex: =4

