scrChecks As screen:
    Fill: =varTheme.Bg

    ckRoot As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(0,0,0,0)
        Height: =Parent.Height
        Width: =Parent.Width
        ZIndex: =1

        ckhdrBar As groupContainer.horizontalAutoLayoutContainer:
            Fill: =varTheme.Purple
            Height: =58
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingBottom: =12
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =12
            Width: =Parent.Width
            ZIndex: =10

            ckhdrBack As button:
                AlignInContainer: =AlignInContainer.Center
                BorderThickness: =0
                Color: =varTheme.White
                Fill: =RGBA(255, 255, 255, 0.14)
                Height: =34
                HoverColor: =varTheme.White
                HoverFill: =RGBA(255, 255, 255, 0.24)
                OnSelect: =Navigate(scrOverview, ScreenTransition.UnCoverRight)
                PressedColor: =varTheme.White
                PressedFill: =RGBA(255, 255, 255, 0.24)
                Size: =12
                Text: ="< Back"
                Width: =92
                ZIndex: =1

            ckhdrTitle As label:
                AlignInContainer: =AlignInContainer.Center
                Color: =varTheme.White
                FillPortions: =1
                FontWeight: =FontWeight.Semibold
                Height: =34
                Size: =16
                Text: ="CHECK ANALYSIS"
                ZIndex: =2

            ckhdrRoleSeg As groupContainer.horizontalAutoLayoutContainer:
                AlignInContainer: =AlignInContainer.Center
                Fill: =RGBA(255, 255, 255, 0.13)
                Height: =34
                LayoutGap: =4
                PaddingBottom: =3
                PaddingLeft: =3
                PaddingRight: =3
                PaddingTop: =3
                Visible: =IsBlank(varRoleResolved)
                Width: =240
                ZIndex: =3

                ckhdrMO As button:
                    BorderThickness: =0
                    Color: =If(varRole="MO", varTheme.Purple, RGBA(227,214,237,1))
                    Fill: =If(varRole="MO", varTheme.White, RGBA(255,255,255,0))
                    FillPortions: =1
                    Height: =28
                    OnSelect: =Set(varRole, "MO"); Navigate(scrOverview, ScreenTransition.Fade)
                    Size: =11
                    Text: ="Middle Office"
                    ZIndex: =1

                ckhdrFO As button:
                    BorderThickness: =0
                    Color: =If(varRole="FO", varTheme.Purple, RGBA(227,214,237,1))
                    Fill: =If(varRole="FO", varTheme.White, RGBA(255,255,255,0))
                    FillPortions: =1
                    Height: =28
                    OnSelect: =Set(varRole, "FO"); Navigate(scrInbox, ScreenTransition.Fade)
                    Size: =11
                    Text: ="Front Office"
                    ZIndex: =2

            ckhdrLogo As label:
                Align: =Align.Center
                AlignInContainer: =AlignInContainer.Center
                BorderColor: =RGBA(255, 255, 255, 0.4)
                BorderStyle: =BorderStyle.Dashed
                BorderThickness: =1
                Color: =varTheme.White
                Height: =30
                Size: =11
                Text: ="[ logo ]"
                Width: =110
                ZIndex: =4

            ckhdrUser As label:
                Align: =Align.Right
                AlignInContainer: =AlignInContainer.Center
                Color: =RGBA(227, 214, 237, 1)
                Height: =30
                Size: =11
                Text: ="Signed in as " & Coalesce(varUser.FullName, varUser.Email, "Demo user") & "  ·  " & varRole
                Width: =220
                ZIndex: =5

        ckftBar As groupContainer.horizontalAutoLayoutContainer:
            BorderColor: =varTheme.Line
            BorderThickness: =1
            Fill: =RGBA(250, 250, 250, 1)
            Height: =56
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =9
            LayoutJustifyContent: =LayoutJustifyContent.End
            PaddingBottom: =10
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =10
            Width: =Parent.Width
            ZIndex: =10

            ckUnsaved As label:
                Color: =varTheme.Amber
                FillPortions: =1
                Height: =30
                Size: =11
                Text: =If(CountRows(Filter(colTransactions, _isDirty)) > 0, "● " & CountRows(Filter(colTransactions, _isDirty)) & " unsaved edit(s)", "")
                ZIndex: =0

            ckSend As button:
                AlignInContainer: =AlignInContainer.Center
                BorderThickness: =0
                Color: =varTheme.White
                DisabledColor: =varTheme.Faint
                DisabledFill: =RGBA(240,240,240,1)
                DisplayMode: =If(CountRows(Filter(colTransactions, DailyReportID=varCurrentReport.ID, FlaggedToFO, !FOSent))>0, DisplayMode.Edit, DisplayMode.Disabled)
                Fill: =varTheme.Blue
                Height: =34
                OnSelect: |-
                    =With({toSend: Filter(colTransactions, DailyReportID=varCurrentReport.ID, FlaggedToFO, !FOSent)}, If(CountRows(Filter(toSend, (MOReason="Request FO explanation" || MOReason="Other") && IsBlank(MOComment)))>0, Notify("Add a comment before sending to FO", NotificationType.Error), ForAll(toSend As T, Patch(colTransactions, T, {FOSent:true, FOSentOn:Now(), _isDirty:true})); Notify("Sent " & CountRows(toSend) & " findings to " & CountRows(Distinct(toSend, FOReviewer)) & " FO reviewer(s)", NotificationType.Success); Set(varAuditSeq, varAuditSeq + 1); Collect(colAudit, {Seq: varAuditSeq, Stamp: Now(), Text: "Sent " & CountRows(toSend) & " finding(s) to FO — " & varCurrentReport.ReportType & " Listing"})))
                Size: =12
                Text: ="Send flagged to FO (" & CountRows(Filter(colTransactions, DailyReportID=varCurrentReport.ID, FlaggedToFO, !FOSent)) & ")"
                Width: =200
                ZIndex: =1

            ckSave As button:
                AlignInContainer: =AlignInContainer.Center
                BorderColor: =varTheme.Line
                BorderThickness: =1
                Color: =varTheme.Muted
                Fill: =varTheme.Card
                Height: =34
                OnSelect: =Notify("Draft saved", NotificationType.Success)
                Size: =12
                Text: ="Save draft"
                Width: =110
                ZIndex: =2

            ckSubmit As button:
                AlignInContainer: =AlignInContainer.Center
                BorderThickness: =0
                Color: =varTheme.White
                DisabledColor: =varTheme.Faint
                DisabledFill: =RGBA(240,240,240,1)
                DisplayMode: =If(CountRows(Filter(colChecks, DailyReportID=varCurrentReport.ID, !(CountRows(Filter(colTransactions, DailyReportCheckID=ID))=0 || Completed)))=0, DisplayMode.Edit, DisplayMode.Disabled)
                Fill: =varTheme.Green
                Height: =34
                OnSelect: =Set(varConfirmSubmit, true)
                Size: =12
                Text: ="Submit report"
                Tooltip: =If(CountRows(Filter(colChecks, DailyReportID=varCurrentReport.ID, !(CountRows(Filter(colTransactions, DailyReportCheckID=ID))=0 || Completed)))=0, "Submit this report as Completed", CountRows(Filter(colChecks, DailyReportID=varCurrentReport.ID, !(CountRows(Filter(colTransactions, DailyReportCheckID=ID))=0 || Completed))) & " check(s) still need to be Completed before you can submit")
                Width: =150
                ZIndex: =3

        ckBody As groupContainer.verticalAutoLayoutContainer:
            Fill: =RGBA(0,0,0,0)
            LayoutGap: =10
            PaddingBottom: =14
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =14
            Width: =Parent.Width
            ZIndex: =20

            ckEye As label:
                AlignInContainer: =AlignInContainer.Start
                Color: =varTheme.Ink
                FontWeight: =FontWeight.Semibold
                Height: =20
                Size: =11
                Text: ="CHECK RESULTS OVERVIEW"
                ZIndex: =1

            ckCrumb As label:
                AlignInContainer: =AlignInContainer.Stretch
                Color: =varTheme.Muted
                FontWeight: =FontWeight.Semibold
                Height: =18
                Size: =11
                Text: =varSelectedItem.DayKey & "   ›   " & varCurrentReport.ReportType & " Listing"
                ZIndex: =2

            ckstepRow As groupContainer.horizontalAutoLayoutContainer:
                Fill: =RGBA(0,0,0,0)
                Height: =40
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =8
                Width: =Parent.Width
                ZIndex: =3

                ckstep1 As label:
                    Color: =If(true, varTheme.Blue, varTheme.Faint)
                    FontWeight: =FontWeight.Semibold
                    Height: =24
                    Size: =11
                    Text: ="1  In review"
                    Width: =200
                    ZIndex: =1

                ckstep2 As label:
                    Color: =If(varCurrentReport.Submitted, varTheme.Blue, varTheme.Faint)
                    FillPortions: =1
                    FontWeight: =FontWeight.Semibold
                    Height: =24
                    Size: =11
                    Text: ="2  Completed"
                    ZIndex: =2

            "galChecks As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                Items: |-
                    =SortByColumns(Filter(colChecks, DailyReportID = varCurrentReport.ID, (varSearchChecks="" || varSearchChecks in CheckName), (varCkStatusFilter="All statuses" || With({tx: Filter(colTransactions, DailyReportCheckID=ID)}, If(CountRows(tx)=0, "Completed", Completed, "Completed", CountRows(Filter(tx, FlaggedToFO && FOSent && Not(FOSent && !IsBlank(FORespondedOn) && FORespondedOn >= FOSentOn)))>0, "Awaiting FO review", "Awaiting MO review")) = varCkStatusFilter)), "CheckNumber")
                Layout: =Layout.Vertical
                OnSelect: =Set(varCurrentCheck, ThisItem); Navigate(scrCheckDetail, ScreenTransition.Cover)
                TemplatePadding: =0
                TemplateSize: =56
                Width: =Parent.Width
                ZIndex: =3

                ckRowC As groupContainer.horizontalAutoLayoutContainer:
                    BorderColor: =varTheme.Line
                    BorderThickness: =1
                    Fill: =If(ThisItem.FlaggedCount=0, varTheme.Card, RGBA(251,236,236,1))
                    Height: =Parent.TemplateHeight - 1
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =8
                    PaddingLeft: =16
                    PaddingRight: =12
                    Width: =Parent.TemplateWidth
                    ZIndex: =1

                    ckNum As label:
                        Color: =varTheme.Ink
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        OnSelect: =Set(varCurrentCheck, ThisItem); Navigate(scrCheckDetail, ScreenTransition.Cover)
                        Size: =12
                        Text: ="Check " & ThisItem.CheckNumber
                        Width: =90
                        ZIndex: =1

                    ckScope As label:
                        Color: =varTheme.Muted
                        FillPortions: =2
                        Height: =36
                        OnSelect: =Set(varCurrentCheck, ThisItem); Navigate(scrCheckDetail, ScreenTransition.Cover)
                        Size: =12
                        Text: =ThisItem.CheckName
                        ZIndex: =2

                    ckResult As label:
                        Color: |-
                            =If(With({fc: CountRows(Filter(colTransactions, DailyReportCheckID=ThisItem.ID))}, If(ThisItem.NotCompared, "Not compared", fc=0, "No finding", ThisItem.IsLate, "Late", ThisItem.CheckNumber=6 && ThisItem.ReportType="FX", "Exceptional", "Finding"))="No finding", varTheme.Green, With({fc: CountRows(Filter(colTransactions, DailyReportCheckID=ThisItem.ID))}, If(ThisItem.NotCompared, "Not compared", fc=0, "No finding", ThisItem.IsLate, "Late", ThisItem.CheckNumber=6 && ThisItem.ReportType="FX", "Exceptional", "Finding"))="Exceptional", varTheme.Red, With({fc: CountRows(Filter(colTransactions, DailyReportCheckID=ThisItem.ID))}, If(ThisItem.NotCompared, "Not compared", fc=0, "No finding", ThisItem.IsLate, "Late", ThisItem.CheckNumber=6 && ThisItem.ReportType="FX", "Exceptional", "Finding"))="Late", varTheme.Amber, With({fc: CountRows(Filter(colTransactions, DailyReportCheckID=ThisItem.ID))}, If(ThisItem.NotCompared, "Not compared", fc=0, "No finding", ThisItem.IsLate, "Late", ThisItem.CheckNumber=6 && ThisItem.ReportType="FX", "Exceptional", "Finding"))="Not compared", varTheme.Amber, varTheme.Red)
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Set(varCurrentCheck, ThisItem); Navigate(scrCheckDetail, ScreenTransition.Cover)
                        Size: =12
                        Text: |-
                            =With({fc: CountRows(Filter(colTransactions, DailyReportCheckID=ThisItem.ID))}, If(ThisItem.NotCompared, "Not compared", fc=0, "No finding", ThisItem.IsLate, "Late", ThisItem.CheckNumber=6 && ThisItem.ReportType="FX", "Exceptional", "Finding"))
                        Width: =120
                        ZIndex: =3

                    ckFlag As label:
                        Align: =Align.Center
                        Color: =varTheme.Muted
                        Height: =36
                        OnSelect: =Set(varCurrentCheck, ThisItem); Navigate(scrCheckDetail, ScreenTransition.Cover)
                        Size: =12
                        Text: =ThisItem.FlaggedCount
                        Width: =60
                        ZIndex: =4

                    ckStatus As label:
                        Color: |-
                            =If(With({tx: Filter(colTransactions, DailyReportCheckID=ThisItem.ID)}, If(CountRows(tx)=0, "Completed", ThisItem.Completed, "Completed", CountRows(Filter(tx, FlaggedToFO && FOSent && Not(FOSent && !IsBlank(FORespondedOn) && FORespondedOn >= FOSentOn)))>0, "Awaiting FO review", "Awaiting MO review"))="Completed" || With({tx: Filter(colTransactions, DailyReportCheckID=ThisItem.ID)}, If(CountRows(tx)=0, "Completed", ThisItem.Completed, "Completed", CountRows(Filter(tx, FlaggedToFO && FOSent && Not(FOSent && !IsBlank(FORespondedOn) && FORespondedOn >= FOSentOn)))>0, "Awaiting FO review", "Awaiting MO review"))="Review completed" || With({tx: Filter(colTransactions, DailyReportCheckID=ThisItem.ID)}, If(CountRows(tx)=0, "Completed", ThisItem.Completed, "Completed", CountRows(Filter(tx, FlaggedToFO && FOSent && Not(FOSent && !IsBlank(FORespondedOn) && FORespondedOn >= FOSentOn)))>0, "Awaiting FO review", "Awaiting MO review"))="Ready to submit", varTheme.Green, With({tx: Filter(colTransactions, DailyReportCheckID=ThisItem.ID)}, If(CountRows(tx)=0, "Completed", ThisItem.Completed, "Completed", CountRows(Filter(tx, FlaggedToFO && FOSent && Not(FOSent && !IsBlank(FORespondedOn) && FORespondedOn >= FOSentOn)))>0, "Awaiting FO review", "Awaiting MO review"))="Awaiting FO review" || With({tx: Filter(colTransactions, DailyReportCheckID=ThisItem.ID)}, If(CountRows(tx)=0, "Completed", ThisItem.Completed, "Completed", CountRows(Filter(tx, FlaggedToFO && FOSent && Not(FOSent && !IsBlank(FORespondedOn) && FORespondedOn >= FOSentOn)))>0, "Awaiting FO review", "Awaiting MO review"))="Awaiting FO", varTheme.Blue, varTheme.Amber)
                        Height: =36
                        OnSelect: =Set(varCurrentCheck, ThisItem); Navigate(scrCheckDetail, ScreenTransition.Cover)
                        Size: =12
                        Text: |-
                            =With({tx: Filter(colTransactions, DailyReportCheckID=ThisItem.ID)}, If(CountRows(tx)=0, "Completed", ThisItem.Completed, "Completed", CountRows(Filter(tx, FlaggedToFO && FOSent && Not(FOSent && !IsBlank(FORespondedOn) && FORespondedOn >= FOSentOn)))>0, "Awaiting FO review", "Awaiting MO review"))
                        Width: =170
                        ZIndex: =5

                    ckChev As icon.ChevronRight:
                        AccessibleLabel: ="Open " & ThisItem.CheckName
                        AlignInContainer: =AlignInContainer.Center
                        Color: =varTheme.Faint
                        Height: =22
                        Icon: =Icon.ChevronRight
                        OnSelect: =Set(varCurrentCheck, ThisItem); Navigate(scrCheckDetail, ScreenTransition.Cover)
                        Width: =22
                        ZIndex: =6

            ckTools As groupContainer.horizontalAutoLayoutContainer:
                Fill: =RGBA(0,0,0,0)
                Height: =40
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =8
                Width: =Parent.Width
                ZIndex: =4

                ckSearch As text:
                    AlignInContainer: =AlignInContainer.Center
                    Default: =""
                    Height: =36
                    HintText: ="Search checks…"
                    OnChange: =Set(varSearchChecks, Self.Text)
                    Width: =240
                    ZIndex: =1

                ckStatusFilter As dropdown:
                    AlignInContainer: =AlignInContainer.Center
                    Default: ="All statuses"
                    Height: =36
                    Items: =["All statuses", "Awaiting MO review", "Awaiting FO review", "Completed"]
                    OnChange: =Set(varCkStatusFilter, Self.Selected.Value)
                    Width: =190
                    ZIndex: =2

                ckToolSpace As label:
                    FillPortions: =1
                    Height: =20
                    Text: =""
                    ZIndex: =3

                ckCount As label:
                    Align: =Align.Right
                    Color: =varTheme.Muted
                    Height: =20
                    Size: =11
                    Text: =CountRows(Filter(colChecks, DailyReportID = varCurrentReport.ID)) & " checks"
                    Width: =80
                    ZIndex: =4

    cfSubScrim As groupContainer.manualLayoutContainer:
        Fill: =RGBA(20, 10, 30, 0.45)
        Height: =Parent.Height
        Visible: =varConfirmSubmit
        Width: =Parent.Width
        ZIndex: =900

        cfSubCard As groupContainer.verticalAutoLayoutContainer:
            BorderColor: =varTheme.Line
            BorderThickness: =1
            Fill: =varTheme.Card
            Height: =210
            LayoutGap: =12
            PaddingBottom: =20
            PaddingLeft: =22
            PaddingRight: =22
            PaddingTop: =20
            Width: =460
            X: =(Parent.Width - 460) / 2
            Y: =(Parent.Height - 210) / 2
            ZIndex: =2

            cfSubTitle As label:
                AlignInContainer: =AlignInContainer.Stretch
                Color: =varTheme.Ink
                FontWeight: =FontWeight.Semibold
                Height: =26
                Size: =15
                Text: ="Submit report?"
                Width: =Parent.Width
                ZIndex: =1

            cfSubMsg As label:
                AlignInContainer: =AlignInContainer.Stretch
                Color: =varTheme.Muted
                FillPortions: =1
                Size: =12
                Text: ="Submitting locks " & varCurrentReport.ReportType & " Listing as Completed. You cannot edit it afterwards."
                Width: =Parent.Width
                ZIndex: =2

            cfSubBtns As groupContainer.horizontalAutoLayoutContainer:
                Fill: =RGBA(0,0,0,0)
                Height: =40
                LayoutGap: =10
                LayoutJustifyContent: =LayoutJustifyContent.End
                Width: =Parent.Width
                ZIndex: =3

                cfSubCancel As button:
                    AlignInContainer: =AlignInContainer.Center
                    BorderColor: =varTheme.Line
                    BorderThickness: =1
                    Color: =varTheme.Muted
                    Fill: =varTheme.Card
                    Height: =36
                    OnSelect: =Set(varConfirmSubmit, false)
                    Size: =12
                    Text: ="Cancel"
                    Width: =110
                    ZIndex: =1

                cfSubOk As button:
                    AlignInContainer: =AlignInContainer.Center
                    BorderThickness: =0
                    Color: =varTheme.White
                    Fill: =varTheme.Green
                    Height: =36
                    OnSelect: |-
                        =IfError(Patch(colDailyReports, varCurrentReport, {Submitted:true}); Set(varAuditSeq, varAuditSeq + 1); Collect(colAudit, {Seq: varAuditSeq, Stamp: Now(), Text: "Report submitted — " & varCurrentReport.ReportType & " Listing"}); Notify("Report submitted", NotificationType.Success); Navigate(scrOverview, ScreenTransition.UnCover), Notify("Could not submit — please retry", NotificationType.Error)); Set(varConfirmSubmit, false)
                    Size: =12
                    Text: ="Submit report"
                    Width: =190
                    ZIndex: =2

