scrOverview As screen:
    Fill: =RGBA(236, 238, 241, 1)
    OnVisible: =If(IsBlank(varCurrentItem), Set(varCurrentItem, First(colDailyItems)); Set(varDayKey, First(colDailyItems).DayKey))

    ovRoot As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(0,0,0,0)
        Height: =Parent.Height
        Width: =Parent.Width
        ZIndex: =1

        ovhdrBar As groupContainer.horizontalAutoLayoutContainer:
            Fill: =RGBA(67, 22, 79, 1)
            Height: =58
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingBottom: =12
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =12
            Width: =Parent.Width
            ZIndex: =10

            ovhdrTitle As label:
                AlignInContainer: =AlignInContainer.Center
                Color: =RGBA(255, 255, 255, 1)
                FillPortions: =1
                FontWeight: =FontWeight.Semibold
                Height: =34
                Size: =16
                Text: ="TZ01 · DAILY TRANSACTION REVIEW"
                ZIndex: =2

            ovhdrRoleSeg As groupContainer.horizontalAutoLayoutContainer:
                AlignInContainer: =AlignInContainer.Center
                Fill: =RGBA(255, 255, 255, 0.13)
                Height: =34
                LayoutGap: =4
                PaddingBottom: =3
                PaddingLeft: =3
                PaddingRight: =3
                PaddingTop: =3
                Width: =240
                ZIndex: =3

                ovhdrMO As button:
                    BorderThickness: =0
                    Color: =If(varRole="MO", RGBA(67, 22, 79, 1), RGBA(227,214,237,1))
                    Fill: =If(varRole="MO", RGBA(255, 255, 255, 1), RGBA(255,255,255,0))
                    FillPortions: =1
                    Height: =28
                    OnSelect: =Set(varRole, "MO"); Navigate(scrOverview, ScreenTransition.Fade)
                    Size: =11
                    Text: ="Middle Office"
                    ZIndex: =1

                ovhdrFO As button:
                    BorderThickness: =0
                    Color: =If(varRole="FO", RGBA(67, 22, 79, 1), RGBA(227,214,237,1))
                    Fill: =If(varRole="FO", RGBA(255, 255, 255, 1), RGBA(255,255,255,0))
                    FillPortions: =1
                    Height: =28
                    OnSelect: =Set(varRole, "FO"); Navigate(scrInbox, ScreenTransition.Fade)
                    Size: =11
                    Text: ="Front Office"
                    ZIndex: =2

            ovhdrLogo As label:
                Align: =Align.Center
                AlignInContainer: =AlignInContainer.Center
                BorderColor: =RGBA(255, 255, 255, 0.4)
                BorderStyle: =BorderStyle.Dashed
                BorderThickness: =1
                Color: =RGBA(255, 255, 255, 1)
                Height: =30
                Size: =11
                Text: ="[ logo ]"
                Width: =110
                ZIndex: =4

        ovftBar As groupContainer.horizontalAutoLayoutContainer:
            BorderColor: =RGBA(228, 228, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(250, 250, 250, 1)
            Height: =56
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =9
            LayoutJustifyContent: =LayoutJustifyContent.End
            PaddingBottom: =10
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =10
            Width: =Parent.Width
            ZIndex: =10

            ftTop As button:
                AlignInContainer: =AlignInContainer.Center
                BorderThickness: =0
                Fill: =RGBA(67, 22, 79, 1)
                Height: =34
                OnSelect: =Navigate(scrTop, ScreenTransition.Cover)
                Size: =12
                Text: ="Monthly TOP Report"
                Width: =180
                ZIndex: =1

            ftPbi As button:
                AlignInContainer: =AlignInContainer.Center
                BorderThickness: =0
                Fill: =RGBA(31, 96, 168, 1)
                Height: =34
                OnSelect: =Notify("Opens Power BI dashboard", NotificationType.Information)
                Size: =12
                Text: ="TOP Report PowerBI"
                Width: =170
                ZIndex: =2

        ovToolbar As groupContainer.horizontalAutoLayoutContainer:
            Fill: =RGBA(0,0,0,0)
            Height: =44
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =8
            LayoutJustifyContent: =LayoutJustifyContent.End
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =4
            Width: =Parent.Width
            ZIndex: =13

            ovToolLead As label:
                Color: =RGBA(90, 90, 94, 1)
                FillPortions: =1
                Height: =30
                Size: =12
                Text: ="Review and validate daily FX & MM listings."
                ZIndex: =1

            ovFoResp As button:
                AlignInContainer: =AlignInContainer.Center
                BorderColor: =RGBA(228, 228, 230, 1)
                BorderThickness: =1
                Color: =If(CountRows(Filter(colTransactions, FlaggedToFO, FOSent, FOResponded, Not(LookUp(colChecks, ID=DailyReportCheckID).Completed)))>0, RGBA(255, 255, 255, 1), RGBA(90, 90, 94, 1))
                Fill: =If(CountRows(Filter(colTransactions, FlaggedToFO, FOSent, FOResponded, Not(LookUp(colChecks, ID=DailyReportCheckID).Completed)))>0, RGBA(59, 109, 17, 1), RGBA(255, 255, 255, 1))
                Height: =34
                OnSelect: =Navigate(scrMoQueue, ScreenTransition.Cover)
                Size: =12
                Text: ="FO responses (" & CountRows(Filter(colTransactions, FlaggedToFO, FOSent, FOResponded, Not(LookUp(colChecks, ID=DailyReportCheckID).Completed))) & ")"
                Width: =180
                ZIndex: =2

        ovHelpWrap As groupContainer.verticalAutoLayoutContainer:
            Fill: =RGBA(0,0,0,0)
            Height: =54
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =10
            Width: =Parent.Width
            ZIndex: =14

            ovHelp As label:
                AlignInContainer: =AlignInContainer.Stretch
                BorderColor: =RGBA(234,217,243,1)
                BorderThickness: =1
                Color: =RGBA(90, 90, 94, 1)
                Fill: =RGBA(251,247,254,1)
                Height: =42
                PaddingLeft: =14
                PaddingRight: =14
                PaddingTop: =8
                Size: =11.5
                Text: ="Clickable prototype. Open a report, then a check, to set MO reason & comment and flag items to FO. Send flagged items in one batch from the Check Analysis screen. Use FO responses to see replies in one place, or switch to Front Office (top right) to answer as FO."
                Width: =Parent.Width
                ZIndex: =15

        ovBody As groupContainer.horizontalAutoLayoutContainer:
            Fill: =RGBA(0,0,0,0)
            LayoutGap: =14
            PaddingBottom: =14
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =14
            Width: =Parent.Width
            ZIndex: =20

            ovLeft As groupContainer.verticalAutoLayoutContainer:
                Fill: =RGBA(0,0,0,0)
                Height: =Parent.Height
                LayoutGap: =8
                Width: =250
                ZIndex: =1

                ovLeftEye As label:
                    AlignInContainer: =AlignInContainer.Start
                    Color: =RGBA(42, 42, 42, 1)
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    Size: =11
                    Text: ="DAILY ITEM LIST"
                    ZIndex: =1

                "galDays As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                    Items: =SortByColumns(colDailyItems, "ItemDate", Descending)
                    Layout: =Layout.Vertical
                    OnSelect: =Set(varCurrentItem, ThisItem); Set(varDayKey, ThisItem.DayKey)
                    TemplatePadding: =0
                    TemplateSize: =86
                    Width: =Parent.Width
                    ZIndex: =2

                    daySel As rectangle:
                        Fill: =RGBA(67, 22, 79, 1)
                        Height: =Parent.TemplateHeight
                        OnSelect: =Select(Parent)
                        Visible: =ThisItem.IsSelected
                        Width: =6
                        ZIndex: =1

                    dayCard As rectangle:
                        BorderColor: =RGBA(228, 228, 230, 1)
                        BorderThickness: =1
                        Fill: =If(ThisItem.IsSelected, RGBA(67, 22, 79, 1), RGBA(255, 255, 255, 1))
                        Height: =Parent.TemplateHeight - 9
                        OnSelect: =Select(Parent)
                        Width: =Parent.TemplateWidth - 10
                        X: =8
                        Y: =2
                        ZIndex: =2

                    dayDate As label:
                        Color: =If(ThisItem.IsSelected, RGBA(255, 255, 255, 1), RGBA(42, 42, 42, 1))
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        OnSelect: =Select(Parent)
                        Size: =12
                        Text: =ThisItem.DayKey
                        Width: =140
                        X: =20
                        Y: =12
                        ZIndex: =3

                    dayId As label:
                        Align: =Align.Right
                        Color: =If(ThisItem.IsSelected, RGBA(217,201,226,1), RGBA(154, 154, 158, 1))
                        Height: =18
                        OnSelect: =Select(Parent)
                        Size: =10
                        Text: ="ID " & ThisItem.ID
                        Width: =60
                        X: =160
                        Y: =12
                        ZIndex: =4

                    dayFind As label:
                        Color: =If(ThisItem.IsSelected, RGBA(255, 255, 255, 1), RGBA(44,74,99,1))
                        Height: =24
                        OnSelect: =Select(Parent)
                        Size: =11
                        Text: ="Findings " & (ThisItem.FXFindings + ThisItem.MMFindings) & "  ·  " & ThisItem.Status
                        Width: =Parent.TemplateWidth - 40
                        X: =20
                        Y: =44
                        ZIndex: =5

            ovMain As groupContainer.verticalAutoLayoutContainer:
                Fill: =RGBA(0,0,0,0)
                Height: =Parent.Height
                LayoutGap: =10
                ZIndex: =2

                ovMainEye As label:
                    AlignInContainer: =AlignInContainer.Start
                    Color: =RGBA(42, 42, 42, 1)
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    Size: =11
                    Text: ="DAILY ITEM DETAILS"
                    ZIndex: =1

                ovLog As label:
                    AlignInContainer: =AlignInContainer.Stretch
                    Color: =RGBA(90, 90, 94, 1)
                    Fill: =RGBA(246,246,247,1)
                    Height: =46
                    PaddingLeft: =12
                    PaddingTop: =8
                    Size: =11
                    Text: |-
                        ="Review log — automatic validation on " & varDayKey & ": FX " & varCurrentItem.FXFindings & " findings, MM " & varCurrentItem.MMFindings & " findings."
                    Width: =Parent.Width
                    ZIndex: =2

                ovstepRow As groupContainer.horizontalAutoLayoutContainer:
                    Fill: =RGBA(0,0,0,0)
                    Height: =40
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =8
                    Width: =Parent.Width
                    ZIndex: =3

                    ovstep1 As label:
                        Color: =If(true, RGBA(31, 96, 168, 1), RGBA(154, 154, 158, 1))
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =11
                        Text: ="1  Imported"
                        Width: =170
                        ZIndex: =1

                    ovstep2 As label:
                        Color: =If(true, RGBA(31, 96, 168, 1), RGBA(154, 154, 158, 1))
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =11
                        Text: ="2  Validated"
                        Width: =180
                        ZIndex: =2

                    ovstep3 As label:
                        Color: =If(varCurrentItem.Status="Completed", RGBA(31, 96, 168, 1), RGBA(154, 154, 158, 1))
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =11
                        Text: ="3  Completed"
                        ZIndex: =3

                ovMainEye2 As label:
                    AlignInContainer: =AlignInContainer.Start
                    Color: =RGBA(42, 42, 42, 1)
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    Size: =11
                    Text: ="TO REVIEW, SELECT REPORT BELOW"
                    ZIndex: =3

                "galReports As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                    Items: =Filter(colDailyReports, DailyItemID = varCurrentItem.ID)
                    Layout: =Layout.Vertical
                    OnSelect: =Set(varCurrentReport, ThisItem); Navigate(scrChecks, ScreenTransition.Cover)
                    TemplatePadding: =0
                    TemplateSize: =58
                    Width: =Parent.Width
                    ZIndex: =5

                    repRow As rectangle:
                        BorderColor: =RGBA(228, 228, 230, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =Parent.TemplateHeight - 1
                        OnSelect: =Select(Parent)
                        Width: =Parent.TemplateWidth
                        ZIndex: =1

                    repName As label:
                        Color: =RGBA(42, 42, 42, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        OnSelect: =Select(Parent)
                        Text: =ThisItem.ReportType & " Listing"
                        Width: =180
                        X: =16
                        Y: =10
                        ZIndex: =2

                    repStatus As label:
                        Color: =If(ThisItem.Submitted, RGBA(59, 109, 17, 1), RGBA(133, 79, 11, 1))
                        Height: =24
                        OnSelect: =Select(Parent)
                        Size: =12
                        Text: =If(ThisItem.Submitted, "Completed", "In review")
                        Width: =180
                        X: =210
                        Y: =10
                        ZIndex: =3

                    repFind As label:
                        Color: =RGBA(90, 90, 94, 1)
                        Height: =24
                        OnSelect: =Select(Parent)
                        Size: =12
                        Text: =Sum(Filter(colChecks, DailyReportID = ThisItem.ID), FlaggedCount) & " finding(s)"
                        Width: =140
                        X: =400
                        Y: =10
                        ZIndex: =4

                    repChev As icon.ChevronRight:
                        Color: =RGBA(154, 154, 158, 1)
                        Height: =24
                        Icon: =Icon.ChevronRight
                        OnSelect: =Select(Parent)
                        Width: =24
                        X: =Parent.TemplateWidth - 44
                        Y: =Parent.TemplateHeight/2 - 12
                        ZIndex: =5

