scrOverview As screen:
    Fill: =varTheme.Bg

    ovRoot As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(0,0,0,0)
        Height: =Parent.Height
        Width: =Parent.Width
        ZIndex: =1

        ovhdrBar As groupContainer.horizontalAutoLayoutContainer:
            Fill: =varTheme.Purple
            Height: =58
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingBottom: =12
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =12
            Width: =Parent.Width
            ZIndex: =10

            ovhdrTitle As label:
                AlignInContainer: =AlignInContainer.Center
                Color: =varTheme.White
                FillPortions: =1
                FontWeight: =FontWeight.Semibold
                Height: =34
                Size: =16
                Text: ="TZ01 · DAILY TRANSACTION REVIEW"
                ZIndex: =2

            ovhdrRoleSeg As groupContainer.horizontalAutoLayoutContainer:
                AlignInContainer: =AlignInContainer.Center
                Fill: =RGBA(255, 255, 255, 0.13)
                Height: =34
                LayoutGap: =4
                PaddingBottom: =3
                PaddingLeft: =3
                PaddingRight: =3
                PaddingTop: =3
                Visible: =IsBlank(varRoleResolved)
                Width: =240
                ZIndex: =3

                ovhdrMO As button:
                    BorderThickness: =0
                    Color: =If(varRole="MO", varTheme.Purple, RGBA(227,214,237,1))
                    Fill: =If(varRole="MO", varTheme.White, RGBA(255,255,255,0))
                    FillPortions: =1
                    Height: =28
                    OnSelect: =Set(varRole, "MO"); Navigate(scrOverview, ScreenTransition.Fade)
                    Size: =11
                    Text: ="Middle Office"
                    ZIndex: =1

                ovhdrFO As button:
                    BorderThickness: =0
                    Color: =If(varRole="FO", varTheme.Purple, RGBA(227,214,237,1))
                    Fill: =If(varRole="FO", varTheme.White, RGBA(255,255,255,0))
                    FillPortions: =1
                    Height: =28
                    OnSelect: =Set(varRole, "FO"); Navigate(scrInbox, ScreenTransition.Fade)
                    Size: =11
                    Text: ="Front Office"
                    ZIndex: =2

            ovhdrLogo As label:
                Align: =Align.Center
                AlignInContainer: =AlignInContainer.Center
                BorderColor: =RGBA(255, 255, 255, 0.4)
                BorderStyle: =BorderStyle.Dashed
                BorderThickness: =1
                Color: =varTheme.White
                Height: =30
                Size: =11
                Text: ="[ logo ]"
                Width: =110
                ZIndex: =4

            ovhdrUser As label:
                Align: =Align.Right
                AlignInContainer: =AlignInContainer.Center
                Color: =RGBA(227, 214, 237, 1)
                Height: =30
                Size: =11
                Text: ="Signed in as " & Coalesce(varUser.FullName, varUser.Email, "Demo user") & "  ·  " & varRole
                Width: =220
                ZIndex: =5

        ovftBar As groupContainer.horizontalAutoLayoutContainer:
            BorderColor: =varTheme.Line
            BorderThickness: =1
            Fill: =RGBA(250, 250, 250, 1)
            Height: =56
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =9
            LayoutJustifyContent: =LayoutJustifyContent.End
            PaddingBottom: =10
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =10
            Width: =Parent.Width
            ZIndex: =10

            ftTop As button:
                AlignInContainer: =AlignInContainer.Center
                BorderThickness: =0
                Color: =varTheme.White
                Fill: =varTheme.Purple
                Height: =34
                OnSelect: =Navigate(scrTop, ScreenTransition.Cover)
                Size: =12
                Text: ="Monthly TOP Report"
                Width: =180
                ZIndex: =1

            ftPbi As button:
                AlignInContainer: =AlignInContainer.Center
                BorderThickness: =0
                Color: =varTheme.White
                Fill: =varTheme.Blue
                Height: =34
                OnSelect: =Notify("Opens Power BI dashboard", NotificationType.Information)
                Size: =12
                Text: ="TOP Report PowerBI"
                Width: =170
                ZIndex: =2

        ovToolbar As groupContainer.horizontalAutoLayoutContainer:
            Fill: =RGBA(0,0,0,0)
            Height: =44
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =8
            LayoutJustifyContent: =LayoutJustifyContent.End
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =4
            Width: =Parent.Width
            ZIndex: =13

            ovToolLead As label:
                Color: =varTheme.Muted
                FillPortions: =1
                Height: =30
                Size: =12
                Text: ="Review and validate daily FX & MM listings."
                ZIndex: =1

            ovFoResp As button:
                AlignInContainer: =AlignInContainer.Center
                BorderColor: =varTheme.Line
                BorderThickness: =1
                Color: =If(CountRows(Filter(colTransactions, FlaggedToFO, FOSent, Not(LookUp(colChecks, ID=DailyReportCheckID).Completed)))>0, varTheme.White, varTheme.Muted)
                Fill: =If(CountRows(Filter(colTransactions, FlaggedToFO, FOSent, Not(LookUp(colChecks, ID=DailyReportCheckID).Completed)))>0, varTheme.Green, varTheme.Card)
                Height: =34
                OnSelect: =Navigate(scrMoQueue, ScreenTransition.Cover)
                Size: =12
                Text: ="My Queue (" & CountRows(Filter(colTransactions, FlaggedToFO, FOSent, Not(LookUp(colChecks, ID=DailyReportCheckID).Completed))) & ")"
                Width: =180
                ZIndex: =2

            ovUpload As button:
                AlignInContainer: =AlignInContainer.Center
                BorderColor: =varTheme.Line
                BorderThickness: =1
                Color: =varTheme.Muted
                DisplayMode: =If(varRole="MO", DisplayMode.Edit, DisplayMode.Disabled)
                Fill: =varTheme.Card
                Height: =34
                OnSelect: =Set(varShowUpload, true)
                Size: =12
                Text: ="Upload input file"
                Width: =150
                ZIndex: =3

            ovAdmin As button:
                AlignInContainer: =AlignInContainer.Center
                BorderColor: =varTheme.Line
                BorderThickness: =1
                Color: =varTheme.Muted
                Fill: =varTheme.Card
                Height: =34
                OnSelect: =Navigate(scrAdmin, ScreenTransition.Cover)
                Size: =12
                Text: ="Configuration"
                Visible: =varIsAdmin
                Width: =140
                ZIndex: =4

        ovHelpWrap As groupContainer.verticalAutoLayoutContainer:
            Fill: =RGBA(0,0,0,0)
            Height: =54
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =10
            Width: =Parent.Width
            ZIndex: =14

            ovHelp As label:
                AlignInContainer: =AlignInContainer.Stretch
                BorderColor: =RGBA(234,217,243,1)
                BorderThickness: =1
                Color: =varTheme.Muted
                Fill: =RGBA(251,247,254,1)
                Height: =42
                PaddingLeft: =14
                PaddingRight: =14
                PaddingTop: =8
                Size: =11.5
                Text: ="Clickable prototype. Open a report, then a check, to set MO reason & comment and flag items to FO. Send flagged items in one batch from the Check Analysis screen. Use My Queue to review findings, send to FO, and act on replies in one place, or switch to Front Office (top right) to answer as FO."
                Width: =Parent.Width
                ZIndex: =15

        ovOffline As label:
            AlignInContainer: =AlignInContainer.Stretch
            Color: =varTheme.White
            Fill: =varTheme.Amber
            Height: =26
            PaddingLeft: =20
            Size: =11
            Text: ="● Offline — showing the last loaded data. Changes are saved locally and sync when you reconnect."
            Visible: =!Connection.Connected
            Width: =Parent.Width
            ZIndex: =15

        ovBody As groupContainer.horizontalAutoLayoutContainer:
            Fill: =RGBA(0,0,0,0)
            LayoutGap: =14
            PaddingBottom: =14
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =14
            Width: =Parent.Width
            ZIndex: =20

            ovLeft As groupContainer.verticalAutoLayoutContainer:
                Fill: =RGBA(0,0,0,0)
                Height: =Parent.Height
                LayoutGap: =8
                Width: =250
                ZIndex: =1

                ovLeftEye As label:
                    AlignInContainer: =AlignInContainer.Start
                    Color: =varTheme.Ink
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    Size: =11
                    Text: ="DAILY ITEM LIST"
                    ZIndex: =1

                "galDays As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                    Default: =varSelectedItem
                    Items: =SortByColumns(colDailyItems, "ItemDate", Descending)
                    Layout: =Layout.Vertical
                    OnSelect: =Set(varSelectedItem, ThisItem); Set(varDayKey, ThisItem.DayKey)
                    TemplatePadding: =0
                    TemplateSize: =86
                    Width: =Parent.Width
                    ZIndex: =2

                    dayCardC As groupContainer.verticalAutoLayoutContainer:
                        BorderColor: =varTheme.Line
                        BorderThickness: =1
                        Fill: =If(ThisItem.ID = varSelectedItem.ID, varTheme.Purple, varTheme.Card)
                        Height: =Parent.TemplateHeight - 9
                        LayoutGap: =4
                        PaddingBottom: =10
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =10
                        Width: =Parent.TemplateWidth - 10
                        X: =8
                        Y: =2
                        ZIndex: =1

                        dayTop As groupContainer.horizontalAutoLayoutContainer:
                            Fill: =RGBA(0,0,0,0)
                            Height: =20
                            LayoutAlignItems: =LayoutAlignItems.Center
                            LayoutGap: =6
                            Width: =Parent.Width
                            ZIndex: =1

                            dayDate As label:
                                Color: =If(ThisItem.ID = varSelectedItem.ID, varTheme.White, varTheme.Ink)
                                FillPortions: =1
                                FontWeight: =FontWeight.Semibold
                                Height: =20
                                OnSelect: =Set(varSelectedItem, ThisItem); Set(varDayKey, ThisItem.DayKey)
                                Size: =12
                                Text: =ThisItem.DayKey
                                ZIndex: =1

                            dayId As label:
                                Align: =Align.Right
                                Color: =If(ThisItem.ID = varSelectedItem.ID, RGBA(217,201,226,1), varTheme.Faint)
                                Height: =20
                                OnSelect: =Set(varSelectedItem, ThisItem); Set(varDayKey, ThisItem.DayKey)
                                Size: =12
                                Text: ="ID " & ThisItem.ID
                                Width: =64
                                ZIndex: =2

                        dayFind As label:
                            AlignInContainer: =AlignInContainer.Stretch
                            Color: =If(ThisItem.ID = varSelectedItem.ID, varTheme.White, RGBA(44,74,99,1))
                            Height: =22
                            OnSelect: =Set(varSelectedItem, ThisItem); Set(varDayKey, ThisItem.DayKey)
                            Size: =12
                            Text: ="Findings " & (ThisItem.FXFindings + ThisItem.MMFindings) & "  ·  " & ThisItem.Status
                            Width: =Parent.Width
                            ZIndex: =2

                "galInputFiles As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                    Height: =130
                    Items: =Filter(colInputFiles, DayKey = varSelectedItem.DayKey)
                    Layout: =Layout.Vertical
                    TemplatePadding: =2
                    TemplateSize: =40
                    Width: =Parent.Width
                    ZIndex: =3

                    ifRow As groupContainer.verticalAutoLayoutContainer:
                        BorderColor: =varTheme.Line
                        BorderThickness: =1
                        Fill: =varTheme.Card
                        Height: =Parent.TemplateHeight - 2
                        PaddingBottom: =3
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =3
                        Width: =Parent.TemplateWidth
                        Y: =1
                        ZIndex: =1

                        ifKind As label:
                            AlignInContainer: =AlignInContainer.Stretch
                            Color: =If(ThisItem.Validated, varTheme.Green, varTheme.Amber)
                            FontWeight: =FontWeight.Semibold
                            Height: =15
                            Size: =10
                            Text: =ThisItem.FileKind & If(ThisItem.Validated, "  ✓ validated", "  · not validated")
                            Width: =Parent.Width
                            ZIndex: =1

                        ifMeta As groupContainer.horizontalAutoLayoutContainer:
                            Fill: =RGBA(0,0,0,0)
                            Height: =17
                            LayoutAlignItems: =LayoutAlignItems.Center
                            LayoutGap: =6
                            Width: =Parent.Width
                            ZIndex: =2

                            ifName As label:
                                Color: =varTheme.Faint
                                FillPortions: =1
                                Height: =15
                                Size: =9
                                Text: =ThisItem.FileName & "  ·  " & ThisItem.Source
                                Wrap: =false
                                ZIndex: =1

                            ifValidate As button:
                                AlignInContainer: =AlignInContainer.Center
                                BorderThickness: =0
                                Color: =varTheme.White
                                DisplayMode: =If(varRole="MO", DisplayMode.Edit, DisplayMode.Disabled)
                                Fill: =varTheme.Orange
                                Height: =17
                                OnSelect: =Set(varConfirmValidate, true)
                                Size: =9
                                Text: ="Validate"
                                Visible: =!ThisItem.Validated
                                Width: =60
                                ZIndex: =2

                ovFilesEye As label:
                    AlignInContainer: =AlignInContainer.Start
                    Color: =varTheme.Ink
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    Size: =11
                    Text: ="INPUT FILES · SELECTED DAY"
                    ZIndex: =4

            ovMain As groupContainer.verticalAutoLayoutContainer:
                Fill: =RGBA(0,0,0,0)
                Height: =Parent.Height
                LayoutGap: =10
                ZIndex: =2

                ovMainEye As label:
                    AlignInContainer: =AlignInContainer.Start
                    Color: =varTheme.Ink
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    Size: =11
                    Text: ="DAILY ITEM DETAILS"
                    ZIndex: =1

                ovLogEye As label:
                    AlignInContainer: =AlignInContainer.Stretch
                    Color: =varTheme.Ink
                    FontWeight: =FontWeight.Semibold
                    Height: =16
                    Size: =11
                    Text: ="REVIEW LOG (LIVE)"
                    ZIndex: =2

                ovstepRow As groupContainer.horizontalAutoLayoutContainer:
                    Fill: =RGBA(0,0,0,0)
                    Height: =40
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =8
                    Width: =Parent.Width
                    ZIndex: =3

                    ovstep1 As label:
                        Color: =If(true, varTheme.Blue, varTheme.Faint)
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =11
                        Text: ="1  Imported"
                        Width: =170
                        ZIndex: =1

                    ovstep2 As label:
                        Color: =If(true, varTheme.Blue, varTheme.Faint)
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =11
                        Text: ="2  Validated"
                        Width: =180
                        ZIndex: =2

                    ovstep3 As label:
                        Color: =If(varSelectedItem.Status="Completed", varTheme.Blue, varTheme.Faint)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =11
                        Text: ="3  Completed"
                        ZIndex: =3

                "galAudit As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                    Fill: =RGBA(246,246,247,1)
                    Height: =96
                    Items: =FirstN(SortByColumns(colAudit, "Seq", SortOrder.Descending), 6)
                    Layout: =Layout.Vertical
                    TemplatePadding: =0
                    TemplateSize: =24
                    Width: =Parent.Width
                    ZIndex: =3

                    auRow As label:
                        Color: =varTheme.Muted
                        Height: =22
                        Size: =11
                        Text: |-
                            =Text(ThisItem.Stamp, "dd mmm hh:mm") & "   —   " & ThisItem.Text
                        Width: =Parent.TemplateWidth - 16
                        X: =10
                        ZIndex: =1

                ovMainEye2 As label:
                    AlignInContainer: =AlignInContainer.Start
                    Color: =varTheme.Ink
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    Size: =11
                    Text: ="TO REVIEW, SELECT REPORT BELOW"
                    ZIndex: =3

                "galReports As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                    Items: =Filter(colDailyReports, DailyItemID = varSelectedItem.ID)
                    Layout: =Layout.Vertical
                    OnSelect: =Set(varCurrentReport, ThisItem); Navigate(scrChecks, ScreenTransition.Cover)
                    TemplatePadding: =0
                    TemplateSize: =58
                    Width: =Parent.Width
                    ZIndex: =5

                    repRowC As groupContainer.horizontalAutoLayoutContainer:
                        BorderColor: =varTheme.Line
                        BorderThickness: =1
                        Fill: =varTheme.Card
                        Height: =Parent.TemplateHeight - 1
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =10
                        PaddingLeft: =16
                        PaddingRight: =12
                        Width: =Parent.TemplateWidth
                        ZIndex: =1

                        repName As label:
                            Color: =varTheme.Ink
                            FillPortions: =2
                            FontWeight: =FontWeight.Semibold
                            Height: =24
                            OnSelect: =Set(varCurrentReport, ThisItem); Navigate(scrChecks, ScreenTransition.Cover)
                            Text: =ThisItem.ReportType & " Listing"
                            ZIndex: =1

                        repStatus As label:
                            Color: =If(ThisItem.Submitted, varTheme.Green, varTheme.Amber)
                            Height: =24
                            OnSelect: =Set(varCurrentReport, ThisItem); Navigate(scrChecks, ScreenTransition.Cover)
                            Size: =12
                            Text: =If(ThisItem.Submitted, "Completed", "In review")
                            ZIndex: =2

                        repFind As label:
                            Color: =varTheme.Muted
                            Height: =24
                            OnSelect: =Set(varCurrentReport, ThisItem); Navigate(scrChecks, ScreenTransition.Cover)
                            Size: =12
                            Text: =Sum(Filter(colChecks, DailyReportID = ThisItem.ID), FlaggedCount) & " finding(s)"
                            Width: =140
                            ZIndex: =3

                        repChev As icon.ChevronRight:
                            AccessibleLabel: ="Open " & ThisItem.ReportType & " report"
                            AlignInContainer: =AlignInContainer.Center
                            Color: =varTheme.Faint
                            Height: =24
                            Icon: =Icon.ChevronRight
                            OnSelect: =Set(varCurrentReport, ThisItem); Navigate(scrChecks, ScreenTransition.Cover)
                            Width: =24
                            ZIndex: =4

    cfValScrim As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(20, 10, 30, 0.45)
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Center
        LayoutJustifyContent: =LayoutJustifyContent.Center
        Visible: =varConfirmValidate
        Width: =Parent.Width
        ZIndex: =900

        cfValCard As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.Center
            BorderColor: =varTheme.Line
            BorderThickness: =1
            Fill: =varTheme.Card
            Height: =210
            LayoutGap: =12
            PaddingBottom: =20
            PaddingLeft: =22
            PaddingRight: =22
            PaddingTop: =20
            Width: =460
            ZIndex: =2

            cfValTitle As label:
                AlignInContainer: =AlignInContainer.Stretch
                Color: =varTheme.Ink
                FontWeight: =FontWeight.Semibold
                Height: =26
                Size: =15
                Text: ="Run validation now?"
                Width: =Parent.Width
                ZIndex: =1

            cfValMsg As label:
                AlignInContainer: =AlignInContainer.Stretch
                Color: =varTheme.Muted
                FillPortions: =1
                Size: =12
                Text: ="The file is saved to Input Files for " & varSelectedItem.DayKey & ". Running validation will (re)generate the checks and findings for this day and append the review log. Nothing runs and nobody is notified until you confirm — you can also validate later from the Input files list."
                Width: =Parent.Width
                ZIndex: =2

            cfValBtns As groupContainer.horizontalAutoLayoutContainer:
                Fill: =RGBA(0,0,0,0)
                Height: =40
                LayoutGap: =10
                LayoutJustifyContent: =LayoutJustifyContent.End
                Width: =Parent.Width
                ZIndex: =3

                cfValCancel As button:
                    AlignInContainer: =AlignInContainer.Center
                    BorderColor: =varTheme.Line
                    BorderThickness: =1
                    Color: =varTheme.Muted
                    Fill: =varTheme.Card
                    Height: =36
                    OnSelect: =Set(varConfirmValidate, false); Notify("Upload saved — validate any time from the Input files list", NotificationType.Information)
                    Size: =12
                    Text: ="Cancel"
                    Width: =110
                    ZIndex: =1

                cfValOk As button:
                    AlignInContainer: =AlignInContainer.Center
                    BorderThickness: =0
                    Color: =varTheme.White
                    Fill: =varTheme.Orange
                    Height: =36
                    OnSelect: |-
                        =IfError(/* PROD-FLOW: TZ01_Run_Validation_App.Run(varSelectedItem.ID, ...) fires HERE — after that reload colChecks/colTransactions and re-run the colTxnCells flatten; offline we mark the rows validated */ ForAll(Filter(colInputFiles, DayKey = varSelectedItem.DayKey, !Validated) As F, Patch(colInputFiles, F, {Validated: true})); Set(varAuditSeq, varAuditSeq + 1); Collect(colAudit, {Seq: varAuditSeq, Stamp: Now(), Text: "Validation triggered for " & varSelectedItem.DayKey & " (manual upload)"}); Notify("Validation started — checks and findings will refresh when it completes", NotificationType.Success), Notify("Could not start validation — please retry", NotificationType.Error)); Set(varConfirmValidate, false)
                    Size: =12
                    Text: ="Run validation"
                    Width: =190
                    ZIndex: =2

    ovUpScrim As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(20, 10, 30, 0.45)
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Center
        LayoutJustifyContent: =LayoutJustifyContent.Center
        Visible: =varShowUpload
        Width: =Parent.Width
        ZIndex: =940

        ovUpCard As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.Center
            BorderColor: =varTheme.Line
            BorderThickness: =1
            Fill: =varTheme.Card
            Height: =250
            LayoutGap: =10
            PaddingBottom: =20
            PaddingLeft: =22
            PaddingRight: =22
            PaddingTop: =20
            Width: =460
            ZIndex: =1

            ovUpTitle As label:
                AlignInContainer: =AlignInContainer.Stretch
                Color: =varTheme.Ink
                FontWeight: =FontWeight.Semibold
                Height: =24
                Size: =15
                Text: ="Upload input file — " & varSelectedItem.DayKey
                Width: =Parent.Width
                ZIndex: =1

            ovUpHint As label:
                AlignInContainer: =AlignInContainer.Stretch
                Color: =varTheme.Muted
                Height: =44
                Size: =11
                Text: ="Manual fallback when the report email did not arrive. The file is stored in the Input Files library; validation runs ONLY after you confirm it in the next step."
                Width: =Parent.Width
                ZIndex: =2

            ovUpKind As dropdown:
                AlignInContainer: =AlignInContainer.Stretch
                Default: =""
                Height: =36
                Items: =["FX Listing","MM Listing","ZTRM Export","US Bank Report","Other"]
                Width: =Parent.Width
                ZIndex: =3

            ovUpFile As text:
                AlignInContainer: =AlignInContainer.Stretch
                Default: =""
                Height: =36
                HintText: ="file name (optional — generated if empty)"
                Width: =Parent.Width
                ZIndex: =4

            ovUpBtns As groupContainer.horizontalAutoLayoutContainer:
                Fill: =RGBA(0,0,0,0)
                Height: =40
                LayoutGap: =10
                LayoutJustifyContent: =LayoutJustifyContent.End
                Width: =Parent.Width
                ZIndex: =5

                ovUpCancel As button:
                    AlignInContainer: =AlignInContainer.Center
                    BorderColor: =varTheme.Line
                    BorderThickness: =1
                    Color: =varTheme.Muted
                    Fill: =varTheme.Card
                    Height: =36
                    OnSelect: =Set(varShowUpload, false)
                    Size: =12
                    Text: ="Cancel"
                    Width: =110
                    ZIndex: =1

                ovUpOk As button:
                    AlignInContainer: =AlignInContainer.Center
                    BorderThickness: =0
                    Color: =varTheme.White
                    Fill: =varTheme.Blue
                    Height: =36
                    OnSelect: |-
                        =If(IsBlank(ovUpKind.Selected.Value), Notify("Choose the file kind first", NotificationType.Error), Collect(colInputFiles, {DayKey: varSelectedItem.DayKey, FileKind: ovUpKind.Selected.Value, ReportType: Switch(ovUpKind.Selected.Value, "FX Listing", "FX", "MM Listing", "MM", ""), FileName: If(IsBlank(ovUpFile.Text), Lower(Substitute(ovUpKind.Selected.Value, " ", "_")) & "_" & Text(Now(), "yyyymmdd_hhmm") & ".xlsx", ovUpFile.Text), ReceivedOn: Now(), Source: "Manual upload", Validated: false}); /* PROD: upload the picked file into the TZ01 Input Files library here (Attachments / library upload) */ Set(varAuditSeq, varAuditSeq + 1); Collect(colAudit, {Seq: varAuditSeq, Stamp: Now(), Text: "Input file uploaded manually — " & ovUpKind.Selected.Value}); Set(varShowUpload, false); Set(varConfirmValidate, true))
                    Size: =12
                    Text: ="Upload"
                    Width: =150
                    ZIndex: =2

    ovLoadScrim As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(20, 10, 30, 0.35)
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Center
        LayoutJustifyContent: =LayoutJustifyContent.Center
        Visible: =varLoading
        Width: =Parent.Width
        ZIndex: =950

        ovLoadCard As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.Center
            BorderColor: =varTheme.Line
            BorderThickness: =1
            Fill: =varTheme.Card
            Height: =90
            LayoutGap: =8
            PaddingBottom: =20
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =20
            Width: =240
            ZIndex: =1

            ovLoadTxt As label:
                Align: =Align.Center
                AlignInContainer: =AlignInContainer.Stretch
                Color: =varTheme.Ink
                Height: =24
                Text: ="Loading data…"
                Width: =Parent.Width
                ZIndex: =1

