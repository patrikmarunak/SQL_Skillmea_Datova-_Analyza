<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TZ01 · Treasury Transaction Review</title>
<style>
:root{
  --purple:#43164f; --purple-d:#34103d; --blue:#1f60a8; --blue-l:#e9f2fb;
  --orange:#bf5320; --green:#3b6d11; --red:#a32d2d; --amber:#854f0b;
  --ink:#2a2a2a; --muted:#5a5a5e; --faint:#9a9a9e; --line:#e4e4e6;
  --bg:#eceef1; --card:#ffffff; --thead:#edeff2;
  --sans:"Segoe UI",Arial,Helvetica,sans-serif; --mono:"Consolas","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:18px auto;padding:0 14px}
.app{background:var(--card);border:1px solid #d8d8da;border-radius:12px;overflow:hidden;box-shadow:0 6px 26px rgba(40,10,55,.10)}
.hdr{background:var(--purple);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr .title{display:flex;align-items:center;gap:12px;color:#fff;font-size:16px;font-weight:600;letter-spacing:.04em}
.hdr .right{display:flex;align-items:center;gap:14px}
.hdr .logo{color:#fff;font-style:italic;font-size:14px;opacity:.96;white-space:nowrap}
.hdr .logo small{font-style:normal;font-size:9px;opacity:.8}
.backbtn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.backbtn:hover{background:rgba(255,255,255,.24)}
.roleseg{display:flex;background:rgba(255,255,255,.13);border-radius:8px;padding:3px}
.roleseg button{border:none;background:none;color:#e3d6ed;font-size:11.5px;padding:6px 14px;border-radius:6px;cursor:pointer;letter-spacing:.03em;font-weight:600}
.roleseg button.on{background:#fff;color:var(--purple)}
.roleseg button:not(.on):hover{color:#fff}
.body{padding:16px 20px;min-height:320px}
.subrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.subrow .lead{font-size:13px;color:var(--muted)}
.tools{display:flex;align-items:center;gap:10px}
.ico-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #dcdce0;background:#fff;border-radius:6px;padding:6px 11px;font-size:12px;color:var(--muted);cursor:pointer}
.ico-btn:hover{border-color:#bfbfc4}
.ico-btn.disabled{color:#b6b6ba;cursor:default}
.ico-btn.active{background:var(--purple);border-color:var(--purple);color:#fff}
.refresh{color:var(--blue);cursor:pointer;display:inline-flex}.refresh:hover{opacity:.7}
.eyebrow{font-size:11px;font-weight:600;color:#3a3a3a;letter-spacing:.05em;margin:0 0 9px}
.split{display:flex;gap:14px;align-items:flex-start}
.col-list{width:230px;flex:0 0 230px}
.col-main{flex:1;min-width:0}
.item{border-radius:8px;padding:10px 12px;margin-bottom:9px;cursor:pointer;border:1px solid var(--line);background:#fff;transition:.12s}
.item:hover{border-color:#c7c7cc;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.item.sel{background:var(--purple);border-color:var(--purple)}
.item .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.item .d{font-size:12px;font-weight:600}.item .id{font-size:11px}
.item.sel .d{color:#fff}.item.sel .id{color:#d9c9e2}
.item:not(.sel) .d{color:var(--ink)}.item:not(.sel) .id{color:var(--faint)}
.pill{border-radius:5px;padding:4px 9px;font-size:11.5px;margin-bottom:4px}
.item.sel .pill{background:#fff;color:var(--purple)}
.item:not(.sel) .pill{background:var(--blue-l);color:#2c4a63}
.pill:last-child{margin-bottom:0}
.stepper{display:flex;align-items:center;margin:6px 0 18px}
.step{display:flex;align-items:center;gap:7px}
.dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:0 0 22px}
.dot.on{background:var(--blue)}.dot.off{background:#cfd6dd}
.step .lab{font-size:11.5px}.step .lab.on{color:var(--ink)}.step .lab.off{color:var(--faint)}
.bar{flex:1;height:2px;margin:0 8px}.bar.on{background:var(--blue)}.bar.off{background:#cfd6dd}
.logbox{background:#f6f6f7;border-radius:8px;padding:11px 13px;margin-bottom:14px}
.logbox h4{margin:0 0 5px;font-size:11.5px;font-weight:600;color:#3a3a3a}
.logbox p{margin:0;font-size:11px;color:var(--muted);line-height:1.65}
.tbl-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
thead.simple th{background:var(--thead);text-align:left;padding:9px 11px;font-weight:600;color:#4a4a4f}
tbody td{padding:10px 11px;border-top:1px solid #efeff1}
tr.click{cursor:pointer}tr.click:hover{background:#f3f8fd}
.mono{font-family:var(--mono);font-size:10.5px}
.dotr{font-size:13px;vertical-align:-1px;margin-right:2px}
.r-red{color:var(--red)}.r-green{color:var(--green)}.r-amber{color:var(--amber)}.r-blue{color:var(--blue)}.r-orange{color:var(--orange)}
.grp-read{background:#eef0f2;color:#5a5a5e}.grp-mo{background:#eaf1fb;color:var(--blue)}.grp-fo{background:#faf3e8;color:#a07b2e}
.findtbl thead .grp th{padding:7px 11px;text-align:left;font-size:10.5px;font-weight:700}
.findtbl thead .cols th{background:#f5f6f7;text-align:left;padding:8px 9px;font-weight:600;color:#4a4a4f;font-size:11px;white-space:nowrap}
.findtbl td{vertical-align:middle}
.sep{border-right:2px solid #d9d9dd}
.inp,.sel{width:100%;border:1px solid #cfcfd2;border-radius:5px;padding:5px 8px;font-size:11.5px;font-family:var(--sans);color:var(--ink);background:#fff}
.inp:focus,.sel:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(31,96,168,.12)}
.sel.green{border-color:#bcd6bc;background:#f1f8f1;color:var(--green)}
.fo-inp{border-color:#e0cfa8}.fo-inp:disabled{background:#faf8f3;color:#bdbdbd}
.inp:disabled,.sel:disabled{background:#f3f3f4;color:#9a9a9e}
.chk{width:17px;height:17px;cursor:pointer;accent-color:var(--blue)}
.cellmin{min-width:135px}.cellmin-s{min-width:115px}
.muted-note{font-size:10.5px;color:#8a8a8e;margin:9px 2px 0}.warn-note{color:var(--orange)}
.attach-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#eef3f9;border:1px solid #d6e3f1;color:#345;border-radius:13px;padding:3px 10px;font-size:11px}
.chip button{border:none;background:none;color:#789;cursor:pointer;font-size:13px;line-height:1}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ic{font-size:30px;color:var(--green);margin-bottom:8px}
.empty h3{margin:0 0 4px;font-size:15px;color:var(--ink)}.empty p{margin:0;font-size:12.5px}
.foot{background:#fafafa;border-top:1px solid var(--line);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.foot .left{font-size:11px;color:#8a8a8e;display:flex;align-items:center;gap:6px}
.foot .right{display:flex;gap:9px;flex-wrap:wrap}
.btn{border:none;border-radius:6px;padding:8px 17px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-purple{background:var(--purple);color:#fff}.btn-blue{background:var(--blue);color:#fff}
.btn-orange{background:var(--orange);color:#fff}.btn-ghost{background:#fff;border:1px solid #dcdce0;color:var(--muted)}
.btn-green{background:var(--green);color:#fff}.btn:hover{filter:brightness(1.06)}
.btn[disabled]{background:#fff;border:1px solid var(--line);color:#b6b6ba;cursor:not-allowed;filter:none}
.linklike{font-size:11px;color:var(--orange);border:1px solid #e6c4b0;background:#fff;border-radius:5px;padding:4px 9px;cursor:pointer}
.linklike:hover{background:#fbf2ec}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#23123a;color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.demo-tag{font-size:9.5px;letter-spacing:.05em;background:rgba(255,255,255,.16);color:#fff;border-radius:4px;padding:2px 7px;text-transform:uppercase}
.help{font-size:11.5px;color:var(--muted);background:#fbf7fe;border:1px solid #ead9f3;border-radius:8px;padding:9px 13px;margin-bottom:14px}
.help b{color:var(--purple)}
.inbox-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.inbox-head .cnt{font-size:12px;color:var(--muted)}
.fcard{border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:11px;background:#fff}
.fcard.done{background:#fafbfc}
.fcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}
.fcard .where{font-size:12.5px;color:var(--ink);font-weight:600;line-height:1.5}
.fcard .where span{color:var(--muted);font-weight:400}
.fcard .ask{background:#f6f6f7;border-radius:7px;padding:9px 11px;font-size:11.5px;color:var(--muted);margin-bottom:11px}
.fcard .ask b{color:var(--ink)}
.fcard .resp{display:grid;grid-template-columns:200px 1fr auto;gap:9px;align-items:end}
.fcard .fld label{display:block;font-size:10px;color:#a07b2e;margin-bottom:3px}
.deeplink{font-size:10.5px;color:var(--blue);display:inline-flex;align-items:center;gap:4px}
.badge{display:inline-block;border-radius:11px;padding:2px 10px;font-size:11px;white-space:nowrap}
.b-amber{background:#fdf0db;color:var(--amber)}.b-green{background:#e7f3e7;color:var(--green)}
.topnote{font-size:11.5px;color:var(--muted);margin:0 0 12px;display:flex;gap:6px;align-items:flex-start}
svg{display:block}
@media(max-width:820px){.split{flex-direction:column}.col-list{width:100%;flex:auto}.fcard .resp{grid-template-columns:1fr}}

/* ===== UX pass 2 (B filter/search/sort · C responsive · E breadcrumb/unsaved · F states/audit · G theme) ===== */
:root{ --tint-amber:#fdf6e9; --tint-red:#fbecec; --tint-grey:#f6f6f7; --scrim:rgba(20,10,30,.34); }
.crumb{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin:0 0 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumb .sepc{color:var(--faint)}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 12px}
.toolbar .search input{border:1px solid #cfcfd2;border-radius:6px;padding:7px 11px;font-size:12px;font-family:var(--sans);color:var(--ink);min-width:230px}
.toolbar .search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(31,96,168,.12)}
.toolbar select.fsel{border:1px solid #cfcfd2;border-radius:6px;padding:7px 10px;font-size:12px;font-family:var(--sans);color:var(--ink);background:#fff}
.toolbar label.slab{font-size:11.5px;color:var(--muted)}
.toolbar .spacer{flex:1}
.toolbar .count{font-size:11.5px;color:var(--muted)}
.unsaved{color:var(--amber);font-weight:600}
.offline-banner{display:none;background:var(--amber);color:#fff;font-size:11.5px;padding:7px 20px}
body.offline .offline-banner{display:block}
#loading{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;z-index:60}
#loading.show{display:flex}
#loading .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 30px;font-size:13px;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;align-items:center;gap:12px}
.spin{width:18px;height:18px;border:2.5px solid #d8d2e0;border-top-color:var(--purple);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.logfeed{margin:0;padding:0;list-style:none}
.logfeed li{font-size:11px;color:var(--muted);line-height:1.7;display:flex;gap:8px}
.logfeed li .t{color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.rec-wrap{margin:6px 0 10px}
.rec-bar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:4px}
.rec-bar .ico-btn{padding:4px 9px;font-size:11px}
.rec-cnt{font-size:10.5px;color:var(--muted)}
/* confirm-before-send dialog (avoids notification spam — one batched send per queue) */
#confirm{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;z-index:70;padding:20px}
#confirm.show{display:flex}
#confirm .cf-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;max-width:460px;width:100%;box-shadow:0 16px 44px rgba(0,0,0,.28)}
#confirm .cf-title{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 9px;display:flex;align-items:center;gap:10px}
#confirm .cf-title .ic{color:var(--amber);flex:0 0 auto;display:inline-flex}
#confirm .cf-msg{font-size:12.5px;color:var(--muted);line-height:1.65;margin-bottom:18px}
#confirm .cf-msg b{color:var(--ink)}
#confirm .cf-actions{display:flex;justify-content:flex-end;gap:9px}
</style>
</head>
<body>
<div class="wrap">
  <div class="app">
    <div class="hdr">
      <div class="title">
        <button class="backbtn" id="backBtn" style="display:none" onclick="App.back()">‹ Back</button>
        <span id="hdrTitle">TZ01 DAILY TRANSACTION REVIEW</span>
        <span class="demo-tag">prototype</span>
      </div>
      <div class="right">
        <div class="roleseg">
          <button data-role="MO" class="on" onclick="setRole('MO')">Middle Office</button>
          <button data-role="FO" onclick="setRole('FO')">Front Office</button>
        </div>
        <div class="logo">Mondelēz <small>International</small></div>
      </div>
    </div>
    <div class="offline-banner">● Offline — showing the last loaded data. Changes are saved locally and sync when you reconnect.</div>
    <div class="body" id="screen"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>
<div id="toast"></div>
<div id="loading"><div class="card"><span class="spin"></span> Loading data…</div></div>
<div id="confirm"><div class="cf-card">
  <div class="cf-title"><span class="ic" id="cfIcon"></span><span id="cfTitle"></span></div>
  <div class="cf-msg" id="cfMsg"></div>
  <div class="cf-actions"><button class="btn btn-ghost" onclick="hideConfirm()">Cancel — keep reviewing</button><button class="btn btn-blue" id="cfOk"></button></div>
</div></div>

<script>

  fx3:["Request FO explanation","Reported in export","Not compared","Other"],

  mm4:["Late booking","Credit line","System delay","Other"],

function nowLabel(){const d=new Date();return ("0"+d.getDate()).slice(-2)+" Feb "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
// ===== master listing columns (source schema from SAP) =====
const FX_COLS=[
 {k:"companyCode",l:"Company Code"},{k:"transaction",l:"Transaction"},{k:"businessPartner",l:"Business Partner"},
 {k:"productType",l:"Product Type"},{k:"productTypeName",l:"Product type name"},{k:"transactionType",l:"Transaction Type"},
 {k:"transactionTypeName",l:"Name of Transaction Type"},{k:"buySell",l:"Buy/Sell Indicator"},{k:"valueDate",l:"Value Date"},
 {k:"expirationDate",l:"Expiration Date"},{k:"tradedCurrency",l:"Traded Currency"},{k:"paymentAmount",l:"Payment Amount in Payment Currency",a:"right"},

 {k:"releaseStatus",l:"Release Status"},{k:"activeActivity",l:"Active activity"},{k:"marketSpotRate",l:"Market spot rate",a:"right"},
];
const MM_COLS=[
 {k:"companyCode",l:"Company Code"},{k:"transaction",l:"Transaction"},{k:"productType",l:"Product Type"},{k:"companyName",l:"Company Name"},

function checkStatus(chk){
  if(chk.findings.length===0) return "Completed";
  if(chk.completed) return "Completed";
  // only findings that have actually been SENT to FO and not yet answered are "Awaiting FO".
  // flagged-but-not-sent stay with MO (MO still has to send them).
  if(chk.findings.some(x=>x.fo.flagged && x.fo.sent && !x.fo.responded)) return "Awaiting FO review";
  return "Awaiting MO review";
}
function canComplete(chk){
  if(chk.findings.length===0||chk.completed) return false;
  if(chk.findings.some(x=>x.fo.flagged && !x.fo.responded)) return false; // flagged (sent or not) must be answered first
  return chk.findings.every(x=>x.mo.reason);
}
function reportStatus(rep){
  // Overall (report) status is only In review / Completed.
  // Awaiting MO / FO review live at the individual check level.
  return rep.submitted ? "Completed" : "In review";

function renderChecks(){
  const rep=curDay().reports[App.report];
  const rst=reportStatus(rep);
  const F=App.filters.checks;
  const shown=rep.checks.filter(chk=> (F.q===""||contains(chk.n,F.q)||contains(chk.scope,F.q)) && (F.status==="All statuses"||checkStatus(chk)===F.status));
  let rows="";
  shown.forEach(chk=>{const st=checkStatus(chk),fc=chk.findings.length;
    let result,rc;
    if(chk.notCompared){result="Not compared";rc="amber";}
    else if(fc===0){result="No finding";rc="green";}
    else if(chk.id==="fx5"||chk.id==="mm4"){result="Late";rc="amber";}
    else if(chk.id==="fx6"){result="Exceptional";rc="red";}
    else {result="Finding";rc="red";}
    const bg=chk.notCompared?'background:#fdf6e9':(fc===0?'':(rc==="amber"?'background:#fdf6e9':'background:#fbecec'));
    rows+='<tr class="click" style="'+bg+'" onclick="App.go(\'detail\',{check:\''+chk.id+'\'})">'+
      '<td>'+chk.n+'</td><td style="color:var(--muted)">'+chk.scope+'</td>'+
      '<td><span class="r-'+rc+'"><span class="dotr">●</span>'+result+'</span></td>'+
      '<td style="text-align:center;color:'+(fc?'var(--'+rc+')':'var(--muted)')+'">'+fc+'</td>'+
      '<td><span class="r-'+statusColor(st)+'">'+st+'</span></td>'+
      '<td style="text-align:right;color:var(--faint)">'+I.chevR+'</td></tr>';
  });
  const allDone=rep.checks.every(c=>checkStatus(c)==="Completed");
  const steps=[{lab:"In review",on:true},{lab:"Completed",on:rep.submitted}];
  // counts across the whole report
  let toSend=0, awaiting=0, replied=0;
  rep.checks.forEach(c=>c.findings.forEach(fd=>{
    if(fd.fo.flagged && !fd.fo.sent && !fd.fo.responded) toSend++;
    else if(fd.fo.flagged && fd.fo.sent && !fd.fo.responded) awaiting++;
    else if(fd.fo.flagged && fd.fo.responded) replied++;
  }));
  const foLine = (toSend||awaiting||replied)
    ? '<p class="muted-note">FO routing: <b>'+toSend+'</b> flagged and ready to send \u00b7 <b>'+awaiting+'</b> awaiting FO \u00b7 <b>'+replied+'</b> replied. Flagged findings are grouped per reviewer and sent in one email each.</p>'

function submitReport(){const rep=curDay().reports[App.report];if(!rep.checks.every(c=>checkStatus(c)==="Completed"))return;rep.submitted=true;App.dirty.clear();logAudit('Report submitted — '+rep.name);toast(rep.name+' submitted');render();}

function findCheck(id){const d=curDay();for(const k of ["fx","mm"]){const r=d.reports[k];const c=r&&r.checks.find(x=>x.id===id);if(c)return{rep:r,chk:c};}}

    '<span class="spacer"></span><span class="muted-note" style="margin:0">'+cols.length+' of '+COLMAP[listOf(chk)].length+' cols</span></div>';
  const noBody=body===""?'<p class="muted-note">No transactions match your filter.</p>':'';
  document.getElementById("screen").innerHTML=

    '<div class="tbl-wrap"><table class="findtbl">'+head+'<tbody>'+body+'</tbody></table></div>'+noBody+note+

// read-only transaction table with a per-card "Show all columns" toggle — used in FO inbox + MO queue

function inboxItems(){const out=[];const day=DAYS[0];["fx","mm"].forEach(k=>{const rep=day.reports[k];rep.checks.forEach(chk=>{chk.findings.forEach((fd,i)=>{if(fd.fo.flagged&&fd.fo.sent)out.push({repName:rep.name,chk,idx:i,fd});});});});return out;}
function renderInbox(){
  const total=inboxItems();

    document.getElementById("screen").innerHTML='<div class="empty"><div class="ic">'+I.check+'</div><h3>Nothing to respond to</h3><p>No findings have been flagged to Front Office for 16 Feb 2026.</p></div>';
    document.getElementById("foot").innerHTML='<div class="left">'+I.info+' Front Office view — you only see items MO flagged to you.</div><div class="right"></div>';return;
  }
  const Q=App.filters.inbox.q;
  const items=Q?total.filter(x=>contains(txnNo(x.fd),Q)):total;
  const pending=items.filter(x=>!x.fd.fo.responded), done=items.filter(x=>x.fd.fo.responded);
  // queue-wide truth (ignores the search box) drives the header count and the screen-level send button
  const allPending=total.filter(x=>!x.fd.fo.responded), allDone=total.filter(x=>x.fd.fo.responded);
  const readyCount=allPending.filter(x=>x.fd.fo.reason).length;
  const tools='<div class="toolbar">'+searchBox("inbox","q","Search transaction no…","srch-inbox")+
    '<span class="spacer"></span></div>';
  // screen-level batched send (mirrors MO My Queue "Send flagged to FO"): one response batch → MO gets one notification
  const sendBtn = allPending.length
    ? (readyCount>0
        ? '<button class="btn btn-blue" onclick="askSendFOResponses()">'+I.send+' Send response'+(readyCount>1?'s':'')+' to MO ('+readyCount+')</button>'
        : '<button class="btn" disabled title="Choose a reason on at least one finding first">'+I.send+' Send response to MO</button>')
    : '';
  let html='<div class="help">'+I.info+' You are in the <b>Front Office</b> view. These are the findings Middle Office flagged to you via deeplink. Add your reason and comment on each, then send all your responses back to MO in one batch.</div>'+tools+
    '<div class="inbox-head"><span class="eyebrow" style="margin:0">ITEMS AWAITING YOUR RESPONSE <span class="cnt" style="font-weight:400;margin-left:8px">'+allPending.length+' pending · '+allDone.length+' responded</span></span>'+sendBtn+'</div>';
  const card=(it)=>{
    const fd=it.fd, ck=it.chk, resp=fd.fo.responded, txn=txnNo(fd);
    const opts=FO_REASONS.map(o=>'<option'+(o===fd.fo.reason?' selected':'')+'>'+o+'</option>').join("");
    const resentNote=(!resp && fd.fo.replies.length>0)?'<span class="badge" style="background:#fbe7d8;color:var(--orange);margin-left:8px">MO asked again</span>':'';
    const respArea = resp
      ? ''
      : '<div class="resp"><div class="fld"><label>Your reason</label><select class="sel fo-inp" onchange="setFO(\''+ck.id+'\','+it.idx+',\'reason\',this.value)"><option value="">— choose —</option>'+opts+'</select></div>'+
        '<div class="fld"><label>Your '+(fd.fo.replies.length>0?'new ':'')+'comment</label><input class="inp fo-inp" value="'+esc(fd.fo.comment)+'" placeholder="explain or confirm…" oninput="setFO(\''+ck.id+'\','+it.idx+',\'comment\',this.value)"></div>'+
        '<div style="display:flex;gap:7px;align-items:center"><span class="ico-btn" onclick="toast(\'Evidence attached\')">'+I.clip+' Attach</span></div></div>';
    return '<div class="fcard'+(resp?' done':'')+'"><div class="top"><div class="where">'+it.repName+' · '+ck.n+' <span>· '+ck.scope+'</span><br><span class="mono" style="font-size:11px">'+txn+'</span></div>'+
      (resp?'<span class="badge b-green">Responded</span>':'<span class="badge b-amber">Awaiting you</span>')+resentNote+'</div>'+
      '<div class="ask"><span class="deeplink">'+I.link+' Opened from email deeplink</span> &nbsp; <b>MO ⇄ FO conversation</b> '+moReasonBadge(fd)+'</div>'+
      recTableHtml(ck,fd,itKey(it))+

  if(done.length) html+='<p class="eyebrow" style="margin-top:18px">ALREADY RESPONDED</p>'+done.map(card).join("");
  if(items.length===0) html+='<p class="muted-note">No items match your search.</p>';

}
// FO batched send: every pending finding that has a reason is answered in one go, so MO gets one grouped notification.
function askSendFOResponses(){
  const ready=inboxItems().filter(x=>!x.fd.fo.responded && x.fd.fo.reason);
  if(ready.length===0){toast("Choose a reason on at least one finding first");return;}
  const remaining=inboxItems().filter(x=>!x.fd.fo.responded && !x.fd.fo.reason).length;
  const tail=remaining>0
    ? ' <b>'+remaining+'</b> finding'+(remaining>1?'s':'')+' still ha'+(remaining>1?'ve':'s')+' no reason and will <b>not</b> be sent yet.'
    : ' This covers every finding awaiting you.';
  showConfirm({
    title:"Send your responses to Middle Office?",
    msg:"You are about to send <b>"+ready.length+"</b> response"+(ready.length>1?"s":"")+" back to MO in one batch."+tail+
        " Please make sure you have reviewed <b>all</b> the findings above — MO gets a single grouped notification, so answering everything before sending avoids spamming them.",
    okLabel:I.send+" Yes, send to MO",
    onOk:sendFOResponses
  });
}
function sendFOResponses(){
  const ready=inboxItems().filter(x=>!x.fd.fo.responded && x.fd.fo.reason);
  if(ready.length===0){toast("Choose a reason on at least one finding first");return;}
  ready.forEach(x=>{const fd=x.fd;fd.fo.replies.push({reason:fd.fo.reason,comment:fd.fo.comment,at:nowLabel()});fd.fo.responded=true;logAudit("FO replied on "+txnNo(fd)+" ("+fd.fo.reason+")");});
  toast("Sent "+ready.length+" response"+(ready.length>1?"s":"")+" to MO");
  renderInbox();
}
// renders the full FO reply history (newest last), keeping previous replies visible
function foRepliesHtml(fd){
  if(!fd.fo.replies||fd.fo.replies.length===0) return '';
  return fd.fo.replies.map((r,i)=>'<div style="background:#f3f8f3;border:1px solid #cfe3cf;border-radius:7px;padding:8px 10px;margin-bottom:6px"><div style="font-size:10px;color:var(--green);margin-bottom:2px">FO reply '+(fd.fo.replies.length>1?'#'+(i+1)+' ':'')+'\u00b7 '+r.at+(r.reason?' \u00b7 '+r.reason:'')+'</div><div style="font-size:11.5px;color:var(--ink)">'+(r.comment||'\u2014')+'</div></div>').join("");
}
// MO ask bubble (purple) + FO reply bubble (green), interleaved into one conversation thread
function askBubble(a,i,n){return '<div style="background:#f4eef6;border:1px solid #e2d3ea;border-radius:7px;padding:8px 10px;margin-bottom:6px"><div style="font-size:10px;color:var(--purple);margin-bottom:2px">MO ask '+(n>1?'#'+(i+1)+' ':'')+'\u00b7 '+a.at+(a.reason?' \u00b7 '+a.reason:'')+'</div><div style="font-size:11.5px;color:var(--ink)">'+(a.comment||'\u2014')+'</div></div>';}
function replyBubble(r,i,n){return '<div style="background:#f3f8f3;border:1px solid #cfe3cf;border-radius:7px;padding:8px 10px;margin-bottom:6px"><div style="font-size:10px;color:var(--green);margin-bottom:2px">FO reply '+(n>1?'#'+(i+1)+' ':'')+'\u00b7 '+r.at+(r.reason?' \u00b7 '+r.reason:'')+'</div><div style="font-size:11.5px;color:var(--ink)">'+(r.comment||'\u2014')+'</div></div>';}
function conversationHtml(fd){
  const asks=fd.mo.asks||[], reps=fd.fo.replies||[], n=Math.max(asks.length,reps.length);
  if(n===0) return '';
  let h='';
  for(let i=0;i<n;i++){ if(asks[i])h+=askBubble(asks[i],i,asks.length); if(reps[i])h+=replyBubble(reps[i],i,reps.length); }
  return '<div class="thread" style="margin:8px 0">'+h+'</div>';
}

// ===== MO MY QUEUE — review, send to FO, and act on replies in one place =====
function moQueueItems(){const out=[];DAYS.forEach(day=>{["fx","mm"].forEach(k=>{const rep=day.reports[k];if(!rep)return;rep.checks.forEach(chk=>{if(chk.completed)return;chk.findings.forEach((fd,i)=>{if(fd.fo.flagged&&fd.fo.sent)out.push({repName:rep.name,date:day.date,dayIndex:DAYS.indexOf(day),chk,idx:i,fd});});});});});return out;}
// step 2: MO worklist — current-day findings not yet sent to FO (analyse + flag + batch-send from here)
function toReviewItems(){const out=[];const day=DAYS[0];["fx","mm"].forEach(k=>{const rep=day.reports[k];if(!rep)return;rep.checks.forEach(chk=>{if(chk.completed)return;chk.findings.forEach((fd,i)=>{if(!fd.fo.sent)out.push({repName:rep.name,date:day.date,dayIndex:0,chk,idx:i,fd});});});});return out;}
// confirm-then-send: warn MO to review every finding before the batch goes out (reviewers get one notification each)
function askSendFOQueue(){
  const day=DAYS[0];const toSend=[];
  ["fx","mm"].forEach(k=>{const rep=day.reports[k];if(!rep)return;rep.checks.forEach(c=>{if(c.completed)return;c.findings.forEach(fd=>{if(fd.fo.flagged&&!fd.fo.sent)toSend.push(fd);});});});
  if(toSend.length===0){toast("No flagged findings to send");return;}
  const missing=toSend.filter(fd=>(fd.mo.reason==="Request FO explanation"||fd.mo.reason==="Other")&&!fd.mo.comment);
  if(missing.length>0){toast("Add a comment for "+cellText(missing[0].rec.transaction)+" before sending to FO");return;}
  const byRev={};toSend.forEach(fd=>{const r=fd.fo.reviewer||"fo@mdlz.com";byRev[r]=(byRev[r]||0)+1;});
  const m=Object.keys(byRev).length;
  showConfirm({
    title:"Send flagged findings to Front Office?",
    msg:"This notifies <b>"+m+"</b> FO reviewer"+(m>1?"s":"")+" with <b>"+toSend.length+"</b> flagged finding"+(toSend.length>1?"s":"")+", grouped into <b>"+m+"</b> email"+(m>1?"s":"")+" (one per reviewer). Please make sure you have reviewed <b>all</b> findings first — each reviewer gets a single notification, so sending them together avoids spamming them.",
    okLabel:I.send+" Yes, send to FO",
    onOk:sendFOQueue
  });
}
// batched send from the queue — same semantics as Check Analysis (group per reviewer, one email each)
function sendFOQueue(){
  const day=DAYS[0];const toSend=[];
  ["fx","mm"].forEach(k=>{const rep=day.reports[k];if(!rep)return;rep.checks.forEach(c=>{if(c.completed)return;c.findings.forEach(fd=>{if(fd.fo.flagged&&!fd.fo.sent)toSend.push(fd);});});});
  if(toSend.length===0){toast("No flagged findings to send");return;}
  const missing=toSend.filter(fd=>(fd.mo.reason==="Request FO explanation"||fd.mo.reason==="Other")&&!fd.mo.comment);
  if(missing.length>0){toast("Add a comment for "+cellText(missing[0].rec.transaction)+" before sending to FO");return;}
  const byRev={};
  toSend.forEach(fd=>{fd.fo.sent=true;fd.fo.sentOn=nowLabel();fd.mo.asks.push({reason:fd.mo.reason,comment:fd.mo.comment,at:nowLabel()});const r=fd.fo.reviewer||"fo@mdlz.com";byRev[r]=(byRev[r]||0)+1;});
  const m=Object.keys(byRev).length;
  logAudit("Sent "+toSend.length+" finding"+(toSend.length>1?"s":"")+" to FO from My Queue");
  toast("Sent "+toSend.length+" finding"+(toSend.length>1?"s":"")+" to "+m+" FO reviewer"+(m>1?"s":"")+" · "+m+" grouped email"+(m>1?"s":""));
  render();
}
function renderMoQueue(){
  const sent=moQueueItems(), review=toReviewItems();
  if(sent.length===0 && review.length===0){
    document.getElementById("screen").innerHTML='<div class="empty"><div class="ic">'+I.check+'</div><h3>Your queue is clear</h3><p>Nothing to review and nothing out with Front Office.</p></div>';
    document.getElementById("foot").innerHTML='<div class="left">'+I.info+' Middle Office queue — analyse findings, send to FO, and act on replies in one place.</div><div class="right"><button class="btn btn-orange" onclick="App.back()">Back</button></div>';return;
  }
  const Q=App.filters.queue.q;
  const match=x=>!Q||contains(txnNo(x.fd),Q)||contains(x.fd.fo.reviewer||"",Q)||contains(x.fd.mo.reason||"",Q);
  const rev=review.filter(match), sentF=sent.filter(match);
  const replied=sentF.filter(x=>x.fd.fo.responded), awaiting=sentF.filter(x=>!x.fd.fo.responded);
  const flaggedNotSent=review.filter(x=>x.fd.fo.flagged).length;
  const tools='<div class="toolbar">'+searchBox("queue","q","Search transaction, reviewer or reason…","srch-queue")+'<span class="spacer"></span></div>';
  let html='<div class="help">'+I.info+' Your <b>Middle Office queue</b> — analyse findings, flag &amp; send them to Front Office, and act on replies, without opening each check. The per-check flow on Check Analysis still works too.</div>'+tools;

  // section 1 - TO REVIEW / NOT SENT YET: full MO controls + one batched send (like Check Analysis)
  const reviewCard=(it)=>{
    const fd=it.fd, ck=it.chk, key=itKey(it), flagged=fd.fo.flagged;
    const opts=REASONS[ck.id].map(o=>'<option'+(o===fd.mo.reason?' selected':'')+'>'+o+'</option>').join("");
    const selGreen=(fd.mo.reason==="Hedge rate"||fd.mo.reason==="Credit line")?' green':'';
    return '<div class="fcard"><div class="top"><div class="where">'+it.repName+' · '+ck.n+' <span>· '+ck.scope+'</span><br><span class="mono" style="font-size:11px">'+txnNo(fd)+'</span></div>'+
      (flagged?'<span class="badge b-amber">Flagged to FO</span>':'<span class="badge" style="background:#eef0f2;color:var(--muted)">Not flagged</span>')+'</div>'+
      recTableHtml(ck,fd,key)+
      '<div class="resp" style="grid-template-columns:190px 1fr auto;align-items:end">'+
        '<div class="fld"><label>MO reason</label><select class="sel'+selGreen+'" onchange="setMO(\''+ck.id+'\','+it.idx+',\'reason\',this.value)"><option value="">— choose —</option>'+opts+'</select></div>'+
        '<div class="fld"><label>MO comment</label><input class="inp" value="'+esc(fd.mo.comment)+'" placeholder="comment for FO…" oninput="setMO(\''+ck.id+'\','+it.idx+',\'comment\',this.value)"></div>'+
        '<div style="display:flex;gap:10px;align-items:center">'+
          '<label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)"><input type="checkbox" class="chk" '+(flagged?'checked':'')+' onchange="toggleFO(\''+ck.id+'\','+it.idx+',this.checked)"> Flag to FO</label>'+
          '<button class="btn btn-ghost" onclick="openCheckFromQueue(\''+ck.id+'\',0)">Open check</button>'+
          (canComplete(ck)
            ? '<button class="btn btn-green" onclick="completeCheckQ(\''+ck.id+'\',0)">'+I.check+' Complete check</button>'
            : '<button class="btn" disabled title="Set an MO reason on every finding of this check (and resolve or answer any flagged item) first">'+I.check+' Complete check</button>')+
        '</div>'+
      '</div></div>';
  };
  if(rev.length){
    const sendBtn=flaggedNotSent>0?'<button class="btn btn-blue" onclick="askSendFOQueue()">'+I.send+' Send flagged to FO ('+flaggedNotSent+')</button>':'<button class="btn" disabled>'+I.send+' Send flagged to FO</button>';
    html+='<div class="inbox-head"><span class="eyebrow" style="margin:0">TO REVIEW — NOT SENT YET</span>'+sendBtn+'</div>'+rev.map(reviewCard).join("");
  }

  // sections 2 & 3 - REPLIED / STILL WITH FO: read + conversation thread + resend(-with-append) / nudge
  const sentCard=(it)=>{
    const fd=it.fd, ck=it.chk, key=itKey(it), resp=fd.fo.responded, who=fd.fo.reviewer?fd.fo.reviewer.split("@")[0]:'FO';
    const dayTag='<span style="font-size:10px;color:var(--faint)"> · '+it.date+'</span>';
    let actions;
    if(resp){
      const ropts=REASONS[ck.id].map(o=>'<option'+(o===fd.mo.reason?' selected':'')+'>'+o+'</option>').join("");
      actions='<div class="resp" style="grid-template-columns:190px 1fr auto;align-items:end;margin-top:6px">'+
        '<div class="fld"><label>MO reason (optional change)</label><select id="rr-'+key+'" class="sel">'+ropts+'</select></div>'+
        '<div class="fld"><label>New comment to FO (required to resend)</label><input id="rc-'+key+'" class="inp" placeholder="why the reply is not enough…"></div>'+
        '<div style="display:flex;gap:7px;align-items:center">'+
          (canComplete(ck)?'<button class="btn btn-green" onclick="completeCheckQ(\''+ck.id+'\','+it.dayIndex+')">'+I.check+' Complete</button>':'')+
          '<button class="btn btn-orange" onclick="resendFO(\''+ck.id+'\','+it.idx+','+it.dayIndex+',\''+key+'\')">'+I.send+' Resend</button>'+
          '<button class="btn btn-ghost" onclick="openCheckFromQueue(\''+ck.id+'\','+it.dayIndex+')">Open check</button>'+
        '</div></div>';
    } else {
      actions='<div class="resp" style="grid-template-columns:1fr auto"><div class="fld"><label>Status</label><div class="inp" style="background:#eef4fb;border-color:#cfe0f2;color:var(--blue)">Awaiting reply from '+who+'</div></div><div style="display:flex;gap:7px;align-items:center"><button class="btn btn-orange" onclick="resendFO(\''+ck.id+'\','+it.idx+','+it.dayIndex+')">'+I.send+' Nudge FO</button><button class="btn btn-ghost" onclick="openCheckFromQueue(\''+ck.id+'\','+it.dayIndex+')">Open check</button></div></div>';
    }
    return '<div class="fcard'+(resp?'':' done')+'"><div class="top"><div class="where">'+it.repName+' · '+ck.n+dayTag+' <span>· '+ck.scope+'</span><br><span class="mono" style="font-size:11px">'+txnNo(fd)+'</span></div>'+
      (resp?'<span class="badge b-green">FO replied</span>':'<span class="badge b-blue" style="background:#e3eefb;color:var(--blue)">Awaiting FO</span>')+'</div>'+
      recTableHtml(ck,fd,key)+
      conversationHtml(fd)+
      actions+'</div>';
  };
  if(replied.length) html+='<p class="eyebrow" style="margin-top:18px">REPLIED — READY FOR YOU</p>'+replied.map(sentCard).join("");
  if(awaiting.length) html+='<p class="eyebrow" style="margin-top:18px">STILL WITH FRONT OFFICE</p>'+awaiting.map(sentCard).join("");
  if(rev.length===0 && replied.length===0 && awaiting.length===0) html+='<p class="muted-note">No items match your search.</p>';
  document.getElementById("screen").innerHTML=html;
  document.getElementById("foot").innerHTML='<div class="left">'+I.info+' Middle Office queue — analyse, send to FO, and act on replies in one place.</div><div class="right"><button class="btn btn-orange" onclick="App.back()">Back</button></div>';
}
const MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function pd(s){const m=s.split(" ");return new Date(+m[2],MON[m[1]],+m[0]);}
function daysLate(e,c){return Math.round((pd(e)-pd(c))/86400000);}
function topRows(){const rows=[];DAYS.forEach(day=>{["fx","mm"].forEach(k=>{const rep=day.reports[k];if(!rep)return;const isMM=k==="mm";rep.checks.forEach(chk=>{if(!chk.isLate)return;chk.findings.forEach(fd=>{const ent=cellText(fd.rec.enteredOn),con=cellText(fd.rec.contractDate);rows.push({date:day.date,report:rep.name,txn:cellText(fd.rec.transaction),pt:cellText(fd.rec.productType),entered:ent,contract:con,amount:cellText(isMM?fd.rec.amountStart:fd.rec.paymentAmount),late:daysLate(ent,con),reason:fd.mo.reason||"—"});});});});});return rows;}
function renderTop(){
  const T=App.filters.top;
  let rows=topRows();const total=rows.length;
  rows=rows.filter(r=>T.q===""||contains(r.txn,T.q)||contains(r.reason,T.q));
  const amt=r=>parseFloat((""+r.amount).replace(/[^0-9.]/g,""))||0, dt=r=>pd(r.date).getTime();
  rows.sort((a,b)=> T.sort==="Amount"?amt(b)-amt(a) : T.sort==="Date"?dt(b)-dt(a) : b.late-a.late);
  let body=rows.map(r=>'<tr><td style="color:var(--muted)">'+r.date+'</td><td>'+r.report+'</td><td class="mono">'+r.txn+'</td><td>'+r.pt+'</td><td>'+r.entered+'</td><td>'+r.contract+'</td><td style="text-align:center"><span class="r-amber">'+r.late+'</span></td><td style="text-align:right">'+r.amount+'</td><td>'+r.reason+'</td></tr>').join("");
  const tools='<div class="toolbar">'+searchBox("top","q","Search transaction / reason…","srch-top")+
    '<label class="slab">Sort by</label>'+selBox("top","sort",["Days late","Amount","Date"])+
    '<span class="spacer"></span><span class="count">'+rows.length+' / '+total+' late entries</span></div>';
  const noRows=rows.length===0?'<p class="muted-note">No entries match your filter.</p>':'';
  document.getElementById("screen").innerHTML=
    '<p class="topnote">'+I.info+'<span>Only late entries flow to the monthly TOP report — Entered on later than Contract date — together with the MO reason. This is the source for the monthly Power BI.</span></p>'+tools+
    '<div class="tbl-wrap"><table><thead class="simple"><tr><th>Date</th><th>Report</th><th>Transaction</th><th>PT</th><th>Entered on</th><th>Contract date</th><th style="text-align:center">Days late</th><th style="text-align:right">Amount</th><th>Reason</th></tr></thead><tbody>'+body+'</tbody></table></div>'+noRows+
    '<p class="muted-note">'+total+' late entries across '+DAYS.length+' days.</p>';
  document.getElementById("foot").innerHTML='<div class="left"></div><div class="right"><button class="btn btn-orange" onclick="App.back()">Back</button><button class="btn btn-blue" onclick="toast(\'Exported to Power BI\')">'+I.chart+' Send to Power BI</button></div>';
}

function setMO(id,i,field,val){
  const{chk}=findCheck(id);const fd=chk.findings[i];fd.mo[field]=val;markDirty(id,i);
  if(field==="reason"){
    // (1) "Request FO explanation" auto-flags the row to FO
    if(val==="Request FO explanation" && !fd.fo.flagged){fd.fo.flagged=true; if(!fd.fo.reviewer)fd.fo.reviewer=foDefault(chk.id);}
    if(App.screen==="detail") renderDetail(); else render();
  } else if(App.screen==="detail") footDetail(chk,checkStatus(chk)); // comment: data only elsewhere (keep input focus)
}
function setFO(id,i,field,val){const{chk}=findCheck(id);chk.findings[i].fo[field]=val;
  // reason is committed via a <select> (no focus to lose) → refresh so the queue count + Send button stay live
  if(field==="reason" && App.role==="FO" && App.screen==="inbox") renderInbox();}
function toggleFO(id,i,on){const{chk}=findCheck(id);const fd=chk.findings[i];fd.fo.flagged=on;markDirty(id,i);if(on){if(!fd.fo.reviewer)fd.fo.reviewer=foDefault(chk.id);}else{fd.fo.sent=false;fd.fo.responded=false;fd.fo.reason="";fd.fo.comment="";}if(App.screen==="detail") renderDetail(); else render();}
// confirm-then-send for the Check Analysis screen (same review-all warning as My Queue)
function askSendFOReport(){
  const rep=curDay().reports[App.report];const toSend=[];
  rep.checks.forEach(c=>c.findings.forEach(fd=>{if(fd.fo.flagged && !fd.fo.sent && !fd.fo.responded)toSend.push(fd);}));
  if(toSend.length===0){toast("No new flagged findings to send");return;}
  const missing=toSend.filter(fd=>(fd.mo.reason==="Request FO explanation"||fd.mo.reason==="Other") && !fd.mo.comment);
  if(missing.length>0){toast("Add a comment for "+txnNo(missing[0])+" before sending to FO");return;}
  const byRev={};toSend.forEach(fd=>{const r=fd.fo.reviewer||foDefault(App.report);byRev[r]=(byRev[r]||0)+1;});
  const m=Object.keys(byRev).length;
  showConfirm({
    title:"Send flagged findings to Front Office?",
    msg:"This notifies <b>"+m+"</b> FO reviewer"+(m>1?"s":"")+" with <b>"+toSend.length+"</b> flagged finding"+(toSend.length>1?"s":"")+" from "+rep.name+", grouped into <b>"+m+"</b> email"+(m>1?"s":"")+" (one per reviewer). Please make sure you have reviewed <b>all</b> flagged rows first — each reviewer gets a single notification, so sending them together avoids spamming them.",
    okLabel:I.send+" Yes, send to FO",
    onOk:sendFOReport
  });
}
// (2) Report-level batch send: groups all flagged-not-sent findings per FO reviewer -> one email each
function sendFOReport(){
  const rep=curDay().reports[App.report];
  const toSend=[];
  rep.checks.forEach(c=>c.findings.forEach(fd=>{if(fd.fo.flagged && !fd.fo.sent && !fd.fo.responded)toSend.push(fd);}));
  if(toSend.length===0){toast("No new flagged findings to send");return;}
  // mandatory comment for "Request FO explanation" / "Other"
  const missing=toSend.filter(fd=>(fd.mo.reason==="Request FO explanation"||fd.mo.reason==="Other") && !fd.mo.comment);
  if(missing.length>0){toast("Add a comment for "+txnNo(missing[0])+" before sending to FO");return;}
  const byRev={};
  toSend.forEach(fd=>{fd.fo.sent=true; fd.fo.sentOn=nowLabel(); fd.mo.asks.push({reason:fd.mo.reason,comment:fd.mo.comment,at:nowLabel()}); const r=fd.fo.reviewer||foDefault(App.report); byRev[r]=(byRev[r]||0)+1;});
  const m=Object.keys(byRev).length;
  logAudit("Sent "+toSend.length+" finding"+(toSend.length>1?"s":"")+" to FO \u2014 "+rep.name);
  toast("Sent "+toSend.length+" finding"+(toSend.length>1?"s":"")+" to "+m+" FO reviewer"+(m>1?"s":"")+" \u00b7 "+m+" grouped email"+(m>1?"s":""));
  render();
}
function simFO(id,i){const{chk}=findCheck(id);const fd=chk.findings[i];if(!fd.fo.sent){toast("Send it to FO first");return;}fd.fo.reason=fd.fo.reason||"Corrected in SAP";fd.fo.comment=fd.fo.comment||"Checked and corrected in SAP today.";fd.fo.replies.push({reason:fd.fo.reason,comment:fd.fo.comment,at:nowLabel()});fd.fo.responded=true;toast("FO replied — review and complete");renderDetail();}
function completeCheck(id){const{chk}=findCheck(id);if(!canComplete(chk))return;chk.completed=true;App.dirty.clear();logAudit("Check completed — "+chk.scope);toast(chk.n+" completed");App.go("checks");}
function completeCheckQ(id,di){if(di!==undefined)App.dayIndex=di;const{chk}=findCheck(id);if(!canComplete(chk))return;chk.completed=true;logAudit("Check completed — "+chk.scope);toast(chk.n+" completed");renderMoQueue();}
function openCheckFromQueue(id,di){App.dayIndex=di!==undefined?di:0;App.report=id.startsWith("mm")?"mm":"fx";App.go("detail",{check:id});}
// Resend to FO.
//  - never replied yet (a nudge): just re-notify, no new ask.
//  - replied (MO not satisfied): require a NEW MO comment -> append to the MO ask thread, reopen for FO.
// key (My Queue card) reads the inline reason/comment inputs; without it (check detail) the row's MO comment is used.
function resendFO(id,i,di,key){
  if(di!==undefined)App.dayIndex=di;
  const{chk}=findCheck(id);const fd=chk.findings[i];const who=fd.fo.reviewer?fd.fo.reviewer.split("@")[0]:"FO";
  const rerender=()=>{ if(App.screen==="moqueue")renderMoQueue(); else if(App.screen==="detail")renderDetail(); else render(); };
  if((fd.fo.replies||[]).length===0){ // nudge \u2014 FO has not replied yet
    fd.fo.sentOn=nowLabel(); logAudit("Re-notified "+who+" \u2014 "+txnNo(fd)); toast("Re-notified "+who); rerender(); return;
  }
  // replied -> new comment required, appended to the thread
  const rcEl=key?document.getElementById("rc-"+key):null, rrEl=key?document.getElementById("rr-"+key):null;
  const newC=(rcEl?rcEl.value:fd.mo.comment||"").trim();
  const newR=rrEl?rrEl.value:fd.mo.reason;
  const last=fd.mo.asks[fd.mo.asks.length-1];
  if(!newC){ toast("Add a new comment before resending"); return; }
  if(last && newC===last.comment){ toast("Comment must be new (different from your last ask)"); return; }
  fd.mo.reason=newR; fd.mo.comment=newC; markDirty(id,i);
  fd.mo.asks.push({reason:newR,comment:newC,at:nowLabel()});
  fd.fo.responded=false; fd.fo.reason=""; fd.fo.comment=""; fd.fo.sentOn=nowLabel();
  logAudit("Resent to "+who+" \u2014 "+txnNo(fd)+" (new MO comment)");
  toast("Resent to "+who+" \u00b7 new comment added to the thread");
  rerender();
}
function addAtt(id){const{chk}=findCheck(id);chk.att.push("evidence_"+(chk.att.length+1)+".xlsx");toast("Evidence attached");renderDetail();}
function rmAtt(id,i){const{chk}=findCheck(id);chk.att.splice(i,1);renderDetail();}

function render(){
  document.querySelectorAll('.roleseg button').forEach(b=>b.classList.toggle('on',b.dataset.role===App.role));
  const back=document.getElementById("backBtn"), ttl=document.getElementById("hdrTitle");
  if(App.role==="FO"){
    if(App.screen==="detail"){const{chk}=findCheck(App.check);ttl.textContent=(chk.id.startsWith("mm")?"MM ":"")+chk.n.toUpperCase()+" · "+chk.scope.toUpperCase();back.style.display="inline-flex";renderDetail();return;}
    ttl.textContent="TZ01 · FRONT OFFICE — MY QUEUE";back.style.display="none";renderInbox();return;
  }
  if(App.screen==="overview"){ttl.textContent="TZ01 DAILY TRANSACTION REVIEW";back.style.display="none";renderOverview();}
  else if(App.screen==="checks"){ttl.textContent="CHECK ANALYSIS: "+curDay().reports[App.report].name.toUpperCase();back.style.display="inline-flex";renderChecks();}
  else if(App.screen==="detail"){const{chk}=findCheck(App.check);ttl.textContent=(chk.id.startsWith("mm")?"MM ":"")+chk.n.toUpperCase()+" · "+chk.scope.toUpperCase();back.style.display="inline-flex";renderDetail();}
  else if(App.screen==="top"){ttl.textContent="MONTHLY TOP REPORT — LATE ENTRIES";back.style.display="inline-flex";renderTop();}
  else if(App.screen==="moqueue"){ttl.textContent="MIDDLE OFFICE — MY QUEUE";back.style.display="inline-flex";renderMoQueue();}
}
let toastT;function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200);}
showLoading(700);   // F: brief loading state on first paint
render();
</script>
