name: Power Apps Checker

# Runs the Power Platform Checker (the same static-analysis engine as the in-editor
# "App checker") against the TZ01 canvas app on every push. Uses the pac CLI directly
# (no marketplace actions) and prints the findings to the log + uploads the SARIF.
#
# SETUP: see TZ01/ci/SETUP.md — 4 repo secrets (PP_ENV_URL, PP_APP_ID, PP_CLIENT_SECRET, PP_TENANT_ID).

on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch:

env:
  MSAPP: TZ01/solution/src/CanvasApps/mdlz_tz01_ff1a2_DocumentUri.msapp
  GEO: UnitedStates

jobs:
  checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Power Platform CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Pack canvas app from source
        run: pac canvas pack --sources TZ01/src --msapp "$MSAPP" --overwrite

      - name: Pack solution
        run: |
          mkdir -p out
          pac solution pack --zipfile out/TZ01_CI.zip --folder TZ01/solution/src --packagetype Unmanaged

      - name: Authenticate (service principal)
        run: |
          pac auth create \
            --environment "${{ secrets.PP_ENV_URL }}" \
            --applicationId "${{ secrets.PP_APP_ID }}" \
            --clientSecret "${{ secrets.PP_CLIENT_SECRET }}" \
            --tenant "${{ secrets.PP_TENANT_ID }}"

      - name: Run Power Apps / Solution Checker
        run: pac solution check --path out/TZ01_CI.zip --geo "$GEO" --outputDirectory checkerout

      - name: Print checker findings to log
        if: always()
        run: |
          echo "=== checker output tree ==="
          ls -R checkerout || true
          for z in checkerout/*.zip; do [ -f "$z" ] && unzip -o "$z" -d checkerout/extracted >/dev/null || true; done
          echo "=== SARIF findings ([level] ruleId :: message :: location) ==="
          find checkerout -name "*.sarif" -print -exec sh -c 'jq -r ".runs[].results[]? | \"[\(.level)] \(.ruleId) :: \(.message.text) :: \(.locations[0].physicalLocation.artifactLocation.uri // \"\")\"" "$1" 2>/dev/null || cat "$1"' _ {} \; || true

      - name: Upload checker results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerapps-checker-results
          path: checkerout/**
          if-no-files-found: warn
