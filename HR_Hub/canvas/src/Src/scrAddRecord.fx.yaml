scrAddRecord As screen:
    Fill: =RGBA(245, 245, 245, 1)
    OnVisible: =Set(varNavTag, "recs")

    recRailA As rectangle:
        Fill: =RGBA(255, 255, 255, 1)
        Height: =Parent.Height
        Width: =220
        ZIndex: =1

    lblBrandA As label:
        Color: =RGBA(91, 95, 199, 1)
        FontWeight: =FontWeight.Bold
        PaddingLeft: =20
        Size: =15
        Text: ="HR Hub"
        Width: =200
        Y: =12
        ZIndex: =2

    galNavA As gallery.galleryVertical:
        Height: =Parent.Height - 64
        Items: =Filter(colNav, varRole <> "employee" || EmpVisible)
        ShowScrollbar: =false
        TemplatePadding: =0
        TemplateSize: =46
        Width: =220
        Y: =64
        ZIndex: =3

        lblNavItemA As label:
            Color: =If(ThisItem.Tag = varNavTag, RGBA(91, 95, 199, 1), RGBA(36, 36, 36, 1))
            Fill: =If(ThisItem.Tag = varNavTag, RGBA(237, 237, 237, 1), RGBA(0, 0, 0, 0))
            FontWeight: =If(ThisItem.Tag = varNavTag, FontWeight.Semibold, FontWeight.Normal)
            Height: =Parent.TemplateHeight
            OnSelect: =Switch(ThisItem.Tag, "home", Navigate(scrHome, ScreenTransition.None), "emps", Navigate(scrEmployees, ScreenTransition.None), "cat", Navigate(scrCatalog, ScreenTransition.None), "recs", Navigate(scrRecords, ScreenTransition.None), "my", Navigate(scrMyTrainings, ScreenTransition.None), Navigate(scrReports, ScreenTransition.None))
            PaddingLeft: =20
            Size: =12
            Text: =ThisItem.Icon & "  " & ThisItem.Title
            Width: =Parent.TemplateWidth
            ZIndex: =1

    lblBackA As label:
        Color: =RGBA(91, 95, 199, 1)
        Height: =28
        OnSelect: =Navigate(scrRecords, ScreenTransition.None)
        Size: =11
        Text: ="← Späť na záznamy"
        Width: =220
        X: =250
        Y: =12
        ZIndex: =4

    lblTitleA As label:
        FontWeight: =FontWeight.Bold
        Size: =20
        Text: =If(IsBlank(varEditRecord), "Nový záznam školenia", "Upraviť záznam školenia")
        Width: =600
        X: =250
        Y: =40
        ZIndex: =4

    lblEmpCapA As label:
        FontWeight: =FontWeight.Semibold
        Height: =24
        Size: =11
        Text: ="Zamestnanec"
        Width: =300
        X: =250
        Y: =92
        ZIndex: =4

    txtEmpSearchA As text:
        BorderColor: =RGBA(209, 209, 209, 1)
        Default: =If(IsBlank(varPickedEmp), "", varPickedEmp.FullName)
        DisplayMode: =If(IsBlank(varEditRecord), DisplayMode.Edit, DisplayMode.View)
        HintText: ="Začnite písať meno alebo osobné číslo…"
        Size: =11
        Width: =460
        X: =250
        Y: =118
        ZIndex: =4

    lblPickedA As label:
        Color: =RGBA(92, 92, 92, 1)
        Height: =24
        Size: =10
        Text: |-
            ="Vybraný: " & If(IsBlank(varPickedEmp), "—", varPickedEmp.FullName & " (" & varPickedEmp.EmployeeID & ")")
        Width: =460
        X: =250
        Y: =162
        ZIndex: =4

    lblTrCapA As label:
        FontWeight: =FontWeight.Semibold
        Height: =24
        Size: =11
        Text: ="Školenie"
        Width: =300
        X: =250
        Y: =196
        ZIndex: =4

    galTrainPickA As gallery.galleryVertical:
        BorderColor: =RGBA(209, 209, 209, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =170
        Items: =SortByColumns(colTrainingsCatalog, "TrainingName")
        TemplatePadding: =0
        TemplateSize: =34
        Width: =460
        X: =250
        Y: =222
        ZIndex: =4

        lblTrainPickA As label:
            Color: =If(varPickedTraining.ID = ThisItem.ID, RGBA(91, 95, 199, 1), RGBA(36, 36, 36, 1))
            Fill: =If(varPickedTraining.ID = ThisItem.ID, RGBA(237, 237, 237, 1), RGBA(255, 255, 255, 1))
            FontWeight: =If(varPickedTraining.ID = ThisItem.ID, FontWeight.Semibold, FontWeight.Normal)
            Height: =Parent.TemplateHeight
            OnSelect: =Set(varPickedTraining, ThisItem)
            PaddingLeft: =12
            Size: =10
            Text: =ThisItem.TrainingName & If(ThisItem.ValidityMonths > 0, " (platnosť " & ThisItem.ValidityMonths & " mes.)", "")
            Width: =Parent.TemplateWidth
            ZIndex: =1

    chkPlannedA As checkbox:
        Height: =36
        Size: =11
        Text: ="Naplánované školenie (budúci termín)"
        Width: =380
        X: =250
        Y: =404
        ZIndex: =4

    lblDateCapA As label:
        FontWeight: =FontWeight.Semibold
        Height: =24
        Size: =11
        Text: =If(chkPlannedA.Value, "Plánovaný termín (d.m.rrrr)", "Dátum absolvovania (d.m.rrrr)")
        Width: =320
        X: =250
        Y: =448
        ZIndex: =4

    txtDateA As text:
        BorderColor: =RGBA(209, 209, 209, 1)
        Default: =If(IsBlank(varEditRecord), Text(Today(), "d.m.yyyy"), Text(varEditRecord.CompletionDate, "d.m.yyyy"))
        Size: =11
        Width: =220
        X: =250
        Y: =474
        ZIndex: =4

    lblExpPrevA As label:
        Color: =RGBA(92, 92, 92, 1)
        Height: =26
        Size: =10
        Text: |-
            ="Platnosť do: " & If(IsBlank(varPickedTraining) || IsError(DateValue(txtDateA.Text)), "—", chkPlannedA.Value, "— (doplní sa po absolvovaní)", varPickedTraining.ValidityMonths = 0, "neobmedzená", Text(DateAdd(DateValue(txtDateA.Text), varPickedTraining.ValidityMonths, TimeUnit.Months), "d.m.yyyy"))
        Width: =460
        X: =490
        Y: =482
        ZIndex: =4

    lblNotesCapA As label:
        FontWeight: =FontWeight.Semibold
        Height: =24
        Size: =11
        Text: ="Poznámky"
        Width: =300
        X: =250
        Y: =524
        ZIndex: =4

    txtNotesA As text:
        BorderColor: =RGBA(209, 209, 209, 1)
        Default: =If(IsBlank(varEditRecord), "", varEditRecord.Notes)
        Height: =80
        Mode: =TextMode.MultiLine
        Size: =10
        Width: =460
        X: =250
        Y: =550
        ZIndex: =4

    btnCancelA As button:
        BorderColor: =RGBA(209, 209, 209, 1)
        BorderThickness: =1
        Color: =RGBA(36, 36, 36, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(237, 237, 237, 1)
        OnSelect: =Navigate(scrRecords, ScreenTransition.None)
        Size: =11
        Text: ="Zrušiť"
        Width: =120
        X: =440
        Y: =652
        ZIndex: =4

    btnSaveA As button:
        Fill: =RGBA(91, 95, 199, 1)
        FontWeight: =FontWeight.Semibold
        HoverFill: =RGBA(79, 82, 178, 1)
        OnSelect: |-
            =If(
                IsBlank(varPickedEmp) || IsBlank(varPickedTraining),
                Notify("Vyberte zamestnanca aj školenie.", NotificationType.Error, 2500),
                IsError(DateValue(txtDateA.Text)),
                Notify("Zadajte platný dátum v tvare d.m.rrrr.", NotificationType.Error, 2500),
                !chkPlannedA.Value && DateValue(txtDateA.Text) > Today(),
                Notify("Dátum absolvovania nemôže byť v budúcnosti. Označte voľbu Naplánované školenie.", NotificationType.Error, 3000),
                chkPlannedA.Value && DateValue(txtDateA.Text) <= Today(),
                Notify("Plánovaný termín musí byť v budúcnosti.", NotificationType.Error, 2500),
                With({d: DateValue(txtDateA.Text), v: varPickedTraining.ValidityMonths, pl: chkPlannedA.Value},
                    With({exp: If(pl || v = 0, Blank(), DateAdd(d, v, TimeUnit.Months))},
                        With({st: If(pl, "Planned", IsBlank(exp), "Valid", exp < Today(), "Expired", exp <= DateAdd(Today(), 30, TimeUnit.Days), "Expiring", "Valid")},
                            If(IsBlank(varEditRecord),
                                Collect(colRecords, {ID: Max(colRecords, ID) + 1, Emp: varPickedEmp.EmployeeID, Tr: varPickedTraining.ID, Off: 0, Pl: pl, Cert: "", Notes: txtNotesA.Text, EmployeeID: varPickedEmp.EmployeeID, EmployeeName: varPickedEmp.FullName, DepartmentCode: varPickedEmp.DepartmentCode, ManagerEmail: varPickedEmp.ManagerEmail, TrainingName: varPickedTraining.TrainingName, TrainingType: varPickedTraining.TrainingType, ValidityMonths: v, CompletionDate: d, ExpirationDate: exp, LiveStatus: st}); Collect(colAudit, {ID: Max(colAudit, ID) + 1, Action: "Create", EntityType: "TrainingRecord", EntityID: varPickedEmp.EmployeeID, ChangedBy: varCurrentUser.Email, ChangedOn: Now(), Details: "Pridaný záznam školenia '" & varPickedTraining.TrainingName & "' pre zamestnanca " & varPickedEmp.FullName & "."}),
                                Patch(colRecords, LookUp(colRecords, ID = varEditRecord.ID), {CompletionDate: d, ExpirationDate: exp, LiveStatus: st, Notes: txtNotesA.Text, Pl: pl}); Collect(colAudit, {ID: Max(colAudit, ID) + 1, Action: "Update", EntityType: "TrainingRecord", EntityID: varEditRecord.EmployeeID, ChangedBy: varCurrentUser.Email, ChangedOn: Now(), Details: "Upravený záznam školenia '" & varEditRecord.TrainingName & "' zamestnanca " & varEditRecord.EmployeeName & "."})
                            );
                            Notify("Záznam školenia bol uložený.", NotificationType.Success, 2000);
                            Navigate(scrRecords, ScreenTransition.None)
                        )
                    )
                )
            )
        Size: =11
        Text: =If(IsBlank(varEditRecord), "Uložiť záznam", "Uložiť zmeny")
        Width: =170
        X: =570
        Y: =652
        ZIndex: =4

    galEmpSugA As gallery.galleryVertical:
        BorderColor: =RGBA(209, 209, 209, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =150
        Items: =FirstN(Filter(colEmployees, Status = "Active" && (varRole <> "manager" || ManagerEmail = varCurrentUser.Email) && (StartsWith(FullName, txtEmpSearchA.Text) || StartsWith(EmployeeID, txtEmpSearchA.Text))), 4)
        ShowScrollbar: =false
        TemplatePadding: =0
        TemplateSize: =36
        Visible: =!IsBlank(txtEmpSearchA.Text) && (IsBlank(varPickedEmp) || txtEmpSearchA.Text <> varPickedEmp.FullName)
        Width: =460
        X: =250
        Y: =158
        ZIndex: =10

        lblEmpSugA As label:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.TemplateHeight
            OnSelect: =Set(varPickedEmp, ThisItem); Reset(txtEmpSearchA)
            PaddingLeft: =12
            Size: =10
            Text: =ThisItem.FullName & "  (" & ThisItem.EmployeeID & ")"
            Width: =Parent.TemplateWidth
            ZIndex: =1

