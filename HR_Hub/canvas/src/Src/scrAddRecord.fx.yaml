scrAddRecord As screen:
    Fill: =RGBA(243, 243, 243, 1)
    OnVisible: =Set(varNavTag, "recs")

    frameAddRecord As groupContainer.horizontalAutoLayoutContainer:
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        Width: =Parent.Width
        ZIndex: =1

        navRailAddRecord As groupContainer.verticalAutoLayoutContainer:
            BorderColor: =RGBA(225, 225, 225, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FillPortions: =0
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =4
            PaddingBottom: =12
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =12
            Width: =220
            ZIndex: =1

            navBrandAddRecord As label:
                Color: =RGBA(91, 95, 199, 1)
                FontWeight: =FontWeight.Bold
                Height: =44
                PaddingLeft: =12
                Size: =16
                Text: ="HR Hub"
                ZIndex: =1

            navGalAddRecord As gallery.galleryVertical:
                Items: =Filter(colNav, varRole <> "employee" || EmpVisible)
                Layout: =Layout.Vertical
                ShowScrollbar: =false
                TemplatePadding: =0
                TemplateSize: =46
                ZIndex: =2

                navItemAddRecord As label:
                    Color: =If(ThisItem.Tag = varNavTag, RGBA(91, 95, 199, 1), RGBA(36, 36, 36, 1))
                    Fill: =If(ThisItem.Tag = varNavTag, RGBA(237, 237, 237, 1), RGBA(0,0,0,0))
                    FillPortions: =0
                    FontWeight: =If(ThisItem.Tag = varNavTag, FontWeight.Semibold, FontWeight.Normal)
                    Height: =Parent.TemplateHeight
                    OnSelect: =Switch(ThisItem.Tag, "home", Navigate(scrHome, ScreenTransition.None), "emps", Navigate(scrEmployees, ScreenTransition.None), "cat", Navigate(scrCatalog, ScreenTransition.None), "recs", Navigate(scrRecords, ScreenTransition.None), "my", Navigate(scrMyTrainings, ScreenTransition.None), Navigate(scrReports, ScreenTransition.None))
                    PaddingLeft: =12
                    Size: =12
                    Text: =ThisItem.Icon & "   " & ThisItem.Title
                    Width: =Parent.TemplateWidth
                    ZIndex: =1

            navRoleAddRecord As label:
                Color: =RGBA(97, 97, 97, 1)
                Height: =26
                PaddingLeft: =12
                Size: =10
                Text: |-
                    ="Rola: " & Switch(varRole, "admin", "HR Admin", "manager", "Manažér", "Zamestnanec")
                ZIndex: =3

        mainAddRecord As groupContainer.verticalAutoLayoutContainer:
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =20
            ZIndex: =2

            hdrAddRecord As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: =64
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =12
                LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                ZIndex: =1

                hdrTitleAddRecord As groupContainer.verticalAutoLayoutContainer:
                    LayoutGap: =2
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    ZIndex: =1

                    hdrTitleLblAddRecord As label:
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =21
                        Text: =If(IsBlank(varEditRecord), "Nový záznam školenia", "Upraviť záznam školenia")
                        ZIndex: =1

                    hdrSubLblAddRecord As label:
                        Color: =RGBA(97, 97, 97, 1)
                        Height: =20
                        Size: =11
                        Text: ="Výberom zamestnanca a školenia sa platnosť dopočíta automaticky z katalógu."
                        ZIndex: =2

            addForm As groupContainer.verticalAutoLayoutContainer:
                AlignInContainer: =AlignInContainer.Start
                FillPortions: =0
                LayoutAlignItems: =LayoutAlignItems.Stretch
                LayoutGap: =8
                Width: =640
                ZIndex: =2

                lblEmpCap As label:
                    FontWeight: =FontWeight.Semibold
                    Height: =22
                    Size: =11
                    Text: ="Zamestnanec"
                    ZIndex: =1

                txtEmpSearch As text:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    Color: =RGBA(36, 36, 36, 1)
                    Default: =If(IsBlank(varPickedEmp), "", varPickedEmp.FullName)
                    DisplayMode: =If(IsBlank(varEditRecord), DisplayMode.Edit, DisplayMode.View)
                    HintText: ="Začnite písať meno alebo osobné číslo…"
                    Size: =11
                    ZIndex: =2

                galEmpSug As gallery.galleryVertical:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    BorderThickness: =1
                    Fill: =RGBA(255, 255, 255, 1)
                    FillPortions: =0
                    Height: =150
                    Items: =FirstN(Filter(colEmployees, Status = "Active" && (varRole <> "manager" || ManagerEmail = varCurrentUser.Email) && (StartsWith(FullName, txtEmpSearch.Text) || StartsWith(EmployeeID, txtEmpSearch.Text))), 5)
                    Layout: =Layout.Vertical
                    ShowScrollbar: =false
                    TemplatePadding: =0
                    TemplateSize: =36
                    Visible: =!IsBlank(txtEmpSearch.Text) && (IsBlank(varPickedEmp) || txtEmpSearch.Text <> varPickedEmp.FullName)
                    ZIndex: =3

                    empSugRow As label:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =Parent.TemplateHeight
                        OnSelect: =Set(varPickedEmp, ThisItem); Reset(txtEmpSearch)
                        PaddingLeft: =12
                        Size: =10
                        Text: =ThisItem.FullName & "  (" & ThisItem.EmployeeID & ")"
                        Width: =Parent.TemplateWidth
                        ZIndex: =1

                lblPicked As label:
                    Color: =RGBA(97, 97, 97, 1)
                    Height: =22
                    Size: =10
                    Text: |-
                        ="Vybraný: " & If(IsBlank(varPickedEmp), "—", varPickedEmp.FullName & " (" & varPickedEmp.EmployeeID & ")")
                    ZIndex: =4

                lblTrCap As label:
                    FontWeight: =FontWeight.Semibold
                    Height: =22
                    Size: =11
                    Text: ="Školenie"
                    ZIndex: =5

                galTrainPick As gallery.galleryVertical:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    BorderThickness: =1
                    Fill: =RGBA(255, 255, 255, 1)
                    FillPortions: =0
                    Height: =150
                    Items: =SortByColumns(colTrainingsCatalog, "TrainingName")
                    Layout: =Layout.Vertical
                    TemplatePadding: =0
                    TemplateSize: =34
                    ZIndex: =6

                    trainPickRow As label:
                        Color: =If(varPickedTraining.ID = ThisItem.ID, RGBA(91, 95, 199, 1), RGBA(36, 36, 36, 1))
                        Fill: =If(varPickedTraining.ID = ThisItem.ID, RGBA(237, 237, 237, 1), RGBA(255, 255, 255, 1))
                        FillPortions: =0
                        FontWeight: =If(varPickedTraining.ID = ThisItem.ID, FontWeight.Semibold, FontWeight.Normal)
                        Height: =Parent.TemplateHeight
                        OnSelect: =Set(varPickedTraining, ThisItem)
                        PaddingLeft: =12
                        Size: =10
                        Text: =ThisItem.TrainingName & If(ThisItem.ValidityMonths > 0, " (platnosť " & ThisItem.ValidityMonths & " mes.)", "")
                        Width: =Parent.TemplateWidth
                        ZIndex: =1

                chkPlanned As checkbox:
                    Height: =36
                    Size: =11
                    Text: ="Naplánované školenie (budúci termín)"
                    ZIndex: =7

                lblDateCap As label:
                    FontWeight: =FontWeight.Semibold
                    Height: =22
                    Size: =11
                    Text: =If(chkPlanned.Value, "Plánovaný termín (d.m.rrrr)", "Dátum absolvovania (d.m.rrrr)")
                    ZIndex: =8

                dateRow As groupContainer.horizontalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =40
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =12
                    ZIndex: =9

                    txtDateAdd As text:
                        BorderColor: =RGBA(225, 225, 225, 1)
                        Color: =RGBA(36, 36, 36, 1)
                        Default: =If(IsBlank(varEditRecord), Text(Today(), "d.m.yyyy"), Text(varEditRecord.CompletionDate, "d.m.yyyy"))
                        Size: =11
                        Width: =200
                        ZIndex: =1

                    lblExpPrev As label:
                        Color: =RGBA(97, 97, 97, 1)
                        FillPortions: =1
                        Height: =26
                        Size: =10
                        Text: |-
                            ="Platnosť do: " & If(IsBlank(varPickedTraining) || IsError(DateValue(txtDateAdd.Text)), "—", chkPlanned.Value, "— (doplní sa po absolvovaní)", varPickedTraining.ValidityMonths = 0, "neobmedzená", Text(DateAdd(DateValue(txtDateAdd.Text), varPickedTraining.ValidityMonths, TimeUnit.Months), "d.m.yyyy"))
                        ZIndex: =2

                lblNotesCap As label:
                    FontWeight: =FontWeight.Semibold
                    Height: =22
                    Size: =11
                    Text: ="Poznámky"
                    ZIndex: =10

                txtNotesAdd As text:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    Color: =RGBA(36, 36, 36, 1)
                    Default: =If(IsBlank(varEditRecord), "", varEditRecord.Notes)
                    Height: =80
                    Mode: =TextMode.MultiLine
                    Size: =11
                    ZIndex: =11

                addBtnRow As groupContainer.horizontalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =48
                    LayoutGap: =10
                    LayoutJustifyContent: =LayoutJustifyContent.End
                    PaddingTop: =8
                    ZIndex: =12

                    btnCancelAdd As button:
                        BorderColor: =RGBA(225, 225, 225, 1)
                        BorderThickness: =1
                        Color: =RGBA(36, 36, 36, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(237, 237, 237, 1)
                        OnSelect: =Navigate(scrRecords, ScreenTransition.None)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =11
                        Text: ="Zrušiť"
                        Width: =120
                        ZIndex: =1

                    btnSaveAdd As button:
                        BorderColor: =RGBA(91, 95, 199, 1)
                        Fill: =RGBA(91, 95, 199, 1)
                        FontWeight: =FontWeight.Semibold
                        HoverFill: =RGBA(79, 82, 178, 1)
                        OnSelect: |-
                            =If(IsBlank(varPickedEmp) || IsBlank(varPickedTraining), Notify("Vyberte zamestnanca aj školenie.", NotificationType.Error, 2500), IsError(DateValue(txtDateAdd.Text)), Notify("Zadajte platný dátum v tvare d.m.rrrr.", NotificationType.Error, 2500), !chkPlanned.Value && DateValue(txtDateAdd.Text) > Today(), Notify("Dátum absolvovania nemôže byť v budúcnosti. Označte Naplánované školenie.", NotificationType.Error, 3000), chkPlanned.Value && DateValue(txtDateAdd.Text) <= Today(), Notify("Plánovaný termín musí byť v budúcnosti.", NotificationType.Error, 2500), If(IsBlank(varEditRecord), Collect(colRecordsBase, {ID: Max(colRecordsBase, ID) + 1, Emp: varPickedEmp.EmployeeID, Tr: varPickedTraining.ID, Off: DateDiff(Today(), DateValue(txtDateAdd.Text), TimeUnit.Days), Pl: chkPlanned.Value, Cert: "", Notes: txtNotesAdd.Text}); /* LIVE: Patch(TrainingRecords, Defaults(TrainingRecords), {Employee: {Id: varPickedEmp.ID, Value: varPickedEmp.FullName}, Training: {Id: varPickedTraining.ID, Value: varPickedTraining.TrainingName}, CompletionDate: DateValue(txtDateAdd.Text), Status: {Value: If(chkPlanned.Value, "Planned", "Valid")}}); */ Collect(colAudit, {ID: Max(colAudit, ID) + 1, Action: "Create", EntityType: "TrainingRecord", EntityID: varPickedEmp.EmployeeID, ChangedBy: varCurrentUser.Email, ChangedOn: Now(), Details: "Pridaný záznam školenia " & varPickedTraining.TrainingName & " pre " & varPickedEmp.FullName}), Patch(colRecordsBase, LookUp(colRecordsBase, ID = varEditRecord.ID), {Off: DateDiff(Today(), DateValue(txtDateAdd.Text), TimeUnit.Days), Pl: chkPlanned.Value, Notes: txtNotesAdd.Text}); /* LIVE: Patch(TrainingRecords, LookUp(TrainingRecords, ID = varEditRecord.ID), {CompletionDate: DateValue(txtDateAdd.Text)}); */ Collect(colAudit, {ID: Max(colAudit, ID) + 1, Action: "Update", EntityType: "TrainingRecord", EntityID: varEditRecord.EmployeeID, ChangedBy: varCurrentUser.Email, ChangedOn: Now(), Details: "Upravený záznam školenia " & varEditRecord.TrainingName}) ); ClearCollect(colRecords,
                                AddColumns(
                                    AddColumns(
                                        AddColumns(colRecordsBase,
                                            "EmployeeID", Emp,
                                            "EmployeeName", LookUp(colEmployees, EmployeeID = Emp, FullName),
                                            "DepartmentCode", LookUp(colEmployees, EmployeeID = Emp, DepartmentCode),
                                            "ManagerEmail", LookUp(colEmployees, EmployeeID = Emp, ManagerEmail),
                                            "TrainingName", LookUp(colTrainingsCatalog, ID = Tr, TrainingName),
                                            "TrainingType", LookUp(colTrainingsCatalog, ID = Tr, TrainingType),
                                            "ValidityMonths", LookUp(colTrainingsCatalog, ID = Tr, ValidityMonths),
                                            "CompletionDate", DateAdd(Today(), Off, TimeUnit.Days)
                                        ),
                                        "ExpirationDate", If(Pl || ValidityMonths = 0, Blank(), DateAdd(CompletionDate, ValidityMonths, TimeUnit.Months))
                                    ),
                                    "LiveStatus", If(
                                        Pl, "Planned",
                                        IsBlank(ExpirationDate), "Valid",
                                        ExpirationDate < Today(), "Expired",
                                        ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days), "Expiring",
                                        "Valid"
                                    )
                                )
                            ); Notify("Záznam školenia bol uložený.", NotificationType.Success, 2000); Navigate(scrRecords, ScreenTransition.None))
                        PressedFill: =RGBA(79, 82, 178, 1)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =11
                        Text: =If(IsBlank(varEditRecord), "Uložiť záznam", "Uložiť zmeny")
                        Width: =170
                        ZIndex: =2

