scrEmployees As screen:
    Fill: =RGBA(245, 245, 245, 1)
    OnVisible: =Set(varNavTag, "emps")

    recRailE As rectangle:
        Fill: =RGBA(255, 255, 255, 1)
        Height: =Parent.Height
        Width: =220
        ZIndex: =1

    lblBrandE As label:
        Color: =RGBA(91, 95, 199, 1)
        FontWeight: =FontWeight.Bold
        PaddingLeft: =20
        Size: =15
        Text: ="HR Hub"
        Width: =200
        Y: =12
        ZIndex: =2

    galNavE As gallery.galleryVertical:
        Height: =Parent.Height - 64
        Items: =Filter(colNav, varRole <> "employee" || EmpVisible)
        ShowScrollbar: =false
        TemplatePadding: =0
        TemplateSize: =46
        Width: =220
        Y: =64
        ZIndex: =3

        lblNavItemE As label:
            Color: =If(ThisItem.Tag = varNavTag, RGBA(91, 95, 199, 1), RGBA(36, 36, 36, 1))
            Fill: =If(ThisItem.Tag = varNavTag, RGBA(237, 237, 237, 1), RGBA(0, 0, 0, 0))
            FontWeight: =If(ThisItem.Tag = varNavTag, FontWeight.Semibold, FontWeight.Normal)
            Height: =Parent.TemplateHeight
            OnSelect: =Switch(ThisItem.Tag, "home", Navigate(scrHome, ScreenTransition.None), "emps", Navigate(scrEmployees, ScreenTransition.None), "cat", Navigate(scrCatalog, ScreenTransition.None), "recs", Navigate(scrRecords, ScreenTransition.None), "my", Navigate(scrMyTrainings, ScreenTransition.None), Navigate(scrReports, ScreenTransition.None))
            PaddingLeft: =20
            Size: =12
            Text: =ThisItem.Icon & "  " & ThisItem.Title
            Width: =Parent.TemplateWidth
            ZIndex: =1

    lblTitleE As label:
        FontWeight: =FontWeight.Bold
        Size: =20
        Text: ="Zamestnanci"
        Width: =600
        X: =250
        Y: =20
        ZIndex: =4

    lblSubE As label:
        Color: =RGBA(92, 92, 92, 1)
        Height: =28
        Size: =11
        Text: ="Vyhľadávanie podľa začiatku mena alebo osobného čísla (delegovateľné StartsWith)."
        Width: =760
        X: =250
        Y: =58
        ZIndex: =4

    txtSearchE As text:
        BorderColor: =RGBA(209, 209, 209, 1)
        Default: =varSearch
        HintText: ="Hľadať (meno alebo EMP…)"
        Size: =11
        Width: =420
        X: =250
        Y: =90
        ZIndex: =4

    chkActiveE As checkbox:
        Default: =true
        Height: =40
        Size: =11
        Text: ="Len aktívni"
        Width: =160
        X: =700
        Y: =90
        ZIndex: =4

    btnAllDeptE As button:
        BorderColor: =RGBA(209, 209, 209, 1)
        BorderThickness: =1
        Color: =If(IsBlank(varDeptFilter), RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
        Fill: =If(IsBlank(varDeptFilter), RGBA(91, 95, 199, 1), RGBA(255, 255, 255, 1))
        Height: =34
        HoverFill: =RGBA(237, 237, 237, 1)
        OnSelect: =Set(varDeptFilter, Blank())
        RadiusBottomLeft: =17
        RadiusBottomRight: =17
        RadiusTopLeft: =17
        RadiusTopRight: =17
        Size: =10
        Text: ="Všetky oddelenia"
        Width: =150
        X: =250
        Y: =142
        ZIndex: =4

    galDeptE As gallery.galleryHorizontal:
        Height: =46
        Items: =colDepartments
        ShowScrollbar: =false
        TemplateSize: =172
        Width: =930
        X: =408
        Y: =136
        ZIndex: =4

        btnDeptE As button:
            BorderColor: =RGBA(209, 209, 209, 1)
            BorderThickness: =1
            Color: =If(varDeptFilter = ThisItem.DepartmentCode, RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
            Fill: =If(varDeptFilter = ThisItem.DepartmentCode, RGBA(91, 95, 199, 1), RGBA(255, 255, 255, 1))
            Height: =34
            HoverFill: =RGBA(237, 237, 237, 1)
            OnSelect: =Set(varDeptFilter, If(varDeptFilter = ThisItem.DepartmentCode, Blank(), ThisItem.DepartmentCode))
            RadiusBottomLeft: =17
            RadiusBottomRight: =17
            RadiusTopLeft: =17
            RadiusTopRight: =17
            Size: =10
            Text: =ThisItem.DepartmentName
            Width: =Parent.TemplateWidth - 6
            Y: =6
            ZIndex: =1

    galEmpsE As gallery.galleryVertical:
        Height: =540
        Items: =SortByColumns(Filter(colEmployees, (txtSearchE.Text = "" || StartsWith(FullName, txtSearchE.Text) || StartsWith(EmployeeID, txtSearchE.Text)) && (IsBlank(varDeptFilter) || DepartmentCode = varDeptFilter) && (!chkActiveE.Value || Status = "Active")), "FullName")
        OnSelect: =Set(varSelEmployee, galEmpsE.Selected); Navigate(scrEmployeeDetail, ScreenTransition.None)
        TemplatePadding: =4
        TemplateSize: =72
        Width: =1086
        X: =250
        Y: =200
        ZIndex: =4

        recEmpCardE As rectangle:
            BorderColor: =RGBA(209, 209, 209, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.TemplateHeight - 8
            OnSelect: =Select(Parent)
            Width: =Parent.TemplateWidth
            Y: =4
            ZIndex: =1

        lblEmpInitE As label:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(91, 95, 199, 1)
            FontWeight: =FontWeight.Bold
            Height: =44
            OnSelect: =Select(Parent)
            Size: =13
            Text: =Upper(Left(ThisItem.FullName, 1)) & Upper(Left(Last(Split(ThisItem.FullName, " ")).Value, 1))
            Width: =44
            X: =14
            Y: =18
            ZIndex: =2

        lblEmpNameE As label:
            FontWeight: =FontWeight.Semibold
            Height: =26
            OnSelect: =Select(Parent)
            Size: =12
            Text: =ThisItem.FullName
            Width: =420
            X: =72
            Y: =12
            ZIndex: =2

        lblEmpMetaE As label:
            Color: =RGBA(92, 92, 92, 1)
            Height: =24
            OnSelect: =Select(Parent)
            Size: =10
            Text: =ThisItem.Position & " · " & ThisItem.Department & " · " & ThisItem.EmployeeID
            Width: =620
            X: =72
            Y: =36
            ZIndex: =2

        lblEmpStatusE As label:
            Align: =Align.Center
            Color: =If(ThisItem.Status = "Active", RGBA(14, 107, 14, 1), RGBA(77, 77, 77, 1))
            Fill: =If(ThisItem.Status = "Active", RGBA(223, 246, 221, 1), RGBA(237, 237, 237, 1))
            FontWeight: =FontWeight.Semibold
            Height: =26
            OnSelect: =Select(Parent)
            Size: =10
            Text: =If(ThisItem.Status = "Active", "Aktívny", "Neaktívny")
            Width: =110
            X: =950
            Y: =22
            ZIndex: =2

