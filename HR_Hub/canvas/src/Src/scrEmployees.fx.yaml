scrEmployees As screen:
    Fill: =RGBA(243, 243, 243, 1)
    OnVisible: =Set(varNavTag, "emps")

    frameEmployees As groupContainer.horizontalAutoLayoutContainer:
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        Width: =Parent.Width
        ZIndex: =1

        navRailEmployees As groupContainer.verticalAutoLayoutContainer:
            BorderColor: =RGBA(225, 225, 225, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FillPortions: =0
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =4
            PaddingBottom: =12
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =12
            Width: =220
            ZIndex: =1

            navBrandEmployees As label:
                Color: =RGBA(91, 95, 199, 1)
                FontWeight: =FontWeight.Bold
                Height: =44
                PaddingLeft: =12
                Size: =16
                Text: ="HR Hub"
                ZIndex: =1

            navGalEmployees As gallery.galleryVertical:
                Items: =Filter(colNav, varRole <> "employee" || EmpVisible)
                Layout: =Layout.Vertical
                ShowScrollbar: =false
                TemplatePadding: =0
                TemplateSize: =46
                ZIndex: =2

                navItemEmployees As label:
                    Color: =If(ThisItem.Tag = varNavTag, RGBA(91, 95, 199, 1), RGBA(36, 36, 36, 1))
                    Fill: =If(ThisItem.Tag = varNavTag, RGBA(237, 237, 237, 1), RGBA(0,0,0,0))
                    FillPortions: =0
                    FontWeight: =If(ThisItem.Tag = varNavTag, FontWeight.Semibold, FontWeight.Normal)
                    Height: =Parent.TemplateHeight
                    OnSelect: =Switch(ThisItem.Tag, "home", Navigate(scrHome, ScreenTransition.None), "emps", Navigate(scrEmployees, ScreenTransition.None), "cat", Navigate(scrCatalog, ScreenTransition.None), "recs", Navigate(scrRecords, ScreenTransition.None), "my", Navigate(scrMyTrainings, ScreenTransition.None), Navigate(scrReports, ScreenTransition.None))
                    PaddingLeft: =12
                    Size: =12
                    Text: =ThisItem.Icon & "   " & ThisItem.Title
                    Width: =Parent.TemplateWidth
                    ZIndex: =1

            navRoleEmployees As label:
                Color: =RGBA(97, 97, 97, 1)
                Height: =26
                PaddingLeft: =12
                Size: =10
                Text: |-
                    ="Rola: " & Switch(varRole, "admin", "HR Admin", "manager", "Manažér", "Zamestnanec")
                ZIndex: =3

        mainEmployees As groupContainer.verticalAutoLayoutContainer:
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =20
            ZIndex: =2

            hdrEmployees As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: =64
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =12
                LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                ZIndex: =1

                hdrTitleEmployees As groupContainer.verticalAutoLayoutContainer:
                    LayoutGap: =2
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    ZIndex: =1

                    hdrTitleLblEmployees As label:
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =21
                        Text: ="Zamestnanci"
                        ZIndex: =1

                    hdrSubLblEmployees As label:
                        Color: =RGBA(97, 97, 97, 1)
                        Height: =20
                        Size: =11
                        Text: ="Vyhľadávanie podľa začiatku mena alebo osobného čísla (delegovateľné StartsWith)."
                        ZIndex: =2

            toolbarEmp As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: =44
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =12
                ZIndex: =2

                txtSearchEmp As text:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    Color: =RGBA(36, 36, 36, 1)
                    Default: =varSearch
                    FillPortions: =1
                    HintText: ="Hľadať (meno alebo EMP…)"
                    Size: =11
                    ZIndex: =1

                chkActiveEmp As checkbox:
                    Default: =true
                    Height: =40
                    Size: =11
                    Text: ="Len aktívni"
                    ZIndex: =2

            deptChipsEmp As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: =46
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =8
                LayoutOverflowX: =LayoutOverflow.Scroll
                ZIndex: =3

                btnAllDeptEmp As button:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    BorderThickness: =1
                    Color: =If(IsBlank(varDeptFilter), RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
                    Fill: =If(IsBlank(varDeptFilter), RGBA(91, 95, 199, 1), RGBA(255, 255, 255, 1))
                    Height: =34
                    HoverFill: =RGBA(237, 237, 237, 1)
                    OnSelect: =Set(varDeptFilter, Blank())
                    RadiusBottomLeft: =17
                    RadiusBottomRight: =17
                    RadiusTopLeft: =17
                    RadiusTopRight: =17
                    Size: =10
                    Text: ="Všetky oddelenia"
                    Width: =150
                    ZIndex: =1

                galDeptEmp As gallery.galleryHorizontal:
                    Height: =46
                    Items: =colDepartments
                    ShowScrollbar: =false
                    TemplatePadding: =0
                    TemplateSize: =168
                    ZIndex: =2

                    galDeptEmpBtn As button:
                        BorderColor: =RGBA(225, 225, 225, 1)
                        BorderThickness: =1
                        Color: =If(varDeptFilter = ThisItem.DepartmentCode, RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
                        Fill: =If(varDeptFilter = ThisItem.DepartmentCode, RGBA(91, 95, 199, 1), RGBA(255, 255, 255, 1))
                        FillPortions: =0
                        Height: =34
                        HoverFill: =RGBA(237, 237, 237, 1)
                        OnSelect: =Set(varDeptFilter, If(varDeptFilter = ThisItem.DepartmentCode, Blank(), ThisItem.DepartmentCode))
                        RadiusBottomLeft: =17
                        RadiusBottomRight: =17
                        RadiusTopLeft: =17
                        RadiusTopRight: =17
                        Size: =10
                        Text: =ThisItem.DepartmentName
                        Width: =Parent.TemplateWidth - 6
                        Y: =6
                        ZIndex: =1

            galEmps As gallery.galleryVertical:
                Items: =SortByColumns(Filter(colEmployees, (txtSearchEmp.Text = "" || StartsWith(FullName, txtSearchEmp.Text) || StartsWith(EmployeeID, txtSearchEmp.Text)) && (IsBlank(varDeptFilter) || DepartmentCode = varDeptFilter) && (!chkActiveEmp.Value || Status = "Active")), "FullName")
                Layout: =Layout.Vertical
                OnSelect: =Set(varSelEmployee, galEmps.Selected); Set(varTab, "trainings"); Navigate(scrEmployeeDetail, ScreenTransition.None)
                TemplatePadding: =0
                TemplateSize: =72
                ZIndex: =4

                empBg As rectangle:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    BorderThickness: =1
                    Fill: =RGBA(255, 255, 255, 1)
                    Height: =Parent.TemplateHeight - 8
                    OnSelect: =Select(Parent)
                    Width: =Parent.TemplateWidth
                    Y: =4
                    ZIndex: =1

                empAvatar As label:
                    Align: =Align.Center
                    Color: =RGBA(255, 255, 255, 1)
                    Fill: =RGBA(91, 95, 199, 1)
                    FillPortions: =0
                    FontWeight: =FontWeight.Bold
                    Height: =44
                    OnSelect: =Select(Parent)
                    RadiusBottomLeft: =22
                    RadiusBottomRight: =22
                    RadiusTopLeft: =22
                    RadiusTopRight: =22
                    Size: =13
                    Text: =Upper(Left(ThisItem.FullName, 1)) & Upper(Left(Last(Split(ThisItem.FullName, " ")).Value, 1))
                    Width: =44
                    X: =16
                    Y: =16
                    ZIndex: =2

                empName As label:
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =24
                    OnSelect: =Select(Parent)
                    Size: =12
                    Text: =ThisItem.FullName
                    Width: =Parent.TemplateWidth - 320
                    X: =74
                    Y: =14
                    ZIndex: =3

                empMeta As label:
                    Color: =RGBA(97, 97, 97, 1)
                    FillPortions: =0
                    Height: =22
                    OnSelect: =Select(Parent)
                    Size: =10
                    Text: =ThisItem.Position & " · " & ThisItem.Department & " · " & ThisItem.EmployeeID
                    Width: =Parent.TemplateWidth - 320
                    X: =74
                    Y: =38
                    ZIndex: =4

                empStatus As label:
                    Align: =Align.Center
                    Color: =If(ThisItem.Status = "Active", RGBA(14, 107, 14, 1), RGBA(77, 77, 77, 1))
                    Fill: =If(ThisItem.Status = "Active", RGBA(223, 246, 221, 1), RGBA(237, 237, 237, 1))
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    OnSelect: =Select(Parent)
                    Size: =10
                    Text: =If(ThisItem.Status = "Active", "Aktívny", "Neaktívny")
                    Width: =120
                    X: =Parent.TemplateWidth - 140
                    Y: =Parent.TemplateHeight/2 - 13
                    ZIndex: =5

