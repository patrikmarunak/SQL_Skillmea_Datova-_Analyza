scrReports As screen:
    Fill: =RGBA(243, 243, 243, 1)
    OnVisible: |-
        =Set(varNavTag, "rep");
        Set(varRepBy, Sort(AddColumns(RenameColumns(colDepartments, "DepartmentCode", "DC"), "Cnt", CountRows(Filter(colRecords, DepartmentCode = DC))), Cnt, SortOrder.Descending));
        Set(varRepMax, Max(Max(varRepBy, Cnt), 1));
        Set(varRepExp, Sort(AddColumns(RenameColumns(colDepartments, "DepartmentCode", "DC"), "Cnt", CountRows(Filter(colRecords, DepartmentCode = DC && LiveStatus = "Expiring"))), Cnt, SortOrder.Descending));
        Set(varRepExpMax, Max(Max(varRepExp, Cnt), 1));
        Set(varRepComp, Sort(AddColumns(RenameColumns(colDepartments, "DepartmentCode", "DC"), "Pct", With({t: CountRows(Filter(colRecords, DepartmentCode = DC && LiveStatus <> "Planned"))}, If(t = 0, 100, Round(CountRows(Filter(colRecords, DepartmentCode = DC && LiveStatus <> "Planned" && LiveStatus <> "Expired")) / t * 100, 0)))), Pct, SortOrder.Ascending))

    frameReports As groupContainer.horizontalAutoLayoutContainer:
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        Width: =Parent.Width
        ZIndex: =1

        navRailReports As groupContainer.verticalAutoLayoutContainer:
            BorderColor: =RGBA(225, 225, 225, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FillPortions: =0
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =4
            PaddingBottom: =12
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =12
            Width: =220
            ZIndex: =1

            navBrandReports As label:
                Color: =RGBA(91, 95, 199, 1)
                FontWeight: =FontWeight.Bold
                Height: =44
                PaddingLeft: =12
                Size: =16
                Text: ="HR Hub"
                ZIndex: =1

            navGalReports As gallery.galleryVertical:
                Items: =Filter(colNav, varRole <> "employee" || EmpVisible)
                Layout: =Layout.Vertical
                ShowScrollbar: =false
                TemplatePadding: =0
                TemplateSize: =46
                ZIndex: =2

                navItemReports As label:
                    Color: =If(ThisItem.Tag = varNavTag, RGBA(91, 95, 199, 1), RGBA(36, 36, 36, 1))
                    Fill: =If(ThisItem.Tag = varNavTag, RGBA(237, 237, 237, 1), RGBA(0,0,0,0))
                    FillPortions: =0
                    FontWeight: =If(ThisItem.Tag = varNavTag, FontWeight.Semibold, FontWeight.Normal)
                    Height: =Parent.TemplateHeight
                    OnSelect: =Switch(ThisItem.Tag, "home", Navigate(scrHome, ScreenTransition.None), "emps", Navigate(scrEmployees, ScreenTransition.None), "cat", Navigate(scrCatalog, ScreenTransition.None), "recs", Navigate(scrRecords, ScreenTransition.None), "my", Navigate(scrMyTrainings, ScreenTransition.None), Navigate(scrReports, ScreenTransition.None))
                    PaddingLeft: =12
                    Size: =12
                    Text: =ThisItem.Icon & "   " & ThisItem.Title
                    Width: =Parent.TemplateWidth
                    ZIndex: =1

            navRoleReports As label:
                Color: =RGBA(97, 97, 97, 1)
                Height: =26
                PaddingLeft: =12
                Size: =10
                Text: |-
                    ="Rola: " & Switch(varRole, "admin", "HR Admin", "manager", "Manažér", "Zamestnanec")
                ZIndex: =3

        mainReports As groupContainer.verticalAutoLayoutContainer:
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =20
            ZIndex: =2

            hdrReports As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: =64
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =12
                LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                ZIndex: =1

                hdrTitleReports As groupContainer.verticalAutoLayoutContainer:
                    LayoutGap: =2
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    ZIndex: =1

                    hdrTitleLblReports As label:
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =21
                        Text: ="Reporty"
                        ZIndex: =1

                    hdrSubLblReports As label:
                        Color: =RGBA(97, 97, 97, 1)
                        Height: =20
                        Size: =11
                        Text: ="Školenia podľa oddelení a miera súladu jednotlivých tímov."
                        ZIndex: =2

            rep1Card As groupContainer.verticalAutoLayoutContainer:
                BorderColor: =RGBA(225, 225, 225, 1)
                BorderThickness: =1
                Fill: =RGBA(255, 255, 255, 1)
                FillPortions: =0
                Height: =300
                LayoutAlignItems: =LayoutAlignItems.Stretch
                LayoutGap: =8
                PaddingBottom: =16
                PaddingLeft: =16
                PaddingRight: =16
                PaddingTop: =16
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                ZIndex: =2

                rep1Title As label:
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    Size: =13
                    Text: ="Počet školení podľa oddelenia"
                    ZIndex: =1

                rep1Gal As gallery.galleryVertical:
                    FillPortions: =0
                    Height: =240
                    Items: =varRepBy
                    Layout: =Layout.Vertical
                    ShowScrollbar: =false
                    TemplatePadding: =0
                    TemplateSize: =30
                    ZIndex: =2

                    rep1Name As label:
                        FillPortions: =0
                        Height: =Parent.TemplateHeight
                        Size: =10
                        Text: =ThisItem.DepartmentName
                        Width: =170
                        ZIndex: =1

                    rep1Track As rectangle:
                        Fill: =RGBA(237, 237, 237, 1)
                        Height: =12
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Width: =Parent.TemplateWidth - 240
                        X: =176
                        Y: =Parent.TemplateHeight/2 - 6
                        ZIndex: =2

                    rep1Bar As rectangle:
                        Fill: =RGBA(91, 95, 199, 1)
                        Height: =12
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Width: =Max(4, ThisItem.Cnt / varRepMax * (Parent.TemplateWidth - 240))
                        X: =176
                        Y: =Parent.TemplateHeight/2 - 6
                        ZIndex: =3

                    rep1Val As label:
                        Align: =Align.End
                        FillPortions: =0
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.TemplateHeight
                        Size: =10
                        Text: =ThisItem.Cnt
                        Width: =56
                        X: =Parent.TemplateWidth - 56
                        ZIndex: =4

            rep2Card As groupContainer.verticalAutoLayoutContainer:
                BorderColor: =RGBA(225, 225, 225, 1)
                BorderThickness: =1
                Fill: =RGBA(255, 255, 255, 1)
                FillPortions: =0
                Height: =300
                LayoutAlignItems: =LayoutAlignItems.Stretch
                LayoutGap: =8
                PaddingBottom: =16
                PaddingLeft: =16
                PaddingRight: =16
                PaddingTop: =16
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                ZIndex: =3

                rep2Title As label:
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    Size: =13
                    Text: ="Exspiruje do 30 dní"
                    ZIndex: =1

                rep2Gal As gallery.galleryVertical:
                    FillPortions: =0
                    Height: =240
                    Items: =varRepExp
                    Layout: =Layout.Vertical
                    ShowScrollbar: =false
                    TemplatePadding: =0
                    TemplateSize: =30
                    ZIndex: =2

                    rep2Name As label:
                        FillPortions: =0
                        Height: =Parent.TemplateHeight
                        Size: =10
                        Text: =ThisItem.DepartmentName
                        Width: =170
                        ZIndex: =1

                    rep2Track As rectangle:
                        Fill: =RGBA(237, 237, 237, 1)
                        Height: =12
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Width: =Parent.TemplateWidth - 240
                        X: =176
                        Y: =Parent.TemplateHeight/2 - 6
                        ZIndex: =2

                    rep2Bar As rectangle:
                        Fill: =RGBA(122, 82, 0, 1)
                        Height: =12
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Width: =Max(4, ThisItem.Cnt / varRepExpMax * (Parent.TemplateWidth - 240))
                        X: =176
                        Y: =Parent.TemplateHeight/2 - 6
                        ZIndex: =3

                    rep2Val As label:
                        Align: =Align.End
                        FillPortions: =0
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.TemplateHeight
                        Size: =10
                        Text: =ThisItem.Cnt
                        Width: =56
                        X: =Parent.TemplateWidth - 56
                        ZIndex: =4

            rep3Card As groupContainer.verticalAutoLayoutContainer:
                BorderColor: =RGBA(225, 225, 225, 1)
                BorderThickness: =1
                Fill: =RGBA(255, 255, 255, 1)
                FillPortions: =0
                Height: =300
                LayoutAlignItems: =LayoutAlignItems.Stretch
                LayoutGap: =8
                PaddingBottom: =16
                PaddingLeft: =16
                PaddingRight: =16
                PaddingTop: =16
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                ZIndex: =4

                rep3Title As label:
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    Size: =13
                    Text: ="Miera súladu podľa oddelenia (% neexspirovaných)"
                    ZIndex: =1

                rep3Gal As gallery.galleryVertical:
                    FillPortions: =0
                    Height: =240
                    Items: =varRepComp
                    Layout: =Layout.Vertical
                    ShowScrollbar: =false
                    TemplatePadding: =0
                    TemplateSize: =30
                    ZIndex: =2

                    rep3Name As label:
                        FillPortions: =0
                        Height: =Parent.TemplateHeight
                        Size: =10
                        Text: =ThisItem.DepartmentName
                        Width: =170
                        ZIndex: =1

                    rep3Track As rectangle:
                        Fill: =RGBA(237, 237, 237, 1)
                        Height: =12
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Width: =Parent.TemplateWidth - 240
                        X: =176
                        Y: =Parent.TemplateHeight/2 - 6
                        ZIndex: =2

                    rep3Bar As rectangle:
                        Fill: =If(ThisItem.Pct >= 90, RGBA(14, 107, 14, 1), ThisItem.Pct >= 75, RGBA(122, 82, 0, 1), RGBA(164, 38, 44, 1))
                        Height: =12
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Width: =Max(4, ThisItem.Pct / 100 * (Parent.TemplateWidth - 240))
                        X: =176
                        Y: =Parent.TemplateHeight/2 - 6
                        ZIndex: =3

                    rep3Val As label:
                        Align: =Align.End
                        FillPortions: =0
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.TemplateHeight
                        Size: =10
                        Text: =ThisItem.Pct & " %"
                        Width: =56
                        X: =Parent.TemplateWidth - 56
                        ZIndex: =4

