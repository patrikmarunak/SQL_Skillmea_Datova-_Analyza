scrCatalog As screen:
    Fill: =RGBA(245, 245, 245, 1)
    OnVisible: =Set(varNavTag, "cat")

    recRailC As rectangle:
        Fill: =RGBA(255, 255, 255, 1)
        Height: =Parent.Height
        Width: =220
        ZIndex: =1

    lblBrandC As label:
        Color: =RGBA(91, 95, 199, 1)
        FontWeight: =FontWeight.Bold
        PaddingLeft: =20
        Size: =15
        Text: ="HR Hub"
        Width: =200
        Y: =12
        ZIndex: =2

    galNavC As gallery.galleryVertical:
        Height: =Parent.Height - 64
        Items: =Filter(colNav, varRole <> "employee" || EmpVisible)
        ShowScrollbar: =false
        TemplatePadding: =0
        TemplateSize: =46
        Width: =220
        Y: =64
        ZIndex: =3

        lblNavItemC As label:
            Color: =If(ThisItem.Tag = varNavTag, RGBA(91, 95, 199, 1), RGBA(36, 36, 36, 1))
            Fill: =If(ThisItem.Tag = varNavTag, RGBA(237, 237, 237, 1), RGBA(0, 0, 0, 0))
            FontWeight: =If(ThisItem.Tag = varNavTag, FontWeight.Semibold, FontWeight.Normal)
            Height: =Parent.TemplateHeight
            OnSelect: =Switch(ThisItem.Tag, "home", Navigate(scrHome, ScreenTransition.None), "emps", Navigate(scrEmployees, ScreenTransition.None), "cat", Navigate(scrCatalog, ScreenTransition.None), "recs", Navigate(scrRecords, ScreenTransition.None), "my", Navigate(scrMyTrainings, ScreenTransition.None), Navigate(scrReports, ScreenTransition.None))
            PaddingLeft: =20
            Size: =12
            Text: =ThisItem.Icon & "  " & ThisItem.Title
            Width: =Parent.TemplateWidth
            ZIndex: =1

    lblTitleC As label:
        FontWeight: =FontWeight.Bold
        Size: =20
        Text: ="Katalóg školení"
        Width: =600
        X: =250
        Y: =20
        ZIndex: =4

    lblSubC As label:
        Color: =RGBA(92, 92, 92, 1)
        Height: =28
        Size: =11
        Text: ="Dostupné školenia, platnosť a poskytovatelia. Pridávanie len pre rolu HR Admin."
        Width: =760
        X: =250
        Y: =58
        ZIndex: =4

    galCatC As gallery.galleryVertical:
        Height: =430
        Items: =SortByColumns(colTrainingsCatalog, "TrainingName")
        TemplatePadding: =3
        TemplateSize: =62
        Width: =1086
        X: =250
        Y: =96
        ZIndex: =4

        recCatCardC As rectangle:
            BorderColor: =RGBA(209, 209, 209, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.TemplateHeight - 6
            Width: =Parent.TemplateWidth
            Y: =3
            ZIndex: =1

        lblCatNameC As label:
            FontWeight: =FontWeight.Semibold
            Height: =26
            Size: =12
            Text: =ThisItem.TrainingName
            Width: =520
            X: =16
            Y: =8
            ZIndex: =2

        lblCatMetaC As label:
            Color: =RGBA(92, 92, 92, 1)
            Height: =22
            Size: =10
            Text: |-
                ="Platnosť: " & If(ThisItem.ValidityMonths = 0, "neobmedzená", ThisItem.ValidityMonths & " mes.") & "    Poskytovateľ: " & ThisItem.Provider
            Width: =620
            X: =16
            Y: =34
            ZIndex: =2

        lblCatTypeC As label:
            Align: =Align.Center
            Color: =Switch(ThisItem.TrainingType, "Mandatory", RGBA(164, 38, 44, 1), "Safety", RGBA(122, 82, 0, 1), "Certification", RGBA(14, 107, 14, 1), RGBA(77, 77, 77, 1))
            Fill: =Switch(ThisItem.TrainingType, "Mandatory", RGBA(253, 231, 233, 1), "Safety", RGBA(255, 244, 206, 1), "Certification", RGBA(223, 246, 221, 1), RGBA(237, 237, 237, 1))
            FontWeight: =FontWeight.Semibold
            Height: =26
            Size: =10
            Text: =Switch(ThisItem.TrainingType, "Mandatory", "Povinné", "Safety", "Bezpečnosť", "Certification", "Certifikácia", "Voliteľné")
            Width: =130
            X: =930
            Y: =17
            ZIndex: =2

    recAddC As rectangle:
        BorderColor: =RGBA(209, 209, 209, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =188
        Visible: =varRole = "admin"
        Width: =1086
        X: =250
        Y: =542
        ZIndex: =4

    lblAddTitleC As label:
        FontWeight: =FontWeight.Semibold
        Height: =26
        Size: =12
        Text: ="Nové školenie (len HR Admin)"
        Visible: =varRole = "admin"
        Width: =400
        X: =266
        Y: =552
        ZIndex: =5

    txtCatNameC As text:
        BorderColor: =RGBA(209, 209, 209, 1)
        Height: =38
        HintText: ="Názov školenia"
        Size: =10
        Visible: =varRole = "admin"
        Width: =380
        X: =266
        Y: =584
        ZIndex: =5

    txtCatValC As text:
        BorderColor: =RGBA(209, 209, 209, 1)
        Height: =38
        HintText: ="Platnosť (mesiace, 0 = bez)"
        Size: =10
        Visible: =varRole = "admin"
        Width: =220
        X: =658
        Y: =584
        ZIndex: =5

    txtCatProvC As text:
        BorderColor: =RGBA(209, 209, 209, 1)
        Height: =38
        HintText: ="Poskytovateľ"
        Size: =10
        Visible: =varRole = "admin"
        Width: =300
        X: =890
        Y: =584
        ZIndex: =5

    galTypeC As gallery.galleryHorizontal:
        Height: =44
        Items: |-
            =Table({T: "Mandatory", L: "Povinné"}, {T: "Optional", L: "Voliteľné"}, {T: "Certification", L: "Certifikácia"}, {T: "Safety", L: "Bezpečnosť"})
        ShowScrollbar: =false
        TemplateSize: =150
        Visible: =varRole = "admin"
        X: =266
        Y: =632
        ZIndex: =5

        btnTypeC As button:
            BorderColor: =RGBA(209, 209, 209, 1)
            BorderThickness: =1
            Color: =If(varCatType = ThisItem.T, RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
            Fill: =If(varCatType = ThisItem.T, RGBA(91, 95, 199, 1), RGBA(255, 255, 255, 1))
            Height: =32
            HoverFill: =RGBA(237, 237, 237, 1)
            OnSelect: =Set(varCatType, ThisItem.T)
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            RadiusTopLeft: =16
            RadiusTopRight: =16
            Size: =9
            Text: =ThisItem.L
            Width: =Parent.TemplateWidth - 6
            Y: =6
            ZIndex: =1

    btnCatSaveC As button:
        Fill: =RGBA(91, 95, 199, 1)
        FontWeight: =FontWeight.Semibold
        Height: =38
        HoverFill: =RGBA(79, 82, 178, 1)
        OnSelect: |-
            =If(IsBlank(txtCatNameC.Text), Notify("Zadajte názov školenia.", NotificationType.Error, 2500), !IsNumeric(txtCatValC.Text), Notify("Platnosť musí byť číslo (počet mesiacov, 0 = neobmedzená).", NotificationType.Error, 3000), Collect(colTrainingsCatalog, {ID: Max(colTrainingsCatalog, ID) + 1, TrainingName: txtCatNameC.Text, TrainingType: varCatType, ValidityMonths: Value(txtCatValC.Text), Provider: txtCatProvC.Text}); Collect(colAudit, {ID: Max(colAudit, ID) + 1, Action: "Create", EntityType: "TrainingCatalog", EntityID: txtCatNameC.Text, ChangedBy: varCurrentUser.Email, ChangedOn: Now(), Details: "Pridané školenie '" & txtCatNameC.Text & "' do katalógu."}); Notify("Školenie bolo pridané do katalógu.", NotificationType.Success, 2000); Reset(txtCatNameC); Reset(txtCatValC); Reset(txtCatProvC))
        Size: =11
        Text: ="+ Pridať školenie"
        Visible: =varRole = "admin"
        Width: =180
        X: =1010
        Y: =634
        ZIndex: =5

