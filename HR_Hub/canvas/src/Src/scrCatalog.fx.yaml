scrCatalog As screen:
    Fill: =RGBA(243, 243, 243, 1)
    OnVisible: =Set(varNavTag, "cat")

    frameCatalog As groupContainer.horizontalAutoLayoutContainer:
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        Width: =Parent.Width
        ZIndex: =1

        navRailCatalog As groupContainer.verticalAutoLayoutContainer:
            BorderColor: =RGBA(225, 225, 225, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FillPortions: =0
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =4
            PaddingBottom: =12
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =12
            Width: =220
            ZIndex: =1

            navBrandCatalog As label:
                Color: =RGBA(91, 95, 199, 1)
                FontWeight: =FontWeight.Bold
                Height: =44
                PaddingLeft: =12
                Size: =16
                Text: ="HR Hub"
                ZIndex: =1

            navGalCatalog As gallery.galleryVertical:
                Items: =Filter(colNav, varRole <> "employee" || EmpVisible)
                Layout: =Layout.Vertical
                ShowScrollbar: =false
                TemplatePadding: =0
                TemplateSize: =46
                ZIndex: =2

                navItemCatalog As label:
                    Color: =If(ThisItem.Tag = varNavTag, RGBA(91, 95, 199, 1), RGBA(36, 36, 36, 1))
                    Fill: =If(ThisItem.Tag = varNavTag, RGBA(237, 237, 237, 1), RGBA(0,0,0,0))
                    FillPortions: =0
                    FontWeight: =If(ThisItem.Tag = varNavTag, FontWeight.Semibold, FontWeight.Normal)
                    Height: =Parent.TemplateHeight
                    OnSelect: =Switch(ThisItem.Tag, "home", Navigate(scrHome, ScreenTransition.None), "emps", Navigate(scrEmployees, ScreenTransition.None), "cat", Navigate(scrCatalog, ScreenTransition.None), "recs", Navigate(scrRecords, ScreenTransition.None), "my", Navigate(scrMyTrainings, ScreenTransition.None), Navigate(scrReports, ScreenTransition.None))
                    PaddingLeft: =12
                    Size: =12
                    Text: =ThisItem.Icon & "   " & ThisItem.Title
                    Width: =Parent.TemplateWidth
                    ZIndex: =1

            navRoleCatalog As label:
                Color: =RGBA(97, 97, 97, 1)
                Height: =26
                PaddingLeft: =12
                Size: =10
                Text: |-
                    ="Rola: " & Switch(varRole, "admin", "HR Admin", "manager", "Manažér", "Zamestnanec")
                ZIndex: =3

        mainCatalog As groupContainer.verticalAutoLayoutContainer:
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =20
            ZIndex: =2

            hdrCatalog As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: =64
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =12
                LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                ZIndex: =1

                hdrTitleCatalog As groupContainer.verticalAutoLayoutContainer:
                    LayoutGap: =2
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    ZIndex: =1

                    hdrTitleLblCatalog As label:
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =21
                        Text: ="Katalóg školení"
                        ZIndex: =1

                    hdrSubLblCatalog As label:
                        Color: =RGBA(97, 97, 97, 1)
                        Height: =20
                        Size: =11
                        Text: ="Dostupné školenia, platnosť a poskytovatelia. Pridávanie len pre rolu HR Admin."
                        ZIndex: =2

            galCat As gallery.galleryVertical:
                Items: =SortByColumns(colTrainingsCatalog, "TrainingName")
                Layout: =Layout.Vertical
                TemplatePadding: =0
                TemplateSize: =62
                ZIndex: =2

                catBg As rectangle:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    BorderThickness: =1
                    Fill: =RGBA(255, 255, 255, 1)
                    Height: =Parent.TemplateHeight - 8
                    Width: =Parent.TemplateWidth
                    Y: =4
                    ZIndex: =1

                catName As label:
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =24
                    Size: =12
                    Text: =ThisItem.TrainingName
                    Width: =Parent.TemplateWidth - 200
                    X: =16
                    Y: =10
                    ZIndex: =2

                catMeta As label:
                    Color: =RGBA(97, 97, 97, 1)
                    FillPortions: =0
                    Height: =20
                    Size: =10
                    Text: |-
                        ="Platnosť: " & If(ThisItem.ValidityMonths = 0, "neobmedzená", ThisItem.ValidityMonths & " mes.") & "   ·   " & ThisItem.Provider
                    Width: =Parent.TemplateWidth - 200
                    X: =16
                    Y: =36
                    ZIndex: =3

                catType As label:
                    Align: =Align.Center
                    Color: =Switch(ThisItem.TrainingType, "Mandatory", RGBA(164, 38, 44, 1), "Safety", RGBA(122, 82, 0, 1), "Certification", RGBA(14, 107, 14, 1), RGBA(77, 77, 77, 1))
                    Fill: =Switch(ThisItem.TrainingType, "Mandatory", RGBA(253, 231, 233, 1), "Safety", RGBA(255, 244, 206, 1), "Certification", RGBA(223, 246, 221, 1), RGBA(237, 237, 237, 1))
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    Size: =10
                    Text: =Switch(ThisItem.TrainingType, "Mandatory", "Povinné", "Safety", "Bezpečnosť", "Certification", "Certifikácia", "Voliteľné")
                    Width: =130
                    X: =Parent.TemplateWidth - 150
                    Y: =Parent.TemplateHeight/2 - 13
                    ZIndex: =4

            catForm As groupContainer.verticalAutoLayoutContainer:
                BorderColor: =RGBA(225, 225, 225, 1)
                BorderThickness: =1
                Fill: =RGBA(255, 255, 255, 1)
                FillPortions: =0
                LayoutAlignItems: =LayoutAlignItems.Stretch
                LayoutGap: =8
                PaddingBottom: =16
                PaddingLeft: =16
                PaddingRight: =16
                PaddingTop: =16
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Visible: =varRole = "admin"
                ZIndex: =3

                catFormTitle As label:
                    FontWeight: =FontWeight.Semibold
                    Height: =24
                    Size: =12
                    Text: ="Nové školenie (len HR Admin)"
                    ZIndex: =1

                catFormRow1 As groupContainer.horizontalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =40
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =8
                    ZIndex: =2

                    txtCatName As text:
                        BorderColor: =RGBA(225, 225, 225, 1)
                        Color: =RGBA(36, 36, 36, 1)
                        FillPortions: =2
                        HintText: ="Názov školenia"
                        Size: =11
                        ZIndex: =1

                    txtCatVal As text:
                        BorderColor: =RGBA(225, 225, 225, 1)
                        Color: =RGBA(36, 36, 36, 1)
                        FillPortions: =1
                        HintText: ="Platnosť (mes., 0 = bez)"
                        Size: =11
                        ZIndex: =2

                    txtCatProv As text:
                        BorderColor: =RGBA(225, 225, 225, 1)
                        Color: =RGBA(36, 36, 36, 1)
                        FillPortions: =1
                        HintText: ="Poskytovateľ"
                        Size: =11
                        ZIndex: =3

                catFormRow2 As groupContainer.horizontalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =40
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =8
                    ZIndex: =3

                    galCatType As gallery.galleryHorizontal:
                        Height: =40
                        Items: |-
                            =Table({T:"Mandatory", L:"Povinné"}, {T:"Optional", L:"Voliteľné"}, {T:"Certification", L:"Certifikácia"}, {T:"Safety", L:"Bezpečnosť"})
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =150
                        ZIndex: =1

                        galCatTypeBtn As button:
                            BorderColor: =RGBA(225, 225, 225, 1)
                            BorderThickness: =1
                            Color: =If(varCatType = ThisItem.T, RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
                            Fill: =If(varCatType = ThisItem.T, RGBA(91, 95, 199, 1), RGBA(255, 255, 255, 1))
                            FillPortions: =0
                            Height: =32
                            HoverFill: =RGBA(237, 237, 237, 1)
                            OnSelect: =Set(varCatType, ThisItem.T)
                            RadiusBottomLeft: =16
                            RadiusBottomRight: =16
                            RadiusTopLeft: =16
                            RadiusTopRight: =16
                            Size: =9
                            Text: =ThisItem.L
                            Width: =Parent.TemplateWidth - 6
                            Y: =4
                            ZIndex: =1

                    btnCatSave As button:
                        BorderColor: =RGBA(91, 95, 199, 1)
                        Fill: =RGBA(91, 95, 199, 1)
                        FontWeight: =FontWeight.Semibold
                        HoverFill: =RGBA(79, 82, 178, 1)
                        OnSelect: |-
                            =If(IsBlank(txtCatName.Text), Notify("Zadajte názov školenia.", NotificationType.Error, 2500), !IsNumeric(txtCatVal.Text), Notify("Platnosť musí byť číslo (0 = neobmedzená).", NotificationType.Error, 3000), Collect(colTrainingsCatalog, {ID: Max(colTrainingsCatalog, ID) + 1, TrainingName: txtCatName.Text, TrainingType: varCatType, ValidityMonths: Value(txtCatVal.Text), Provider: txtCatProv.Text}); /* LIVE: Patch(TrainingsCatalog, Defaults(TrainingsCatalog), {Title: txtCatName.Text, TrainingType:{Value:varCatType}, ValidityMonths: Value(txtCatVal.Text), Provider: txtCatProv.Text}); */ Collect(colAudit, {ID: Max(colAudit, ID) + 1, Action: "Create", EntityType: "TrainingCatalog", EntityID: txtCatName.Text, ChangedBy: varCurrentUser.Email, ChangedOn: Now(), Details: "Pridané školenie do katalógu: " & txtCatName.Text}); Notify("Školenie bolo pridané do katalógu.", NotificationType.Success, 2000); Reset(txtCatName); Reset(txtCatVal); Reset(txtCatProv))
                        PressedFill: =RGBA(79, 82, 178, 1)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =11
                        Text: ="+ Pridať školenie"
                        Width: =180
                        ZIndex: =2

