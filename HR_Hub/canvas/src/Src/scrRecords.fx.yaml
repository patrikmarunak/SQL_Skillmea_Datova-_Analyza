scrRecords As screen:
    Fill: =RGBA(243, 243, 243, 1)
    OnVisible: |-
        =Set(varNavTag, "recs");
        Set(varSelRecord, Blank())

    frameRecords As groupContainer.horizontalAutoLayoutContainer:
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        Width: =Parent.Width
        ZIndex: =1

        navRailRecords As groupContainer.verticalAutoLayoutContainer:
            BorderColor: =RGBA(225, 225, 225, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FillPortions: =0
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =4
            PaddingBottom: =12
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =12
            Width: =220
            ZIndex: =1

            navBrandRecords As label:
                Color: =RGBA(91, 95, 199, 1)
                FontWeight: =FontWeight.Bold
                Height: =44
                PaddingLeft: =12
                Size: =16
                Text: ="HR Hub"
                ZIndex: =1

            navGalRecords As gallery.galleryVertical:
                Items: =Filter(colNav, varRole <> "employee" || EmpVisible)
                Layout: =Layout.Vertical
                ShowScrollbar: =false
                TemplatePadding: =0
                TemplateSize: =46
                ZIndex: =2

                navItemRecords As label:
                    Color: =If(ThisItem.Tag = varNavTag, RGBA(91, 95, 199, 1), RGBA(36, 36, 36, 1))
                    Fill: =If(ThisItem.Tag = varNavTag, RGBA(237, 237, 237, 1), RGBA(0,0,0,0))
                    FillPortions: =0
                    FontWeight: =If(ThisItem.Tag = varNavTag, FontWeight.Semibold, FontWeight.Normal)
                    Height: =Parent.TemplateHeight
                    OnSelect: =Switch(ThisItem.Tag, "home", Navigate(scrHome, ScreenTransition.None), "emps", Navigate(scrEmployees, ScreenTransition.None), "cat", Navigate(scrCatalog, ScreenTransition.None), "recs", Navigate(scrRecords, ScreenTransition.None), "my", Navigate(scrMyTrainings, ScreenTransition.None), Navigate(scrReports, ScreenTransition.None))
                    PaddingLeft: =12
                    Size: =12
                    Text: =ThisItem.Icon & "   " & ThisItem.Title
                    Width: =Parent.TemplateWidth
                    ZIndex: =1

            navRoleRecords As label:
                Color: =RGBA(97, 97, 97, 1)
                Height: =26
                PaddingLeft: =12
                Size: =10
                Text: |-
                    ="Rola: " & Switch(varRole, "admin", "HR Admin", "manager", "Manažér", "Zamestnanec")
                ZIndex: =3

        mainRecords As groupContainer.verticalAutoLayoutContainer:
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =20
            ZIndex: =2

            hdrRecords As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: =64
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =12
                LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                ZIndex: =1

                hdrTitleRecords As groupContainer.verticalAutoLayoutContainer:
                    LayoutGap: =2
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    ZIndex: =1

                    hdrTitleLblRecords As label:
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =21
                        Text: ="Záznamy školení"
                        ZIndex: =1

                    hdrSubLblRecords As label:
                        Color: =RGBA(97, 97, 97, 1)
                        Height: =20
                        Size: =11
                        Text: =If(varRole = "manager", "Záznamy vašich priamych podriadených.", "Všetky záznamy školení vo firme.")
                        ZIndex: =2

                hdrActionsRecords As groupContainer.horizontalAutoLayoutContainer:
                    FillPortions: =0
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =8
                    LayoutJustifyContent: =LayoutJustifyContent.End
                    Width: =200
                    ZIndex: =2

                    btnAddRec As button:
                        BorderColor: =RGBA(91, 95, 199, 1)
                        Fill: =RGBA(91, 95, 199, 1)
                        FontWeight: =FontWeight.Semibold
                        HoverFill: =RGBA(79, 82, 178, 1)
                        OnSelect: =Set(varEditRecord, Blank()); Set(varPickedEmp, Blank()); Set(varPickedTraining, Blank()); Clear(colPickedEmps); Navigate(scrAddRecord, ScreenTransition.None)
                        PressedFill: =RGBA(79, 82, 178, 1)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =11
                        Text: ="+ Pridať záznam"
                        Width: =180
                        ZIndex: =1

            toolbarRec As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: =44
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =8
                LayoutOverflowX: =LayoutOverflow.Scroll
                ZIndex: =2

                txtSearchRec As text:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    Color: =RGBA(36, 36, 36, 1)
                    HintText: ="Meno zamestnanca (začiatok)…"
                    Size: =11
                    Width: =300
                    ZIndex: =1

                btnAllStatRec As button:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    BorderThickness: =1
                    Color: =If(IsBlank(varStatusFilter), RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
                    Fill: =If(IsBlank(varStatusFilter), RGBA(91, 95, 199, 1), RGBA(255, 255, 255, 1))
                    Height: =34
                    HoverFill: =RGBA(237, 237, 237, 1)
                    OnSelect: =Set(varStatusFilter, Blank())
                    RadiusBottomLeft: =17
                    RadiusBottomRight: =17
                    RadiusTopLeft: =17
                    RadiusTopRight: =17
                    Size: =10
                    Text: ="Všetky stavy"
                    Width: =130
                    ZIndex: =2

                galStatusRec As gallery.galleryHorizontal:
                    Height: =44
                    Items: =colStatuses
                    ShowScrollbar: =false
                    TemplatePadding: =0
                    TemplateSize: =162
                    ZIndex: =3

                    galStatusRecBtn As button:
                        BorderColor: =RGBA(225, 225, 225, 1)
                        BorderThickness: =1
                        Color: =If(varStatusFilter = ThisItem.S, RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
                        Fill: =If(varStatusFilter = ThisItem.S, RGBA(91, 95, 199, 1), RGBA(255, 255, 255, 1))
                        FillPortions: =0
                        Height: =34
                        HoverFill: =RGBA(237, 237, 237, 1)
                        OnSelect: =Set(varStatusFilter, If(varStatusFilter = ThisItem.S, Blank(), ThisItem.S))
                        RadiusBottomLeft: =17
                        RadiusBottomRight: =17
                        RadiusTopLeft: =17
                        RadiusTopRight: =17
                        Size: =9
                        Text: =ThisItem.L
                        Width: =Parent.TemplateWidth - 6
                        Y: =6
                        ZIndex: =1

            lblCountRec As label:
                Color: =RGBA(97, 97, 97, 1)
                Height: =22
                Size: =10
                Text: =CountRows(Filter(colRecords, (varRole = "admin" || ManagerEmail = varCurrentUser.Email) && (IsBlank(varStatusFilter) || LiveStatus = varStatusFilter) && (txtSearchRec.Text = "" || StartsWith(EmployeeName, txtSearchRec.Text)))) & " záznamov"
                ZIndex: =3

            galRecs As gallery.galleryVertical:
                Items: =Sort(Filter(colRecords, (varRole = "admin" || ManagerEmail = varCurrentUser.Email) && (IsBlank(varStatusFilter) || LiveStatus = varStatusFilter) && (txtSearchRec.Text = "" || StartsWith(EmployeeName, txtSearchRec.Text))), CompletionDate, SortOrder.Descending)
                Layout: =Layout.Vertical
                TemplatePadding: =0
                TemplateSize: =60
                ZIndex: =4

                recBgRec As rectangle:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    BorderThickness: =1
                    Fill: =RGBA(255, 255, 255, 1)
                    Height: =Parent.TemplateHeight - 6
                    OnSelect: =Select(Parent)
                    Width: =Parent.TemplateWidth
                    Y: =3
                    ZIndex: =1

                recEmpRec As label:
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =24
                    OnSelect: =Select(Parent)
                    Size: =11
                    Text: =ThisItem.EmployeeName
                    Width: =210
                    X: =16
                    Y: =9
                    ZIndex: =2

                recEmpIdRec As label:
                    Color: =RGBA(97, 97, 97, 1)
                    FillPortions: =0
                    Height: =18
                    OnSelect: =Select(Parent)
                    Size: =9
                    Text: =ThisItem.EmployeeID
                    Width: =210
                    X: =16
                    Y: =33
                    ZIndex: =3

                recTrRec As label:
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =24
                    OnSelect: =Select(Parent)
                    Size: =11
                    Text: =ThisItem.TrainingName
                    Width: =Parent.TemplateWidth - 850
                    X: =236
                    Y: =9
                    ZIndex: =4

                recDatesRec As label:
                    Color: =RGBA(97, 97, 97, 1)
                    FillPortions: =0
                    Height: =18
                    OnSelect: =Select(Parent)
                    Size: =9
                    Text: |-
                        =If(ThisItem.Pl, "Plán: ", "Absolvované: ") & Text(ThisItem.CompletionDate, "d.m.yyyy") & "   Platí do: " & If(IsBlank(ThisItem.ExpirationDate), "—", Text(ThisItem.ExpirationDate, "d.m.yyyy"))
                    Width: =Parent.TemplateWidth - 850
                    X: =236
                    Y: =33
                    ZIndex: =5

                recDoneRec As label:
                    Align: =Align.Center
                    Color: =RGBA(14, 107, 14, 1)
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    OnSelect: |-
                        =Set(varTmpId, ThisItem.ID); Set(varTmpEmp, ThisItem.EmployeeID); Set(varTmpTr, ThisItem.TrainingName); Patch(colRecordsBase, LookUp(colRecordsBase, ID = varTmpId), {Off: 0, Pl: false}); /* LIVE: Patch(TrainingRecords, LookUp(TrainingRecords, ID = varTmpId), {CompletionDate: Today(), Status: {Value: "Valid"}}); */ Collect(colAudit, {ID: Max(colAudit, ID) + 1, Action: "Update", EntityType: "TrainingRecord", EntityID: varTmpEmp, ChangedBy: varCurrentUser.Email, ChangedOn: Now(), Details: "Označené ako absolvované (dnes): " & varTmpTr}); ClearCollect(colRecords,
                            AddColumns(
                                AddColumns(
                                    AddColumns(colRecordsBase,
                                        "EmployeeID", Emp,
                                        "EmployeeName", LookUp(colEmployees, EmployeeID = Emp, FullName),
                                        "DepartmentCode", LookUp(colEmployees, EmployeeID = Emp, DepartmentCode),
                                        "ManagerEmail", LookUp(colEmployees, EmployeeID = Emp, ManagerEmail),
                                        "TrainingName", LookUp(colTrainingsCatalog, ID = Tr, TrainingName),
                                        "TrainingType", LookUp(colTrainingsCatalog, ID = Tr, TrainingType),
                                        "ValidityMonths", LookUp(colTrainingsCatalog, ID = Tr, ValidityMonths),
                                        "CompletionDate", DateAdd(Today(), Off, TimeUnit.Days)
                                    ),
                                    "ExpirationDate", If(Pl || ValidityMonths = 0, Blank(), DateAdd(CompletionDate, ValidityMonths, TimeUnit.Months))
                                ),
                                "LiveStatus", If(
                                    Pl, "Planned",
                                    IsBlank(ExpirationDate), "Valid",
                                    ExpirationDate < Today(), "Expired",
                                    ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days), "Expiring",
                                    "Valid"
                                )
                            )
                        ); Notify("Školenie označené ako absolvované dnes.", NotificationType.Success, 2000)
                    Size: =10
                    Text: ="✓ Absolvované"
                    Visible: =ThisItem.Pl && (varRole = "admin" || (varRole = "manager" && LookUp(colEmployees, EmployeeID = ThisItem.EmployeeID, ManagerEmail) = varCurrentUser.Email))
                    X: =Parent.TemplateWidth - 590
                    Y: =Parent.TemplateHeight/2 - 13
                    ZIndex: =6

                recPillRec As label:
                    Align: =Align.Center
                    Color: =Switch(ThisItem.LiveStatus, "Valid", RGBA(14, 107, 14, 1), "Expiring", RGBA(122, 82, 0, 1), "Expired", RGBA(164, 38, 44, 1), RGBA(77, 77, 77, 1))
                    Fill: =Switch(ThisItem.LiveStatus, "Valid", RGBA(223, 246, 221, 1), "Expiring", RGBA(255, 244, 206, 1), "Expired", RGBA(253, 231, 233, 1), RGBA(237, 237, 237, 1))
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    OnSelect: =Select(Parent)
                    Size: =10
                    Text: =LookUp(colStatuses, S = ThisItem.LiveStatus, L)
                    X: =Parent.TemplateWidth - 420
                    Y: =Parent.TemplateHeight/2 - 13
                    ZIndex: =7

                recCertRec As label:
                    Align: =Align.Center
                    Color: =RGBA(91, 95, 199, 1)
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    OnSelect: =Set(varSelRecord, ThisItem)
                    Size: =10
                    Text: =If(ThisItem.Cert = "", "+ Certifikát", "Certifikát ✓")
                    Visible: =varRole = "admin" || (varRole = "manager" && LookUp(colEmployees, EmployeeID = ThisItem.EmployeeID, ManagerEmail) = varCurrentUser.Email)
                    Width: =130
                    X: =Parent.TemplateWidth - 250
                    Y: =Parent.TemplateHeight/2 - 13
                    ZIndex: =8

                recEditRec As label:
                    Align: =Align.Center
                    Color: =RGBA(91, 95, 199, 1)
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    OnSelect: =Set(varEditRecord, ThisItem); Set(varPickedEmp, LookUp(colEmployees, EmployeeID = ThisItem.EmployeeID)); Set(varPickedTraining, LookUp(colTrainingsCatalog, ID = ThisItem.Tr)); Clear(colPickedEmps); Navigate(scrAddRecord, ScreenTransition.None)
                    Size: =10
                    Text: ="Upraviť"
                    Visible: =varRole = "admin" || (varRole = "manager" && LookUp(colEmployees, EmployeeID = ThisItem.EmployeeID, ManagerEmail) = varCurrentUser.Email)
                    Width: =100
                    X: =Parent.TemplateWidth - 110
                    Y: =Parent.TemplateHeight/2 - 13
                    ZIndex: =9

            certPanelRec As groupContainer.verticalAutoLayoutContainer:
                BorderColor: =RGBA(225, 225, 225, 1)
                BorderThickness: =1
                Fill: =RGBA(255, 255, 255, 1)
                FillPortions: =0
                LayoutAlignItems: =LayoutAlignItems.Stretch
                LayoutGap: =8
                PaddingBottom: =16
                PaddingLeft: =16
                PaddingRight: =16
                PaddingTop: =16
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Visible: =!IsBlank(varSelRecord)
                ZIndex: =5

                certPanelTitleRec As label:
                    FontWeight: =FontWeight.Semibold
                    Height: =24
                    Size: =12
                    Text: ="Certifikát – " & varSelRecord.TrainingName & "  (" & varSelRecord.EmployeeName & ")"
                    ZIndex: =1

                certHostRec As groupContainer.verticalAutoLayoutContainer:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    BorderThickness: =1
                    Fill: =RGBA(237, 237, 237, 1)
                    FillPortions: =0
                    Height: =70
                    LayoutGap: =2
                    PaddingLeft: =12
                    PaddingRight: =12
                    PaddingTop: =10
                    RadiusBottomLeft: =6
                    RadiusBottomRight: =6
                    RadiusTopLeft: =6
                    RadiusTopRight: =6
                    ZIndex: =2

                    certHostHintRec As label:
                        Color: =RGBA(97, 97, 97, 1)
                        Height: =44
                        Size: =10
                        Text: ="📎 Sem v Studiu vlož Attachments DataCard (frmCert/dcAttachRec) naviazanú na TrainingRecords, Item = LookUp(TrainingRecords, ID = varSelRecord.ID)."
                        ZIndex: =1

                certLinkCapRec As label:
                    Color: =RGBA(97, 97, 97, 1)
                    Height: =20
                    Size: =10
                    Text: ="Alebo odkaz na PDF (demo / manuálny fallback)"
                    ZIndex: =3

                txtCertManageRec As text:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    Color: =RGBA(36, 36, 36, 1)
                    Default: =varSelRecord.Cert
                    HintText: ="/sites/HRHub/Certificates/….pdf"
                    Size: =11
                    ZIndex: =4

                certBtnsRec As groupContainer.horizontalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =44
                    LayoutGap: =10
                    LayoutJustifyContent: =LayoutJustifyContent.End
                    PaddingTop: =6
                    ZIndex: =5

                    btnCertCloseRec As button:
                        BorderColor: =RGBA(225, 225, 225, 1)
                        BorderThickness: =1
                        Color: =RGBA(36, 36, 36, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(237, 237, 237, 1)
                        OnSelect: =Set(varSelRecord, Blank())
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =11
                        Text: ="Zavrieť"
                        Width: =110
                        ZIndex: =1

                    btnCertSaveRec As button:
                        BorderColor: =RGBA(91, 95, 199, 1)
                        Fill: =RGBA(91, 95, 199, 1)
                        FontWeight: =FontWeight.Semibold
                        HoverFill: =RGBA(79, 82, 178, 1)
                        OnSelect: |-
                            =Patch(colRecordsBase, LookUp(colRecordsBase, ID = varSelRecord.ID), {Cert: txtCertManageRec.Text}); /* LIVE: Patch(TrainingRecords, LookUp(TrainingRecords, ID = varSelRecord.ID), {Attachments: dcAttachRec.Attachments, CertificateLink: txtCertManageRec.Text}); */ ClearCollect(colRecords,
                                AddColumns(
                                    AddColumns(
                                        AddColumns(colRecordsBase,
                                            "EmployeeID", Emp,
                                            "EmployeeName", LookUp(colEmployees, EmployeeID = Emp, FullName),
                                            "DepartmentCode", LookUp(colEmployees, EmployeeID = Emp, DepartmentCode),
                                            "ManagerEmail", LookUp(colEmployees, EmployeeID = Emp, ManagerEmail),
                                            "TrainingName", LookUp(colTrainingsCatalog, ID = Tr, TrainingName),
                                            "TrainingType", LookUp(colTrainingsCatalog, ID = Tr, TrainingType),
                                            "ValidityMonths", LookUp(colTrainingsCatalog, ID = Tr, ValidityMonths),
                                            "CompletionDate", DateAdd(Today(), Off, TimeUnit.Days)
                                        ),
                                        "ExpirationDate", If(Pl || ValidityMonths = 0, Blank(), DateAdd(CompletionDate, ValidityMonths, TimeUnit.Months))
                                    ),
                                    "LiveStatus", If(
                                        Pl, "Planned",
                                        IsBlank(ExpirationDate), "Valid",
                                        ExpirationDate < Today(), "Expired",
                                        ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days), "Expiring",
                                        "Valid"
                                    )
                                )
                            ); Collect(colAudit, {ID: Max(colAudit, ID) + 1, Action: "Update", EntityType: "TrainingRecord", EntityID: varSelRecord.EmployeeID, ChangedBy: varCurrentUser.Email, ChangedOn: Now(), Details: "Aktualizovaný certifikát: " & varSelRecord.TrainingName}); Notify("Certifikát uložený.", NotificationType.Success, 2000); Set(varSelRecord, Blank())
                        PressedFill: =RGBA(79, 82, 178, 1)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =11
                        Text: ="Uložiť certifikát"
                        Width: =170
                        ZIndex: =2

