scrRecords As screen:
    Fill: =RGBA(245, 245, 245, 1)
    OnVisible: =Set(varNavTag, "recs")

    recRailR As rectangle:
        Fill: =RGBA(255, 255, 255, 1)
        Height: =Parent.Height
        Width: =220
        ZIndex: =1

    lblBrandR As label:
        Color: =RGBA(91, 95, 199, 1)
        FontWeight: =FontWeight.Bold
        PaddingLeft: =20
        Size: =15
        Text: ="HR Hub"
        Width: =200
        Y: =12
        ZIndex: =2

    galNavR As gallery.galleryVertical:
        Height: =Parent.Height - 64
        Items: =Filter(colNav, varRole <> "employee" || EmpVisible)
        ShowScrollbar: =false
        TemplatePadding: =0
        TemplateSize: =46
        Width: =220
        Y: =64
        ZIndex: =3

        lblNavItemR As label:
            Color: =If(ThisItem.Tag = varNavTag, RGBA(91, 95, 199, 1), RGBA(36, 36, 36, 1))
            Fill: =If(ThisItem.Tag = varNavTag, RGBA(237, 237, 237, 1), RGBA(0, 0, 0, 0))
            FontWeight: =If(ThisItem.Tag = varNavTag, FontWeight.Semibold, FontWeight.Normal)
            Height: =Parent.TemplateHeight
            OnSelect: =Switch(ThisItem.Tag, "home", Navigate(scrHome, ScreenTransition.None), "emps", Navigate(scrEmployees, ScreenTransition.None), "cat", Navigate(scrCatalog, ScreenTransition.None), "recs", Navigate(scrRecords, ScreenTransition.None), "my", Navigate(scrMyTrainings, ScreenTransition.None), Navigate(scrReports, ScreenTransition.None))
            PaddingLeft: =20
            Size: =12
            Text: =ThisItem.Icon & "  " & ThisItem.Title
            Width: =Parent.TemplateWidth
            ZIndex: =1

    lblTitleR As label:
        FontWeight: =FontWeight.Bold
        Size: =20
        Text: ="Záznamy školení"
        Width: =600
        X: =250
        Y: =20
        ZIndex: =4

    lblSubR As label:
        Color: =RGBA(92, 92, 92, 1)
        Height: =28
        Size: =11
        Text: ="Manažér vidí len záznamy svojich priamych podriadených (ManagerEmail = aktuálny používateľ)."
        Width: =760
        X: =250
        Y: =58
        ZIndex: =4

    btnAddR As button:
        Fill: =RGBA(91, 95, 199, 1)
        FontWeight: =FontWeight.Semibold
        HoverFill: =RGBA(79, 82, 178, 1)
        OnSelect: =Set(varEditRecord, Blank()); Set(varPickedEmp, Blank()); Set(varPickedTraining, Blank()); Navigate(scrAddRecord, ScreenTransition.None)
        Size: =11
        Text: ="+ Pridať záznam"
        Width: =180
        X: =1156
        Y: =24
        ZIndex: =4

    txtRecSearchR As text:
        BorderColor: =RGBA(209, 209, 209, 1)
        Height: =38
        HintText: ="Meno zamestnanca (začiatok)…"
        Size: =10
        X: =250
        Y: =96
        ZIndex: =4

    btnAllStatR As button:
        BorderColor: =RGBA(209, 209, 209, 1)
        BorderThickness: =1
        Color: =If(IsBlank(varStatusFilter), RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
        Fill: =If(IsBlank(varStatusFilter), RGBA(91, 95, 199, 1), RGBA(255, 255, 255, 1))
        Height: =34
        HoverFill: =RGBA(237, 237, 237, 1)
        OnSelect: =Set(varStatusFilter, Blank())
        RadiusBottomLeft: =17
        RadiusBottomRight: =17
        RadiusTopLeft: =17
        RadiusTopRight: =17
        Size: =10
        Text: ="Všetky stavy"
        Width: =130
        X: =590
        Y: =98
        ZIndex: =4

    galStatusR As gallery.galleryHorizontal:
        Height: =44
        Items: =colStatuses
        ShowScrollbar: =false
        TemplateSize: =160
        Width: =650
        X: =730
        Y: =92
        ZIndex: =4

        btnStatR As button:
            BorderColor: =RGBA(209, 209, 209, 1)
            BorderThickness: =1
            Color: =If(varStatusFilter = ThisItem.S, RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
            Fill: =If(varStatusFilter = ThisItem.S, RGBA(91, 95, 199, 1), RGBA(255, 255, 255, 1))
            Height: =34
            HoverFill: =RGBA(237, 237, 237, 1)
            OnSelect: =Set(varStatusFilter, If(varStatusFilter = ThisItem.S, Blank(), ThisItem.S))
            RadiusBottomLeft: =17
            RadiusBottomRight: =17
            RadiusTopLeft: =17
            RadiusTopRight: =17
            Size: =9
            Text: =ThisItem.L
            Width: =Parent.TemplateWidth - 6
            Y: =6
            ZIndex: =1

    lblRecCountR As label:
        Color: =RGBA(92, 92, 92, 1)
        Height: =24
        Size: =10
        Text: =CountRows(Filter(colRecords, (varRole = "admin" || ManagerEmail = varCurrentUser.Email) && (IsBlank(varStatusFilter) || LiveStatus = varStatusFilter) && (txtRecSearchR.Text = "" || StartsWith(EmployeeName, txtRecSearchR.Text)))) & " záznamov"
        Width: =300
        X: =250
        Y: =142
        ZIndex: =4

    galRecsR As gallery.galleryVertical:
        Height: =560
        Items: =Sort(Filter(colRecords, (varRole = "admin" || ManagerEmail = varCurrentUser.Email) && (IsBlank(varStatusFilter) || LiveStatus = varStatusFilter) && (txtRecSearchR.Text = "" || StartsWith(EmployeeName, txtRecSearchR.Text))), CompletionDate, SortOrder.Descending)
        TemplatePadding: =3
        TemplateSize: =60
        Width: =1086
        X: =250
        Y: =170
        ZIndex: =4

        recRecCardR As rectangle:
            BorderColor: =RGBA(209, 209, 209, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.TemplateHeight - 6
            Width: =Parent.TemplateWidth
            Y: =3
            ZIndex: =1

        lblRecEmpR As label:
            FontWeight: =FontWeight.Semibold
            Height: =26
            Size: =11
            Text: =ThisItem.EmployeeName
            Width: =230
            X: =16
            Y: =8
            ZIndex: =2

        lblRecEmpIdR As label:
            Color: =RGBA(92, 92, 92, 1)
            Height: =20
            Size: =9
            Text: =ThisItem.EmployeeID
            Width: =230
            X: =16
            Y: =32
            ZIndex: =2

        lblRecTrR As label:
            Height: =26
            Size: =11
            Text: =ThisItem.TrainingName
            Width: =330
            X: =260
            Y: =8
            ZIndex: =2

        lblRecDatesR As label:
            Color: =RGBA(92, 92, 92, 1)
            Height: =20
            Size: =9
            Text: |-
                =If(ThisItem.Pl, "Plán: ", "Absolvované: ") & Text(ThisItem.CompletionDate, "d.m.yyyy") & "   Platí do: " & If(IsBlank(ThisItem.ExpirationDate), "—", Text(ThisItem.ExpirationDate, "d.m.yyyy"))
            Width: =360
            X: =260
            Y: =32
            ZIndex: =2

        lblRecPillR As label:
            Align: =Align.Center
            Color: =Switch(ThisItem.LiveStatus, "Valid", RGBA(14, 107, 14, 1), "Expiring", RGBA(122, 82, 0, 1), "Expired", RGBA(164, 38, 44, 1), RGBA(77, 77, 77, 1))
            Fill: =Switch(ThisItem.LiveStatus, "Valid", RGBA(223, 246, 221, 1), "Expiring", RGBA(255, 244, 206, 1), "Expired", RGBA(253, 231, 233, 1), RGBA(237, 237, 237, 1))
            FontWeight: =FontWeight.Semibold
            Height: =26
            Size: =10
            Text: =LookUp(colStatuses, S = ThisItem.LiveStatus, L)
            X: =870
            Y: =15
            ZIndex: =2

        lblRecCertR As label:
            Color: =RGBA(91, 95, 199, 1)
            Height: =26
            Size: =10
            Text: =If(ThisItem.Cert = "", "", "PDF")
            Width: =50
            X: =1030
            Y: =15
            ZIndex: =2

        lblRecEditR As label:
            Color: =RGBA(91, 95, 199, 1)
            FontWeight: =FontWeight.Semibold
            Height: =26
            OnSelect: =Set(varEditRecord, ThisItem); Set(varPickedEmp, LookUp(colEmployees, EmployeeID = ThisItem.EmployeeID)); Set(varPickedTraining, LookUp(colTrainingsCatalog, TrainingName = ThisItem.TrainingName)); Navigate(scrAddRecord, ScreenTransition.None)
            Size: =10
            Text: ="Upraviť"
            Visible: =varRole = "admin" || (varRole = "manager" && LookUp(colEmployees, EmployeeID = ThisItem.EmployeeID, ManagerEmail) = varCurrentUser.Email)
            Width: =70
            X: =1000
            Y: =15
            ZIndex: =3

