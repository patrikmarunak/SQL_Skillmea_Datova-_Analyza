scrMyTrainings As screen:
    Fill: =RGBA(243, 243, 243, 1)
    OnVisible: =Set(varNavTag, "my")

    frameMyTrainings As groupContainer.horizontalAutoLayoutContainer:
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        Width: =Parent.Width
        ZIndex: =1

        navRailMyTrainings As groupContainer.verticalAutoLayoutContainer:
            BorderColor: =RGBA(225, 225, 225, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FillPortions: =0
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =4
            PaddingBottom: =12
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =12
            Width: =220
            ZIndex: =1

            navBrandMyTrainings As label:
                Color: =RGBA(91, 95, 199, 1)
                FontWeight: =FontWeight.Bold
                Height: =44
                PaddingLeft: =12
                Size: =16
                Text: ="HR Hub"
                ZIndex: =1

            navGalMyTrainings As gallery.galleryVertical:
                Items: =Filter(colNav, varRole <> "employee" || EmpVisible)
                Layout: =Layout.Vertical
                ShowScrollbar: =false
                TemplatePadding: =0
                TemplateSize: =46
                ZIndex: =2

                navItemMyTrainings As label:
                    Color: =If(ThisItem.Tag = varNavTag, RGBA(91, 95, 199, 1), RGBA(36, 36, 36, 1))
                    Fill: =If(ThisItem.Tag = varNavTag, RGBA(237, 237, 237, 1), RGBA(0,0,0,0))
                    FillPortions: =0
                    FontWeight: =If(ThisItem.Tag = varNavTag, FontWeight.Semibold, FontWeight.Normal)
                    Height: =Parent.TemplateHeight
                    OnSelect: =Switch(ThisItem.Tag, "home", Navigate(scrHome, ScreenTransition.None), "emps", Navigate(scrEmployees, ScreenTransition.None), "cat", Navigate(scrCatalog, ScreenTransition.None), "recs", Navigate(scrRecords, ScreenTransition.None), "my", Navigate(scrMyTrainings, ScreenTransition.None), Navigate(scrReports, ScreenTransition.None))
                    PaddingLeft: =12
                    Size: =12
                    Text: =ThisItem.Icon & "   " & ThisItem.Title
                    Width: =Parent.TemplateWidth
                    ZIndex: =1

            navRoleMyTrainings As label:
                Color: =RGBA(97, 97, 97, 1)
                Height: =26
                PaddingLeft: =12
                Size: =10
                Text: |-
                    ="Rola: " & Switch(varRole, "admin", "HR Admin", "manager", "Manažér", "Zamestnanec")
                ZIndex: =3

        mainMyTrainings As groupContainer.verticalAutoLayoutContainer:
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =20
            ZIndex: =2

            hdrMyTrainings As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: =64
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =12
                LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                ZIndex: =1

                hdrTitleMyTrainings As groupContainer.verticalAutoLayoutContainer:
                    LayoutGap: =2
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    ZIndex: =1

                    hdrTitleLblMyTrainings As label:
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =21
                        Text: ="Moje školenia"
                        ZIndex: =1

                    hdrSubLblMyTrainings As label:
                        Color: =RGBA(97, 97, 97, 1)
                        Height: =20
                        Size: =11
                        Text: |-
                            ="Prihlásený: " & varCurrentUser.FullName & " (" & varCurrentUser.Email & ")"
                        ZIndex: =2

            banExpMy As label:
                Color: =RGBA(164, 38, 44, 1)
                Fill: =RGBA(253, 231, 233, 1)
                FontWeight: =FontWeight.Semibold
                PaddingLeft: =16
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Size: =11
                Text: ="Máte " & CountRows(Filter(colRecords, EmployeeID = varCurrentUser.EmployeeID && LiveStatus = "Expired")) & " exspirované školenia. Kontaktujte HR oddelenie a dohodnite si náhradný termín."
                Visible: =CountRows(Filter(colRecords, EmployeeID = varCurrentUser.EmployeeID && LiveStatus = "Expired")) > 0
                ZIndex: =2

            banWarnMy As label:
                Color: =RGBA(122, 82, 0, 1)
                Fill: =RGBA(255, 244, 206, 1)
                FontWeight: =FontWeight.Semibold
                PaddingLeft: =16
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Size: =11
                Text: ="Čoskoro vám exspiruje " & CountRows(Filter(colRecords, EmployeeID = varCurrentUser.EmployeeID && LiveStatus = "Expiring")) & " školení – termíny nájdete v zozname nižšie."
                Visible: =CountRows(Filter(colRecords, EmployeeID = varCurrentUser.EmployeeID && LiveStatus = "Expiring")) > 0
                ZIndex: =3

            galMy As gallery.galleryVertical:
                Items: =Sort(Filter(colRecords, EmployeeID = varCurrentUser.EmployeeID), CompletionDate, SortOrder.Descending)
                Layout: =Layout.Vertical
                TemplatePadding: =0
                TemplateSize: =60
                ZIndex: =4

                myBg As rectangle:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    BorderThickness: =1
                    Fill: =RGBA(255, 255, 255, 1)
                    Height: =Parent.TemplateHeight - 8
                    Width: =Parent.TemplateWidth
                    Y: =4
                    ZIndex: =1

                myTr As label:
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =24
                    Size: =11
                    Text: =ThisItem.TrainingName
                    Width: =Parent.TemplateWidth - 360
                    X: =16
                    Y: =12
                    ZIndex: =2

                myDates As label:
                    Color: =RGBA(97, 97, 97, 1)
                    FillPortions: =0
                    Height: =20
                    Size: =9
                    Text: |-
                        =If(ThisItem.Pl, "Plán: ", "Absolvované: ") & Text(ThisItem.CompletionDate, "d.m.yyyy") & "   Platí do: " & If(IsBlank(ThisItem.ExpirationDate), "—", Text(ThisItem.ExpirationDate, "d.m.yyyy"))
                    Width: =Parent.TemplateWidth - 360
                    X: =16
                    Y: =36
                    ZIndex: =3

                myPill As label:
                    Align: =Align.Center
                    Color: =Switch(ThisItem.LiveStatus, "Valid", RGBA(14, 107, 14, 1), "Expiring", RGBA(122, 82, 0, 1), "Expired", RGBA(164, 38, 44, 1), RGBA(77, 77, 77, 1))
                    Fill: =Switch(ThisItem.LiveStatus, "Valid", RGBA(223, 246, 221, 1), "Expiring", RGBA(255, 244, 206, 1), "Expired", RGBA(253, 231, 233, 1), RGBA(237, 237, 237, 1))
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    Size: =10
                    Text: =LookUp(colStatuses, S = ThisItem.LiveStatus, L)
                    X: =Parent.TemplateWidth - 340
                    Y: =Parent.TemplateHeight/2 - 13
                    ZIndex: =4

                myCert As label:
                    Align: =Align.Center
                    Color: =RGBA(91, 95, 199, 1)
                    FillPortions: =0
                    Height: =26
                    Size: =10
                    Text: =If(ThisItem.Cert = "", "", "Stiahnuť certifikát (PDF)")
                    Width: =170
                    X: =Parent.TemplateWidth - 180
                    Y: =Parent.TemplateHeight/2 - 13
                    ZIndex: =5

            emptyMy As label:
                Color: =RGBA(97, 97, 97, 1)
                Height: =30
                Text: ="Zatiaľ žiadne školenia. Po absolvovaní vám ich HR zaznamená aj s certifikátom."
                Visible: =CountRows(Filter(colRecords, EmployeeID = varCurrentUser.EmployeeID)) = 0
                ZIndex: =5

