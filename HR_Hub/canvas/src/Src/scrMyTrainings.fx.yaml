scrMyTrainings As screen:
    Fill: =RGBA(245, 245, 245, 1)
    OnVisible: =Set(varNavTag, "my")

    recRailM As rectangle:
        Fill: =RGBA(255, 255, 255, 1)
        Height: =Parent.Height
        Width: =220
        ZIndex: =1

    lblBrandM As label:
        Color: =RGBA(91, 95, 199, 1)
        FontWeight: =FontWeight.Bold
        PaddingLeft: =20
        Size: =15
        Text: ="HR Hub"
        Width: =200
        Y: =12
        ZIndex: =2

    galNavM As gallery.galleryVertical:
        Height: =Parent.Height - 64
        Items: =Filter(colNav, varRole <> "employee" || EmpVisible)
        ShowScrollbar: =false
        TemplatePadding: =0
        TemplateSize: =46
        Width: =220
        Y: =64
        ZIndex: =3

        lblNavItemM As label:
            Color: =If(ThisItem.Tag = varNavTag, RGBA(91, 95, 199, 1), RGBA(36, 36, 36, 1))
            Fill: =If(ThisItem.Tag = varNavTag, RGBA(237, 237, 237, 1), RGBA(0, 0, 0, 0))
            FontWeight: =If(ThisItem.Tag = varNavTag, FontWeight.Semibold, FontWeight.Normal)
            Height: =Parent.TemplateHeight
            OnSelect: =Switch(ThisItem.Tag, "home", Navigate(scrHome, ScreenTransition.None), "emps", Navigate(scrEmployees, ScreenTransition.None), "cat", Navigate(scrCatalog, ScreenTransition.None), "recs", Navigate(scrRecords, ScreenTransition.None), "my", Navigate(scrMyTrainings, ScreenTransition.None), Navigate(scrReports, ScreenTransition.None))
            PaddingLeft: =20
            Size: =12
            Text: =ThisItem.Icon & "  " & ThisItem.Title
            Width: =Parent.TemplateWidth
            ZIndex: =1

    lblTitleM As label:
        FontWeight: =FontWeight.Bold
        Size: =20
        Text: ="Moje školenia"
        Width: =600
        X: =250
        Y: =20
        ZIndex: =4

    lblSubM As label:
        Color: =RGBA(92, 92, 92, 1)
        Height: =28
        Size: =11
        Text: |-
            ="Prihlásený: " & varCurrentUser.FullName & " (" & varCurrentUser.Email & ")"
        Width: =760
        X: =250
        Y: =58
        ZIndex: =4

    lblBanExpM As label:
        Color: =RGBA(164, 38, 44, 1)
        Fill: =RGBA(253, 231, 233, 1)
        FontWeight: =FontWeight.Semibold
        PaddingLeft: =16
        Size: =11
        Text: ="Máte " & CountRows(Filter(colRecords, EmployeeID = varCurrentUser.EmployeeID && LiveStatus = "Expired")) & " exspirované školenia. Kontaktujte HR oddelenie a dohodnite si náhradný termín."
        Visible: =CountRows(Filter(colRecords, EmployeeID = varCurrentUser.EmployeeID && LiveStatus = "Expired")) > 0
        Width: =1086
        X: =250
        Y: =96
        ZIndex: =4

    lblBanWarnM As label:
        Color: =RGBA(122, 82, 0, 1)
        Fill: =RGBA(255, 244, 206, 1)
        FontWeight: =FontWeight.Semibold
        PaddingLeft: =16
        Size: =11
        Text: ="Čoskoro vám exspiruje " & CountRows(Filter(colRecords, EmployeeID = varCurrentUser.EmployeeID && LiveStatus = "Expiring")) & " školení – termíny nájdete v zozname nižšie."
        Visible: =CountRows(Filter(colRecords, EmployeeID = varCurrentUser.EmployeeID && LiveStatus = "Expiring")) > 0
        Width: =1086
        X: =250
        Y: =If(CountRows(Filter(colRecords, EmployeeID = varCurrentUser.EmployeeID && LiveStatus = "Expired")) > 0, 142, 96)
        ZIndex: =4

    galMyM As gallery.galleryVertical:
        Height: =530
        Items: =Sort(Filter(colRecords, EmployeeID = varCurrentUser.EmployeeID), CompletionDate, SortOrder.Descending)
        TemplatePadding: =3
        TemplateSize: =60
        Width: =1086
        X: =250
        Y: =196
        ZIndex: =4

        recMyCardM As rectangle:
            BorderColor: =RGBA(209, 209, 209, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.TemplateHeight - 6
            Width: =Parent.TemplateWidth
            Y: =3
            ZIndex: =1

        lblMyTrM As label:
            FontWeight: =FontWeight.Semibold
            Height: =26
            Size: =11
            Text: =ThisItem.TrainingName
            Width: =420
            X: =16
            Y: =8
            ZIndex: =2

        lblMyDatesM As label:
            Color: =RGBA(92, 92, 92, 1)
            Height: =20
            Size: =9
            Text: |-
                =If(ThisItem.Pl, "Plán: ", "Absolvované: ") & Text(ThisItem.CompletionDate, "d.m.yyyy") & "   Platí do: " & If(IsBlank(ThisItem.ExpirationDate), "—", Text(ThisItem.ExpirationDate, "d.m.yyyy"))
            Width: =400
            X: =16
            Y: =32
            ZIndex: =2

        lblMyPillM As label:
            Align: =Align.Center
            Color: =Switch(ThisItem.LiveStatus, "Valid", RGBA(14, 107, 14, 1), "Expiring", RGBA(122, 82, 0, 1), "Expired", RGBA(164, 38, 44, 1), RGBA(77, 77, 77, 1))
            Fill: =Switch(ThisItem.LiveStatus, "Valid", RGBA(223, 246, 221, 1), "Expiring", RGBA(255, 244, 206, 1), "Expired", RGBA(253, 231, 233, 1), RGBA(237, 237, 237, 1))
            FontWeight: =FontWeight.Semibold
            Height: =26
            Size: =10
            Text: =LookUp(colStatuses, S = ThisItem.LiveStatus, L)
            X: =760
            Y: =15
            ZIndex: =2

        lblMyCertM As label:
            Color: =RGBA(91, 95, 199, 1)
            Height: =26
            Size: =10
            Text: =If(ThisItem.Cert = "", "", "Stiahnuť certifikát (PDF)")
            Width: =200
            X: =930
            Y: =15
            ZIndex: =2

