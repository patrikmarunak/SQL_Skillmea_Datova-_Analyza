scrEmployeeDetail As screen:
    Fill: =RGBA(243, 243, 243, 1)
    OnVisible: |-
        =Set(varNavTag, "emps");
        Set(varTab, "overview")

    frameEmployeeDetail As groupContainer.horizontalAutoLayoutContainer:
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        Width: =Parent.Width
        ZIndex: =1

        navRailEmployeeDetail As groupContainer.verticalAutoLayoutContainer:
            BorderColor: =RGBA(225, 225, 225, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FillPortions: =0
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =4
            PaddingBottom: =12
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =12
            Width: =220
            ZIndex: =1

            navBrandEmployeeDetail As label:
                Color: =RGBA(91, 95, 199, 1)
                FontWeight: =FontWeight.Bold
                Height: =44
                PaddingLeft: =12
                Size: =16
                Text: ="HR Hub"
                ZIndex: =1

            navGalEmployeeDetail As gallery.galleryVertical:
                Items: =Filter(colNav, varRole <> "employee" || EmpVisible)
                Layout: =Layout.Vertical
                ShowScrollbar: =false
                TemplatePadding: =0
                TemplateSize: =46
                ZIndex: =2

                navItemEmployeeDetail As label:
                    Color: =If(ThisItem.Tag = varNavTag, RGBA(91, 95, 199, 1), RGBA(36, 36, 36, 1))
                    Fill: =If(ThisItem.Tag = varNavTag, RGBA(237, 237, 237, 1), RGBA(0,0,0,0))
                    FillPortions: =0
                    FontWeight: =If(ThisItem.Tag = varNavTag, FontWeight.Semibold, FontWeight.Normal)
                    Height: =Parent.TemplateHeight
                    OnSelect: =Switch(ThisItem.Tag, "home", Navigate(scrHome, ScreenTransition.None), "emps", Navigate(scrEmployees, ScreenTransition.None), "cat", Navigate(scrCatalog, ScreenTransition.None), "recs", Navigate(scrRecords, ScreenTransition.None), "my", Navigate(scrMyTrainings, ScreenTransition.None), Navigate(scrReports, ScreenTransition.None))
                    PaddingLeft: =12
                    Size: =12
                    Text: =ThisItem.Icon & "   " & ThisItem.Title
                    Width: =Parent.TemplateWidth
                    ZIndex: =1

            navRoleEmployeeDetail As label:
                Color: =RGBA(97, 97, 97, 1)
                Height: =26
                PaddingLeft: =12
                Size: =10
                Text: |-
                    ="Rola: " & Switch(varRole, "admin", "HR Admin", "manager", "Manažér", "Zamestnanec")
                ZIndex: =3

        mainEmployeeDetail As groupContainer.verticalAutoLayoutContainer:
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =20
            ZIndex: =2

            hdrEmployeeDetail As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: =64
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =12
                LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                ZIndex: =1

                hdrTitleEmployeeDetail As groupContainer.verticalAutoLayoutContainer:
                    LayoutGap: =2
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    ZIndex: =1

                    hdrTitleLblEmployeeDetail As label:
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =21
                        Text: =varSelEmployee.FullName
                        ZIndex: =1

                    hdrSubLblEmployeeDetail As label:
                        Color: =RGBA(97, 97, 97, 1)
                        Height: =20
                        Size: =11
                        Text: =varSelEmployee.Position & " · " & varSelEmployee.Department & " · " & varSelEmployee.EmployeeID
                        ZIndex: =2

                hdrActionsEmployeeDetail As groupContainer.horizontalAutoLayoutContainer:
                    FillPortions: =0
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =8
                    LayoutJustifyContent: =LayoutJustifyContent.End
                    Width: =290
                    ZIndex: =2

                    btnEditDetail As button:
                        BorderColor: =RGBA(91, 95, 199, 1)
                        Fill: =RGBA(91, 95, 199, 1)
                        FontWeight: =FontWeight.Semibold
                        HoverFill: =RGBA(79, 82, 178, 1)
                        OnSelect: =Set(varEditEmployee, varSelEmployee); Set(varEmpDept, LookUp(colDepartments, DepartmentName = varSelEmployee.Department)); Set(varEmpPos, LookUp(colPositions, PositionName = varSelEmployee.Position)); Set(varEmpStatus, varSelEmployee.Status); Navigate(scrEmployeeForm, ScreenTransition.None)
                        PressedFill: =RGBA(79, 82, 178, 1)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =11
                        Text: ="Upraviť profil"
                        Visible: =varRole = "admin"
                        Width: =130
                        ZIndex: =1

                    btnDeactDetail As button:
                        BorderColor: =RGBA(164, 38, 44, 1)
                        BorderThickness: =1
                        Color: =RGBA(164, 38, 44, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FontWeight: =FontWeight.Semibold
                        HoverFill: =RGBA(253, 231, 233, 1)
                        OnSelect: |-
                            =Patch(colEmployees, LookUp(colEmployees, EmployeeID = varSelEmployee.EmployeeID), {Status: "Inactive"}); Set(varSelEmployee, LookUp(colEmployees, EmployeeID = varSelEmployee.EmployeeID)); Collect(colAudit, {ID: Max(colAudit, ID) + 1, Action: "Update", EntityType: "Employee", EntityID: varSelEmployee.EmployeeID, ChangedBy: varCurrentUser.Email, ChangedOn: Now(), Details: "Zmena stavu zamestnanca " & varSelEmployee.FullName & " na Inactive (soft-delete)."}); /* LIVE: Patch(Employees, LookUp(Employees, EmployeeID = varSelEmployee.EmployeeID), {Status: {Value:"Inactive"}}); Patch(AuditLog, Defaults(AuditLog), {Title:"Update", EntityType:{Value:"Employee"}, EntityID: varSelEmployee.EmployeeID, ChangedBy: User().Email, ChangedOn: Now(), Details:"soft-delete"}); */ Notify("Zamestnanec bol deaktivovaný (soft-delete, záznamy ostávajú).", NotificationType.Success, 2500)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =11
                        Text: ="Deaktivovať"
                        Visible: =varRole = "admin" && varSelEmployee.Status = "Active"
                        Width: =140
                        ZIndex: =2

            tabsDetail As groupContainer.horizontalAutoLayoutContainer:
                BorderColor: =RGBA(225, 225, 225, 1)
                FillPortions: =0
                Height: =44
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =4
                ZIndex: =2

                tabOverview As button:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    BorderThickness: =0
                    Color: =If(varTab = "overview", RGBA(91, 95, 199, 1), RGBA(97, 97, 97, 1))
                    Fill: =RGBA(0,0,0,0)
                    FontWeight: =If(varTab = "overview", FontWeight.Semibold, FontWeight.Normal)
                    HoverFill: =RGBA(237, 237, 237, 1)
                    OnSelect: =Set(varTab, "overview")
                    RadiusBottomLeft: =6
                    RadiusBottomRight: =6
                    RadiusTopLeft: =6
                    RadiusTopRight: =6
                    Size: =12
                    Text: ="Prehľad"
                    Width: =130
                    ZIndex: =1

                tabTrainings As button:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    BorderThickness: =0
                    Color: =If(varTab = "trainings", RGBA(91, 95, 199, 1), RGBA(97, 97, 97, 1))
                    Fill: =RGBA(0,0,0,0)
                    FontWeight: =If(varTab = "trainings", FontWeight.Semibold, FontWeight.Normal)
                    HoverFill: =RGBA(237, 237, 237, 1)
                    OnSelect: =Set(varTab, "trainings")
                    RadiusBottomLeft: =6
                    RadiusBottomRight: =6
                    RadiusTopLeft: =6
                    RadiusTopRight: =6
                    Size: =12
                    Text: ="Školenia"
                    Width: =130
                    ZIndex: =2

                tabCerts As button:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    BorderThickness: =0
                    Color: =If(varTab = "certificates", RGBA(91, 95, 199, 1), RGBA(97, 97, 97, 1))
                    Fill: =RGBA(0,0,0,0)
                    FontWeight: =If(varTab = "certificates", FontWeight.Semibold, FontWeight.Normal)
                    HoverFill: =RGBA(237, 237, 237, 1)
                    OnSelect: =Set(varTab, "certificates")
                    RadiusBottomLeft: =6
                    RadiusBottomRight: =6
                    RadiusTopLeft: =6
                    RadiusTopRight: =6
                    Size: =12
                    Text: ="Certifikáty"
                    Width: =130
                    ZIndex: =3

                tabAudit As button:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    BorderThickness: =0
                    Color: =If(varTab = "audit", RGBA(91, 95, 199, 1), RGBA(97, 97, 97, 1))
                    Fill: =RGBA(0,0,0,0)
                    FontWeight: =If(varTab = "audit", FontWeight.Semibold, FontWeight.Normal)
                    HoverFill: =RGBA(237, 237, 237, 1)
                    OnSelect: =Set(varTab, "audit")
                    RadiusBottomLeft: =6
                    RadiusBottomRight: =6
                    RadiusTopLeft: =6
                    RadiusTopRight: =6
                    Size: =12
                    Text: ="História zmien"
                    Width: =130
                    ZIndex: =4

            ovCard As groupContainer.verticalAutoLayoutContainer:
                BorderColor: =RGBA(225, 225, 225, 1)
                BorderThickness: =1
                Fill: =RGBA(255, 255, 255, 1)
                LayoutAlignItems: =LayoutAlignItems.Stretch
                LayoutGap: =8
                PaddingBottom: =16
                PaddingLeft: =16
                PaddingRight: =16
                PaddingTop: =16
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Visible: =varTab = "overview"
                ZIndex: =3

                infoRow0 As groupContainer.horizontalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =30
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =8
                    ZIndex: =1

                    infoLab0 As label:
                        Color: =RGBA(97, 97, 97, 1)
                        Size: =11
                        Text: ="E-mail"
                        ZIndex: =1

                    infoVal0 As label:
                        FillPortions: =1
                        Size: =11
                        Text: =varSelEmployee.Email
                        ZIndex: =2

                infoRow1 As groupContainer.horizontalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =30
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =8
                    ZIndex: =2

                    infoLab1 As label:
                        Color: =RGBA(97, 97, 97, 1)
                        Size: =11
                        Text: ="Oddelenie"
                        ZIndex: =1

                    infoVal1 As label:
                        FillPortions: =1
                        Size: =11
                        Text: =varSelEmployee.Department
                        ZIndex: =2

                infoRow2 As groupContainer.horizontalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =30
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =8
                    ZIndex: =3

                    infoLab2 As label:
                        Color: =RGBA(97, 97, 97, 1)
                        Size: =11
                        Text: ="Pozícia"
                        ZIndex: =1

                    infoVal2 As label:
                        FillPortions: =1
                        Size: =11
                        Text: =varSelEmployee.Position
                        ZIndex: =2

                infoRow3 As groupContainer.horizontalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =30
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =8
                    ZIndex: =4

                    infoLab3 As label:
                        Color: =RGBA(97, 97, 97, 1)
                        Size: =11
                        Text: ="Manažér"
                        ZIndex: =1

                    infoVal3 As label:
                        FillPortions: =1
                        Size: =11
                        Text: =If(varSelEmployee.ManagerEmail = "", "—", varSelEmployee.ManagerEmail)
                        ZIndex: =2

                infoRow4 As groupContainer.horizontalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =30
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =8
                    ZIndex: =5

                    infoLab4 As label:
                        Color: =RGBA(97, 97, 97, 1)
                        Size: =11
                        Text: ="Dátum nástupu"
                        ZIndex: =1

                    infoVal4 As label:
                        FillPortions: =1
                        Size: =11
                        Text: =Text(varSelEmployee.HireDate, "d.m.yyyy")
                        ZIndex: =2

                infoRow5 As groupContainer.horizontalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =30
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =8
                    ZIndex: =6

                    infoLab5 As label:
                        Color: =RGBA(97, 97, 97, 1)
                        Size: =11
                        Text: ="Osobné číslo"
                        ZIndex: =1

                    infoVal5 As label:
                        FillPortions: =1
                        Size: =11
                        Text: =varSelEmployee.EmployeeID
                        ZIndex: =2

            galRecsDetail As gallery.galleryVertical:
                Items: =Sort(Filter(colRecords, EmployeeID = varSelEmployee.EmployeeID), CompletionDate, SortOrder.Descending)
                Layout: =Layout.Vertical
                TemplatePadding: =0
                TemplateSize: =60
                Visible: =varTab = "trainings"
                ZIndex: =4

                recBgDet As rectangle:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    BorderThickness: =1
                    Fill: =RGBA(255, 255, 255, 1)
                    Height: =Parent.TemplateHeight - 6
                    OnSelect: =Select(Parent)
                    Width: =Parent.TemplateWidth
                    Y: =3
                    ZIndex: =1

                recTrDet As label:
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =24
                    OnSelect: =Select(Parent)
                    Size: =11
                    Text: =ThisItem.TrainingName
                    Width: =320
                    X: =16
                    Y: =9
                    ZIndex: =2

                recDatesDet As label:
                    Color: =RGBA(97, 97, 97, 1)
                    FillPortions: =0
                    Height: =18
                    OnSelect: =Select(Parent)
                    Size: =9
                    Text: |-
                        =If(ThisItem.Pl, "Plán: ", "Absolvované: ") & Text(ThisItem.CompletionDate, "d.m.yyyy") & "   Platí do: " & If(IsBlank(ThisItem.ExpirationDate), "—", Text(ThisItem.ExpirationDate, "d.m.yyyy"))
                    Width: =360
                    X: =16
                    Y: =33
                    ZIndex: =3

                recPillDet As label:
                    Align: =Align.Center
                    Color: =Switch(ThisItem.LiveStatus, "Valid", RGBA(14, 107, 14, 1), "Expiring", RGBA(122, 82, 0, 1), "Expired", RGBA(164, 38, 44, 1), RGBA(77, 77, 77, 1))
                    Fill: =Switch(ThisItem.LiveStatus, "Valid", RGBA(223, 246, 221, 1), "Expiring", RGBA(255, 244, 206, 1), "Expired", RGBA(253, 231, 233, 1), RGBA(237, 237, 237, 1))
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    OnSelect: =Select(Parent)
                    Size: =10
                    Text: =LookUp(colStatuses, S = ThisItem.LiveStatus, L)
                    X: =Parent.TemplateWidth - 330
                    Y: =Parent.TemplateHeight/2 - 13
                    ZIndex: =4

                recCertDet As label:
                    Align: =Align.Center
                    Color: =RGBA(91, 95, 199, 1)
                    FillPortions: =0
                    Height: =26
                    Size: =10
                    Text: =If(ThisItem.Cert = "", "", "PDF")
                    Width: =60
                    X: =Parent.TemplateWidth - 168
                    Y: =Parent.TemplateHeight/2 - 13
                    ZIndex: =5

                recDoneDet As label:
                    Align: =Align.Center
                    Color: =RGBA(14, 107, 14, 1)
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    OnSelect: |-
                        =Set(varTmpId, ThisItem.ID); Set(varTmpEmp, ThisItem.EmployeeID); Set(varTmpTr, ThisItem.TrainingName); Patch(colRecordsBase, LookUp(colRecordsBase, ID = varTmpId), {Off: 0, Pl: false}); /* LIVE: Patch(TrainingRecords, LookUp(TrainingRecords, ID = varTmpId), {CompletionDate: Today(), Status: {Value: "Valid"}}); */ Collect(colAudit, {ID: Max(colAudit, ID) + 1, Action: "Update", EntityType: "TrainingRecord", EntityID: varTmpEmp, ChangedBy: varCurrentUser.Email, ChangedOn: Now(), Details: "Označené ako absolvované (dnes): " & varTmpTr}); ClearCollect(colRecords,
                            AddColumns(
                                AddColumns(
                                    AddColumns(colRecordsBase,
                                        "EmployeeID", Emp,
                                        "EmployeeName", LookUp(colEmployees, EmployeeID = Emp, FullName),
                                        "DepartmentCode", LookUp(colEmployees, EmployeeID = Emp, DepartmentCode),
                                        "ManagerEmail", LookUp(colEmployees, EmployeeID = Emp, ManagerEmail),
                                        "TrainingName", LookUp(colTrainingsCatalog, ID = Tr, TrainingName),
                                        "TrainingType", LookUp(colTrainingsCatalog, ID = Tr, TrainingType),
                                        "ValidityMonths", LookUp(colTrainingsCatalog, ID = Tr, ValidityMonths),
                                        "CompletionDate", DateAdd(Today(), Off, TimeUnit.Days)
                                    ),
                                    "ExpirationDate", If(Pl || ValidityMonths = 0, Blank(), DateAdd(CompletionDate, ValidityMonths, TimeUnit.Months))
                                ),
                                "LiveStatus", If(
                                    Pl, "Planned",
                                    IsBlank(ExpirationDate), "Valid",
                                    ExpirationDate < Today(), "Expired",
                                    ExpirationDate <= DateAdd(Today(), 30, TimeUnit.Days), "Expiring",
                                    "Valid"
                                )
                            )
                        ); Notify("Školenie označené ako absolvované dnes.", NotificationType.Success, 2000)
                    Size: =10
                    Text: ="✓ Absolvované"
                    Visible: =ThisItem.Pl && (varRole = "admin" || (varRole = "manager" && LookUp(colEmployees, EmployeeID = ThisItem.EmployeeID, ManagerEmail) = varCurrentUser.Email))
                    Width: =140
                    X: =Parent.TemplateWidth - 480
                    Y: =Parent.TemplateHeight/2 - 13
                    ZIndex: =6

                recEditDet As label:
                    Align: =Align.Center
                    Color: =RGBA(91, 95, 199, 1)
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    OnSelect: =Set(varEditRecord, ThisItem); Set(varPickedEmp, LookUp(colEmployees, EmployeeID = ThisItem.EmployeeID)); Set(varPickedTraining, LookUp(colTrainingsCatalog, ID = ThisItem.Tr)); Clear(colPickedEmps); Navigate(scrAddRecord, ScreenTransition.None)
                    Size: =10
                    Text: ="Upraviť"
                    Visible: =varRole = "admin" || (varRole = "manager" && LookUp(colEmployees, EmployeeID = ThisItem.EmployeeID, ManagerEmail) = varCurrentUser.Email)
                    Width: =90
                    X: =Parent.TemplateWidth - 100
                    Y: =Parent.TemplateHeight/2 - 13
                    ZIndex: =7

            galCertsDetail As gallery.galleryVertical:
                Items: =Filter(colRecords, EmployeeID = varSelEmployee.EmployeeID && Cert <> "")
                Layout: =Layout.Vertical
                TemplatePadding: =0
                TemplateSize: =64
                Visible: =varTab = "certificates"
                ZIndex: =5

                certBg As rectangle:
                    BorderColor: =RGBA(225, 225, 225, 1)
                    BorderThickness: =1
                    Fill: =RGBA(255, 255, 255, 1)
                    Height: =Parent.TemplateHeight - 8
                    Width: =Parent.TemplateWidth
                    Y: =4
                    ZIndex: =1

                certName As label:
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =24
                    Size: =11
                    Text: =ThisItem.TrainingName
                    Width: =Parent.TemplateWidth - 180
                    X: =16
                    Y: =12
                    ZIndex: =2

                certExp As label:
                    Color: =RGBA(97, 97, 97, 1)
                    FillPortions: =0
                    Height: =20
                    Size: =9
                    Text: ="platné do " & If(IsBlank(ThisItem.ExpirationDate), "—", Text(ThisItem.ExpirationDate, "d.m.yyyy"))
                    Width: =Parent.TemplateWidth - 180
                    X: =16
                    Y: =36
                    ZIndex: =3

                certOpen As label:
                    Align: =Align.Center
                    Color: =RGBA(91, 95, 199, 1)
                    FillPortions: =0
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    Size: =10
                    Text: ="Otvoriť PDF"
                    Width: =120
                    X: =Parent.TemplateWidth - 140
                    Y: =Parent.TemplateHeight/2 - 13
                    ZIndex: =4

            galAuditDetail As gallery.galleryVertical:
                Items: =Sort(Filter(colAudit, EntityID = varSelEmployee.EmployeeID), ChangedOn, SortOrder.Descending)
                Layout: =Layout.Vertical
                TemplatePadding: =0
                TemplateSize: =44
                Visible: =varTab = "audit"
                ZIndex: =6

                auditRow As label:
                    Color: =RGBA(97, 97, 97, 1)
                    FillPortions: =0
                    Height: =Parent.TemplateHeight
                    Size: =9
                    Text: |-
                        =Text(ThisItem.ChangedOn, "d.m.yyyy hh:mm") & "  •  " & ThisItem.Action & "  •  " & ThisItem.Details
                    Width: =Parent.TemplateWidth
                    ZIndex: =1

            emptyTrainings As label:
                Color: =RGBA(97, 97, 97, 1)
                Height: =30
                Text: ="Žiadne záznamy školení."
                Visible: =varTab = "trainings" && CountRows(Filter(colRecords, EmployeeID = varSelEmployee.EmployeeID)) = 0
                ZIndex: =7

